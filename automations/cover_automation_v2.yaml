blueprint:
  name: s42 - Intelligente Rollladensteuerung V2 (ein Rollladen pro Automation)
  description: >
    Steuert einen einzelnen Rollladen anhand "seines" Fensters: morgendliches Öffnen,
    Reaktion auf gekippte/geöffnete Fenster inkl. Rückfahr-Logik und Regenschutz, Nachtmodus, Sturmschutz,
    automatische Beschattung anhand des Sonnenstands (Sonnenschutz, optional mit Filter
    nach Wetterlage und temperaturunabhängigem Blendschutz), Sonnenheizen (das
    Gegenteil: öffnet in der Heizperiode heruntergelassene/vergessene Rollläden bei
    Sonne und Kälte), ein Moskito-Modus,
    der beim Öffnen des Fensters nach Sonnenuntergang die Lichter im Raum ausschaltet,
    sowie ein Abwesenheitsmodus (schließen, wenn niemand zuhause ist, und beim
    Heimkommen wieder öffnen).


    Pro Fenster/Rollladen wird eine eigene Automation aus diesem Blueprint erstellt.
    Gemeinsame Helfer (z.B. das input_datetime für morgens oder der Nachtmodus-Helfer)
    werden einfach in allen Instanzen identisch ausgewählt.


    📖 [Ausführliche Dokumentation & FAQ](https://github.com/TheRealSimon42/ha-blueprints/blob/main/docs/cover_automation_v2.md)
  domain: automation
  author: TheRealSimon42
  homeassistant:
    min_version: "2024.10.0"
  source_url: https://raw.githubusercontent.com/TheRealSimon42/ha-blueprints/main/automations/cover_automation_v2.yaml
  input:
    assignment_section:
      name: Zuordnung
      description: Der Rollladen und (optional) der zugehörige Fenstersensor.
      icon: mdi:vector-link
      input:
        cover:
          name: Rollladen
          description: Der Rollladen, den diese Automation steuert.
          selector:
            entity:
              domain: cover
        window_sensor:
          name: Fenstersensor (optional)
          description: >
            Der Fensterkontakt zu diesem Rollladen. Unterstützt werden klassische
            binäre Fensterkontakte (offen/geschlossen) ebenso wie
            Drei-Zustands-Sensoren mit offen/gekippt/geschlossen. Hinweis: Binäre
            Kontakte erscheinen in der Auswahl nur mit passender Geräteklasse
            (Tür, Fenster, Öffnung oder Garagentor) — die lässt sich in den
            Einstellungen der Entität nachrüsten.
            Leer lassen bei Festverglasung bzw. Fenstern, die sich nicht öffnen
            lassen: Das Fenster gilt dann immer als geschlossen; Fenster-Interaktion
            (Kippen/Öffnen/Zurückfahren), Benachrichtigungen und Moskito-Modus
            entfallen. ⚠️ Nicht für Balkon- oder Terrassentüren ohne Kontakt —
            Nachtmodus, Beschattung und Panzer-Modus fahren dann auch bei offener
            Tür herunter (Aussperr-Gefahr!).
          default: []
          selector:
            entity:
              filter:
                - domain: binary_sensor
                  device_class:
                    - door
                    - window
                    - opening
                    - garage_door
                - domain: sensor
    morning_section:
      name: Morgens öffnen
      description: >
        Einstellungen für das automatische Öffnen am Morgen — zu einer festen Uhrzeit
        oder nach Sonnenstand mit frühestens/spätestens.
      icon: mdi:weather-sunset-up
      collapsed: true
      input:
        morning_enabled:
          name: Morgens öffnen aktivieren
          description: >
            Hauptschalter für das morgendliche Öffnen — gilt für die Uhrzeit und
            ebenso für "Morgens nach Sonnenstand öffnen".
          default: true
          selector:
            boolean: {}
        morning_time:
          name: Uhrzeit für morgendliches Hochfahren
          description: >
            Ein input_datetime-Helfer mit der Uhrzeit für das Hochfahren
            (erforderlich, wenn "Morgens öffnen" aktiviert ist). Mit "Morgens nach
            Sonnenstand öffnen" gilt diese Uhrzeit stattdessen als "frühestens" und
            ist optional — ohne Helfer gibt es dann keine Untergrenze.
            Wichtig: einen Helfer, der NUR eine Uhrzeit enthält (ohne Datum) —
            ein Datum+Uhrzeit-Helfer feuert nur ein einziges Mal an genau diesem
            Datum und danach nie wieder. In allen Blueprint-Instanzen denselben
            Helfer auswählen.
          default: []
          selector:
            entity:
              domain: input_datetime
        morning_sun_enabled:
          name: Morgens nach Sonnenstand öffnen
          description: >
            Statt zur festen Uhrzeit öffnet der Rollladen, sobald die Sonne die
            eingestellte Höhe (nächstes Feld) überschreitet — im Sommer also früher,
            im Winter später. Die "Uhrzeit für morgendliches Hochfahren" oben gilt
            dann als "frühestens", "Spätestens öffnen um" als Obergrenze. Pro Tag wird
            genau einmal geöffnet. "Morgens öffnen aktivieren" muss eingeschaltet sein.
          default: false
          selector:
            boolean: {}
        morning_sun_elevation:
          name: Sonnenhöhe zum Öffnen
          description: >
            Sonnenhöhe (Elevation in Grad), ab der morgens geöffnet wird.
            0° ≈ Sonnenaufgang, negative Werte = schon in der Morgendämmerung
            (−6° = Beginn der bürgerlichen Dämmerung), positive Werte = erst, wenn die
            Sonne etwas höher steht. Nur mit "Morgens nach Sonnenstand öffnen".
          default: 0
          selector:
            number:
              min: -6
              max: 15
              step: 0.5
              mode: slider
              unit_of_measurement: °
        morning_latest:
          name: Spätestens öffnen um
          description: >
            Hat die Sonne die eingestellte Höhe bis zu dieser Uhrzeit noch nicht
            erreicht (z.B. im Winter), öffnet der Rollladen spätestens jetzt.
            Nur mit "Morgens nach Sonnenstand öffnen".
          default: "09:00:00"
          selector:
            time: {}
        morning_position:
          name: Zielposition für morgens
          description: >
            Die Position (in %), auf die der Rollladen morgens fährt. Es wird nur
            gefahren, wenn der Rollladen geschlossener ist als diese Position.
          default: 100
          selector:
            number:
              min: 0
              max: 100
              step: 1
              mode: slider
              unit_of_measurement: "%"
        morning_random_delay:
          name: Zufällige Verzögerung (max.)
          description: >
            Der Rollladen fährt zufällig zwischen 0 und dieser Anzahl Minuten
            später hoch als eingestellt — nur später, nie früher. Wirkt bei
            Abwesenheit bewohnt (Anwesenheitssimulation), und mehrere Rollläden
            fahren nicht exakt gleichzeitig. Pause, Sturm und Beschattung werden
            nach der Wartezeit neu geprüft. 0 = sofort (bisheriges Verhalten).
            Hinweis: Startet Home Assistant während der Wartezeit neu, entfällt
            das Öffnen an diesem Tag.
          default: 0
          selector:
            number:
              min: 0
              max: 60
              step: 1
              mode: slider
              unit_of_measurement: Minuten
        morning_soft_duration:
          name: Sanftes Öffnen über
          description: >
            Sanftes Wecken, z.B. fürs Schlafzimmer: Statt in einem Zug fährt der
            Rollladen in Schritten von der aktuellen Position zur Zielposition,
            gleichmäßig über diese Dauer verteilt (Schritte von mindestens 5 %,
            höchstens einer pro Minute — der erste zur Weckzeit, der letzte genau
            auf die Zielposition). Das sanfte Öffnen bricht ab und der Rest wird
            nicht mehr gefahren, wenn der Rollladen zwischendurch von Hand bewegt
            wird, Sturm aufkommt, die Automation pausiert, der Nachtmodus wieder
            eingeschaltet, das Fenster geöffnet/gekippt wird oder die Beschattung
            einsetzt. Braucht einen
            Rollladen mit Positionsangabe — ohne wird wie bisher in einem Zug
            geöffnet. 0 = in einem Zug öffnen (bisheriges Verhalten).
          default: 0
          selector:
            number:
              min: 0
              max: 60
              step: 1
              mode: slider
              unit_of_measurement: Minuten
    window_interaction_section:
      name: Fenster-Interaktion
      description: Wie der Rollladen auf geöffnete oder gekippte Fenster reagiert. Benötigt einen Fenstersensor.
      icon: mdi:window-open-variant
      collapsed: true
      input:
        tilted_position:
          name: Zielposition für gekipptes Fenster
          description: >
            Die Position (in %), auf die der Rollladen fährt, wenn das Fenster gekippt
            wird. Es wird nur gefahren, wenn der Rollladen geschlossener ist.
          default: 20
          selector:
            number:
              min: 0
              max: 100
              step: 1
              mode: slider
              unit_of_measurement: "%"
        open_position:
          name: Position bei geöffnetem Fenster
          description: >
            Die Position (in %), auf die der Rollladen fährt, wenn das Fenster
            komplett geöffnet wird. Es wird nur nach oben gefahren — steht der
            Rollladen bereits höher, bleibt er, wo er ist. 100 = ganz auf
            (bisheriges Verhalten). Praktisch z.B. als Durchgang für die Katze
            oder wenn der Rollladen beim Lüften nicht ganz hochfahren soll.
            Nachts (Nachtmodus aktiv) gilt stattdessen die "Nachtposition bei
            offenem Fenster", bei "Öffnen wie Kippen behandeln" die Kipp-Position.
            Rollläden ohne Positionsangabe fahren immer ganz auf.
            ⚠️ Bei Balkon- und Terrassentüren: Die Position muss hoch genug zum
            Durchgehen sein!
          default: 100
          selector:
            number:
              min: 0
              max: 100
              step: 1
              mode: slider
              unit_of_measurement: "%"
        reclose_timeout:
          name: Zeitfenster für automatisches Zurückfahren
          description: >
            Wird das Fenster innerhalb dieser Zeit wieder geschlossen, fährt der
            Rollladen in seine Ausgangsposition zurück — außer eine Automatik-Fahrt
            (Morgens öffnen, Sonnenheizen, Ende der Beschattung) hat das Ziel
            inzwischen neu gesetzt, dann bleibt er, wo er ist. Bei aktivem
            Nachtmodus schließt er stattdessen, auch nach Ablauf dieser Zeit.
          default: 30
          selector:
            number:
              min: 1
              max: 120
              step: 1
              mode: slider
              unit_of_measurement: Minuten
        force_close:
          name: Schließen erzwingen
          description: >
            Wenn aktiviert, wird der Rollladen nach Ablauf des Zeitfensters immer
            geschlossen, auch wenn das Fenster noch offen ist.
            ⚠️ Achtung: Aussperr-Gefahr!
          default: false
          selector:
            boolean: {}
        treat_open_as_tilted:
          name: Öffnen wie Kippen behandeln
          description: >
            Für Fenster mit einfachem binärem Kontakt (nur offen/geschlossen), die
            im Alltag praktisch immer nur gekippt werden — z.B. das Badfenster.
            Wenn aktiviert, wird jedes "offen" wie "gekippt" behandelt: Der
            Rollladen fährt beim Öffnen auf die Kipp-Position statt komplett auf,
            auch der Nachtmodus nutzt die Kipp-Position, und die Beschattung läuft
            weiter (mit der Kipp-Position als Lüftungsspalt), statt bei offenem
            Fenster zu pausieren. Benachrichtigungen melden weiterhin "offen" —
            das entspricht dem, was der Sensor tatsächlich sieht.
          default: false
          selector:
            boolean: {}
        window_reaction_delay:
          name: Reaktionszeit
          description: >
            So lange (in Sekunden) muss das Fenster unverändert offen, gekippt
            bzw. geschlossen sein, bevor die Automation reagiert — beim Hochfahren
            nach dem Öffnen/Kippen, beim Zurückfahren nach dem Schließen, im
            Moskito-Modus und beim Abräumen der Benachrichtigung. Größere Werte
            ignorieren kurzes Öffnen (z.B. Blumen gießen oder ein paar Sekunden
            Lüften) und filtern prellende Kontakte; dafür reagiert der Rollladen
            entsprechend später — bei Balkon- und Terrassentüren wartet man beim
            Rausgehen länger. 2 = bisheriges Verhalten. Die Wartezeiten, nach
            denen eine Benachrichtigung verschickt wird, sind davon unabhängig.
            Tipp: Viele Fenstergriff-Sensoren melden beim Drehen von "zu" auf
            "gekippt" für 2–3 Sekunden "offen". Liegt die Reaktionszeit darunter,
            fährt der Rollladen bei jedem Kippen erst ganz auf — dann 5 Sekunden
            einstellen.
          default: 2
          selector:
            number:
              min: 1
              max: 120
              step: 1
              mode: slider
              unit_of_measurement: Sekunden
    window_geometry_section:
      name: Fenstergeometrie & Sonnenausrichtung
      description: >
        Ausrichtung, Sichtfeld und Sonnenhöhen-Grenzen des Fensters. Diese Werte
        bestimmen, wann die Sonne geometrisch "ins Fenster scheint" — sowohl für den
        Sonnenschutz (Beschattung) als auch für Sonnenheizen. Wird nur eines der beiden
        Features genutzt, müssen die Werte trotzdem hier gesetzt werden.


        Zur Bedeutung von Ausrichtung und Sichtfeld:

        ![Erklärgrafik Sichtfeld](https://cdn.jsdelivr.net/gh/TheRealSimon42/ha-blueprints@main/images/sichtfeld_beschattung.svg)
      icon: mdi:sun-compass
      collapsed: true
      input:
        window_azimuth:
          name: Ausrichtung des Fensters
          description: >
            Himmelsrichtung, in die das Fenster zeigt, in Grad
            (0 = Nord, 90 = Ost, 180 = Süd, 270 = West).
          default: 180
          selector:
            number:
              min: 0
              max: 359
              step: 1
              mode: slider
              unit_of_measurement: °
        shading_fov_left:
          name: Sichtfeld links
          description: >
            Wie weit die Sonne seitlich links von der Fensterausrichtung stehen darf
            und noch als "scheint ins Fenster" gilt. 90° ist das geometrische Maximum —
            die Sonne steht dann genau in der Fassadenebene und kann das Fenster gerade
            noch treffen. Nur verkleinern, wenn auf dieser Seite ein Hindernis die Sonne
            blockiert (tiefe Laibung, Balkon, Nachbarhaus). Links/rechts gilt von innen
            am Fenster stehend mit Blick nach draußen — bei einem Südfenster ist links
            die Vormittagsseite (Osten).
          default: 90
          selector:
            number:
              min: 0
              max: 90
              step: 1
              mode: slider
              unit_of_measurement: °
        shading_fov_right:
          name: Sichtfeld rechts
          description: >
            Wie Sichtfeld links, nur rechts der Fensterausrichtung — bei einem
            Südfenster die Nachmittags-/Abendseite (Westen).
          default: 90
          selector:
            number:
              min: 0
              max: 90
              step: 1
              mode: slider
              unit_of_measurement: °
        shading_min_elevation:
          name: Minimale Sonnenhöhe
          description: >
            Unterhalb dieser Sonnenhöhe (Elevation in Grad) gilt die Sonne als nicht
            "im Fenster" (weder für Sonnenschutz noch für Sonnenheizen), z.B. weil
            Nachbargebäude oder Bäume die tiefe Sonne ohnehin blockieren.
          default: 0
          selector:
            number:
              min: 0
              max: 45
              step: 1
              mode: slider
              unit_of_measurement: °
        shading_max_elevation:
          name: Maximale Sonnenhöhe
          description: >
            Oberhalb dieser Sonnenhöhe (Elevation in Grad) gilt die Sonne als nicht
            "im Fenster" (weder für Sonnenschutz noch für Sonnenheizen) — für
            Fenster mit Vordach, Balkon, Dachüberstand oder tiefer Laibung darüber,
            die die steile Mittagssonne ohnehin abschatten. Steigt die Sonne über
            diesen Wert, endet eine laufende Beschattung regulär und beginnt neu,
            sobald die Sonne wieder darunter sinkt. Muss über der minimalen
            Sonnenhöhe liegen, sonst scheint die Sonne rechnerisch nie ins Fenster.
            90° = keine Einschränkung (bisheriges Verhalten).
          default: 90
          selector:
            number:
              min: 0
              max: 90
              step: 1
              mode: slider
              unit_of_measurement: °
    shading_section:
      name: Sonnenschutz (Beschattung)
      description: >
        Fährt den Rollladen anhand des Sonnenstands automatisch so weit herunter, dass
        die Sonne höchstens bis zur eingestellten Tiefe in den Raum scheint — und wieder
        hoch, sobald die Sonne nicht mehr ins Fenster scheint oder es abgekühlt ist.
        Sehr schräg einfallende Sonne wird dabei automatisch berücksichtigt: je flacher
        der Winkel, desto weiter oben bleibt der Rollladen. Wird der Rollladen während
        der Beschattung manuell verfahren, erkennt die Automation das und lässt ihn bis
        zum Beschattungs-Ende (oder für eine einstellbare Dauer) in Ruhe. Optional
        schützt der Blendschutz auch an kühlen Tagen vor blendender Sonne; die
        Beschattung endet dann erst, wenn die Sonne das Fenster verlässt. Ausrichtung
        und Sichtfeld werden im Abschnitt "Fenstergeometrie & Sonnenausrichtung"
        eingestellt.
        ⚠️ Benötigt einen eigenen input_boolean-Helfer pro Fenster als Status-Speicher.
      icon: mdi:sun-wireless
      collapsed: true
      input:
        shading_enabled:
          name: Sonnenschutz aktivieren
          description: >
            Benötigt zwingend den Status-Helfer (nächstes Feld) sowie die Werte im
            Abschnitt "Fenstergeometrie & Sonnenausrichtung". Fehlt der Helfer,
            erinnert eine dauerhafte Benachrichtigung in Home Assistant daran.
          default: false
          selector:
            boolean: {}
        shading_status_helper:
          name: Status-Helfer (input_boolean)
          description: >
            Erforderlich für den Sonnenschutz: ein input_boolean-Helfer NUR für dieses
            Fenster. Er merkt sich, ob die Beschattung aktiv ist, damit der Rollladen
            danach zuverlässig wieder geöffnet wird (auch über Neustarts hinweg).
          default: []
          selector:
            entity:
              domain: input_boolean
        shading_weather_states:
          name: Wetterlagen für Beschattung (optional)
          description: >
            Beschattet wird nur, wenn die Wetter-Entität (siehe Sturmschutz weiter
            unten) eine dieser Wetterlagen meldet — praktisch, um z.B. bei "bewölkt"
            trotz rechnerisch passendem Sonnenstand nicht unnötig zu beschatten.
            Leer lassen, um die Wetterlage zu ignorieren (Standardverhalten wie
            bisher — nur Sonnenstand und Temperatur zählen). Ohne gesetzte
            Wetter-Entität wird dieser Filter ignoriert, auch wenn hier Werte
            ausgewählt sind.
          default: []
          selector:
            select:
              multiple: true
              mode: list
              options:
                - value: sunny
                  label: "☀️ Sonnig"
                - value: partlycloudy
                  label: "⛅ Teilweise bewölkt"
                - value: cloudy
                  label: "☁️ Bewölkt"
                - value: clear-night
                  label: "🌙 Klare Nacht"
                - value: fog
                  label: "🌫️ Nebel"
                - value: windy
                  label: "💨 Windig"
                - value: windy-variant
                  label: "💨 Windig mit Wolken"
                - value: rainy
                  label: "🌧️ Regnerisch"
                - value: pouring
                  label: "🌧️ Starkregen"
                - value: lightning
                  label: "⛈️ Gewitter"
                - value: lightning-rainy
                  label: "⛈️ Gewitter mit Regen"
                - value: hail
                  label: "🌨️ Hagel"
                - value: snowy
                  label: "❄️ Schnee"
                - value: snowy-rainy
                  label: "🌨️ Schneeregen"
                - value: exceptional
                  label: "⚠️ Außergewöhnlich"
        shading_enable_entity:
          name: Freigabe-Helfer (optional)
          description: >
            Wenn gesetzt, beschattet die Automation nur, solange diese Entität
            eingeschaltet ("on") ist — gesteuert z.B. von einer eigenen
            Wetter-/Prognose-Automation, einem Dashboard-Schalter oder einem
            Zeitplan-Helfer. Wechselt sie auf "aus", endet eine laufende
            Beschattung sofort regulär (Fahrt auf die "Position nach der
            Beschattung"); ist sie nicht verfügbar, wird deswegen weder gestartet
            noch beendet. Fenster-Interaktion, Nachtmodus, Sturmschutz, Sonnenheizen
            und Benachrichtigungen sind davon unabhängig. Derselbe Helfer kann in
            mehreren Instanzen gewählt werden (z.B. einer pro Fassade). Leer
            lassen, um ohne externe Freigabe zu beschatten (bisheriges Verhalten).
          default: []
          selector:
            entity:
              filter:
                - domain:
                    - input_boolean
                    - binary_sensor
                    - schedule
        shading_time_from:
          name: Beschattung frühestens ab
          description: >
            Vor dieser Uhrzeit startet keine Beschattung — z.B. 09:00, damit der
            Rollladen nicht schon beim ersten Sonnenstrahl herunterfährt und dich
            morgens weckt. Bildet zusammen mit "Beschattung spätestens bis" ein
            Zeitfenster: Nur darin wird beschattet und der Sonne nachgeführt.
            Stehen beide Felder auf derselben Uhrzeit (Standard: beide 00:00:00),
            gibt es keine Einschränkung. Sonnenheizen ist davon nicht betroffen.
          default: "00:00:00"
          selector:
            time: {}
        shading_time_until:
          name: Beschattung spätestens bis
          description: >
            Ab dieser Uhrzeit startet keine Beschattung mehr, und eine laufende
            endet beim nächsten Durchlauf (alle 5 Minuten) regulär: Der Rollladen
            fährt auf die "Position nach der Beschattung" — z.B. 18:00, um abends
            die Abendsonne zu genießen. 00:00:00 = bis Mitternacht. Liegt
            "frühestens ab" später als diese Uhrzeit, reicht das Zeitfenster über
            Mitternacht hinweg.
          default: "00:00:00"
          selector:
            time: {}
        window_height:
          name: Fensterhöhe
          description: Höhe der Glasfläche in Metern.
          default: 1.3
          selector:
            number:
              min: 0.3
              max: 3.5
              step: 0.05
              mode: box
              unit_of_measurement: m
        window_sill_height:
          name: Brüstungshöhe
          description: Höhe der Fensterunterkante über dem Fußboden in Metern (bei bodentiefen Fenstern 0).
          default: 0.9
          selector:
            number:
              min: 0
              max: 2.5
              step: 0.05
              mode: box
              unit_of_measurement: m
        shading_depth:
          name: Maximale Sonneneinfall-Tiefe
          description: >
            Wie weit die Sonne maximal in den Raum scheinen darf (auf dem Fußboden
            gemessen, ab Fensterebene). Kleinere Werte = strengere Beschattung;
            bei sehr kleinen Werten fährt der Rollladen praktisch komplett zu.
          default: 1.0
          selector:
            number:
              min: 0
              max: 3
              step: 0.1
              mode: box
              unit_of_measurement: m
        glass_bottom_position:
          name: Aufsetz-Punkt (Glas-Kalibrierung)
          description: >
            Die Position (in %), bei der der Panzer gerade auf Fensterbank oder
            Boden aufsitzt und das Glas komplett abgedeckt ist — darunter schließen
            sich nur noch die Lamellen. Zum Ermitteln den Rollladen langsam
            herunterfahren, bis der Lichtspalt unten gerade verschwindet, und die
            Position ablesen. Mit gesetztem Wert rechnet die Beschattung in echter
            Glasfläche und fährt nie tiefer als diesen Punkt — die Lamellen bleiben
            offen. 0 = Motor-Position wird direkt als Glasfläche interpretiert
            (bisheriges Verhalten).
          default: 0
          selector:
            number:
              min: 0
              max: 50
              step: 1
              mode: slider
              unit_of_measurement: "%"
        glass_top_position:
          name: Oberer Glas-Endpunkt (Glas-Kalibrierung)
          description: >
            Die Position (in %), bei der das Glas gerade komplett frei ist —
            darüber wird der Panzer nur noch in den Kasten eingezogen. Meist nahe
            100 und deutlich unwichtiger als der Aufsetz-Punkt. Muss über dem
            Aufsetz-Punkt liegen, sonst wird die Kalibrierung ignoriert.
          default: 100
          selector:
            number:
              min: 50
              max: 100
              step: 1
              mode: slider
              unit_of_measurement: "%"
        shading_min_position:
          name: Minimale Beschattungsposition
          description: >
            Tiefer als diese Position fährt die Beschattung nicht (z.B. 10 %, damit
            immer etwas Tageslicht bleibt). 0 = ganz schließen erlaubt.
          default: 0
          selector:
            number:
              min: 0
              max: 100
              step: 1
              mode: slider
              unit_of_measurement: "%"
        shading_end_position:
          name: Position nach der Beschattung
          description: Position, auf die nach Ende der Beschattung gefahren wird.
          default: 100
          selector:
            number:
              min: 0
              max: 100
              step: 1
              mode: slider
              unit_of_measurement: "%"
        shading_temp_sensor:
          name: Außentemperatur-Sensor (optional)
          description: >
            Optionaler Temperatursensor für die Beschattungs-Bedingung. Wenn leer,
            wird die Temperatur der Wetter-Entität aus dem Sturmschutz verwendet —
            eines von beiden muss gesetzt sein, sonst startet die Beschattung nie
            (Ausnahme: Der Blendschutz kommt auch ohne Temperaturquelle aus).
          default: []
          selector:
            entity:
              domain: sensor
              device_class: temperature
        shading_temp_threshold:
          name: Temperatur-Schwelle
          description: >
            Beschattet wird nur, wenn die Außentemperatur über diesem Wert liegt.
            Mit aktiviertem Blendschutz wird auch bei kühlerem Wetter beschattet, dann
            aber höchstens bis zur Blendschutz-Position.
          default: 25
          selector:
            number:
              min: 10
              max: 40
              step: 0.5
              mode: slider
              unit_of_measurement: °C
        shading_temp_hysteresis:
          name: Temperatur-Hysterese
          description: >
            Die Beschattung endet erst, wenn die Temperatur um diesen Wert unter die
            Schwelle gefallen ist (verhindert ständiges Auf und Ab). Mit aktiviertem
            Blendschutz endet sie dann nicht, sondern wechselt auf den Blendschutz.
          default: 2
          selector:
            number:
              min: 0
              max: 5
              step: 0.5
              mode: slider
              unit_of_measurement: °C
        shading_start_delay:
          name: Einschaltverzögerung
          description: >
            Die Beschattung startet erst, wenn Sonnenstand, Temperatur und
            Wetterlage sie so viele Minuten ununterbrochen erlauben — verhindert
            Pendeln bei Quellwolken, wenn die Sonne nur kurz durchkommt. Spricht
            danach noch etwas anderes dagegen (Fenster offen, Nachtmodus, Sturm,
            Pause, Freigabe, Zeitfenster, Regen, Abwesenheit, Hindernis), startet
            die Beschattung beim nächsten 5-Minuten-Takt, sobald das entfällt — ohne
            erneute Wartezeit. Nach einem Neustart von Home Assistant beginnt die
            Wartezeit von vorn.
            0 = keine Verzögerung (bisheriges Verhalten: Start beim nächsten
            5-Minuten-Takt).
          default: 0
          selector:
            number:
              min: 0
              max: 60
              step: 1
              mode: slider
              unit_of_measurement: Minuten
        shading_end_delay:
          name: Ausschaltverzögerung
          description: >
            Die Beschattung endet erst, wenn ein Ende-Grund (Sonne nicht mehr im
            Fenster, Temperatur unter Schwelle minus Hysterese — nicht mit
            Blendschutz —, nicht erlaubte Wetterlage) so viele Minuten ununterbrochen besteht — eine kurze Wolke
            öffnet den Rollladen dann nicht gleich wieder. Mit gesetztem Wert
            ersetzt sie die feste 10-Minuten-Trägheit des Wetterlagen-Filters.
            Nach einem Neustart von Home Assistant beginnt die Wartezeit von vorn.
            0 = keine Verzögerung (bisheriges Verhalten: Ende beim nächsten
            5-Minuten-Takt).
          default: 0
          selector:
            number:
              min: 0
              max: 120
              step: 1
              mode: slider
              unit_of_measurement: Minuten
        glare_enabled:
          name: Blendschutz (unabhängig von der Temperatur)
          description: >
            Beschattet auch, wenn die Außentemperatur unter der Schwelle liegt oder
            keine Temperaturquelle verfügbar ist — gegen Blendung im Frühjahr,
            Herbst und Winter, z.B. tief stehende Sonne auf dem Monitor oder morgens
            im Ost-Badezimmer. Der Rollladen fährt dabei auf die berechnete
            Beschattungsposition, aber nie tiefer als die Blendschutz-Position
            (nächstes Feld) — und nur herunter: Steht er schon tiefer (z.B. morgens
            noch zu), bleibt er dort. Ist es warm genug, gilt die normale Beschattung;
            kühlt es ab, wechselt sie auf den Blendschutz, statt zu enden. Beendet wird
            erst, wenn die Sonne das Fenster verlässt oder die Wetterlage stabil nicht
            mehr passt. Sturm, Nachtmodus und offenes Fenster blockieren wie beim
            Sonnenschutz. Wirkt nur bei aktiviertem Sonnenschutz und nutzt dessen
            Status-Helfer. Tipp: Mit den Wetterlagen für Beschattung (z.B. nur
            sonnig und teilweise bewölkt) kombinieren, damit an trüben Tagen nicht
            beschattet wird.
          default: false
          selector:
            boolean: {}
        glare_position:
          name: Blendschutz-Position
          description: >
            Tiefer als diese Position (in %) fährt der Blendschutz nie — liegt die
            berechnete Beschattungsposition höher, gilt diese. Blendschutz bleibt
            damit immer "leichter" als der Hitzeschutz. Wirkt nur bei aktiviertem
            Blendschutz; Werte unter der minimalen Beschattungsposition bzw. dem
            Aufsetz-Punkt haben keine Wirkung.
          default: 50
          selector:
            number:
              min: 0
              max: 100
              step: 1
              mode: slider
              unit_of_measurement: "%"
        shading_min_change:
          name: Minimale Positionsänderung
          description: >
            Der Rollladen wird beim Nachführen nur bewegt, wenn sich die Zielposition
            um mindestens diesen Wert von der aktuellen unterscheidet (schont den Motor).
          default: 5
          selector:
            number:
              min: 1
              max: 25
              step: 1
              mode: slider
              unit_of_measurement: "%"
        shading_override_threshold:
          name: Toleranz für manuelle Eingriffe
          description: >
            Weicht die Ist-Position während laufender Beschattung um mehr als diesen
            Wert von der berechneten Sollposition ab, wertet die Automation das als
            manuellen Eingriff und lässt den Rollladen in Ruhe — bis die Beschattung
            endet und normal wieder geöffnet wird (oder die Dauer im nächsten Feld
            abgelaufen ist). Kleinere Abweichungen gelten als normales Nachführen
            der Sonne.
            Mit aktiviertem Blendschutz zählt der Wechsel zwischen Hitze- und
            Blendschutz-Ziel direkt nach dem Überschreiten der Temperatur-Schaltpunkte
            nicht als Eingriff.
          default: 20
          selector:
            number:
              min: 10
              max: 60
              step: 1
              mode: slider
              unit_of_measurement: "%"
        shading_override_duration:
          name: Dauer für manuelle Eingriffe
          description: >
            Wie lange ein erkannter manueller Eingriff respektiert wird. Steht der
            Rollladen seit mindestens dieser Dauer still, fährt die Beschattung
            wieder auf ihre Sollposition und führt danach normal nach — z.B. 60
            Minuten, damit ein Handgriff vom Mittag nicht den ganzen Nachmittag
            blockiert. Jede weitere Bewegung startet die Wartezeit neu. Gilt in
            beide Richtungen: Auch ein von Hand weiter geschlossener Rollladen
            fährt danach wieder auf die Sollposition. 0 = bis zum Ende der
            Beschattung in Ruhe lassen (bisheriges Verhalten).
          default: 0
          selector:
            number:
              min: 0
              max: 480
              step: 5
              mode: slider
              unit_of_measurement: Minuten
        min_move_interval:
          name: Mindestabstand zwischen Nachführ-Fahrten
          description: >
            Schont den Motor: Das Nachführen einer laufenden Beschattung und das
            Öffnen durch Sonnenheizen warten, bis der Rollladen mindestens so
            lange stillsteht — egal, ob ihn zuletzt die Automatik, der
            Wandtaster oder die App bewegt hat. Eine übersprungene Fahrt holt
            die nächste Prüfung (alle 5 Minuten) nach Ablauf des Abstands nach.
            Nicht verzögert werden Sturmschutz, Nachtmodus, Morgens öffnen,
            Fenster-Interaktion und der "Rollladen schließen"-Knopf (Schutz bzw.
            direkte Reaktion auf ein Ereignis) sowie Beginn und Ende einer
            Beschattung: Sie schalten den Status-Helfer um und dürfen nicht
            verschluckt werden, sonst bliebe der Raum ohne Schatten bzw. der
            Rollladen nach dem Ende unten.
            ⚠️ Während des Abstands wandert die Sonne weiter — bei Ost- und
            Westfenstern morgens bzw. abends um bis zu ca. 25 % in 10 Minuten.
            Ist der nachgeholte Schritt größer als die "Toleranz für manuelle
            Eingriffe", gilt er als manueller Eingriff und das Nachführen ruht
            bis zum Beschattungs-Ende — die Toleranz dann entsprechend erhöhen.
            0 = kein Mindestabstand (bisheriges Verhalten).
          default: 0
          selector:
            number:
              min: 0
              max: 60
              step: 5
              mode: slider
              unit_of_measurement: Minuten
        force_shading:
          name: Beschattung erzwingen
          description: >
            Wenn aktiviert, wird auch bei komplett geöffnetem Fenster beschattet —
            praktisch, damit es nicht aufheizt, wenn man das Fenster mal vergisst.
            Als Lüftungsspalt bleibt dabei mindestens die Kipp-Position stehen.
            ⚠️ Achtung: Für Balkon- und Terrassentüren nicht empfohlen — Aussperr-Gefahr!
          default: false
          selector:
            boolean: {}
    solar_heating_section:
      name: Sonnenheizen (Winter)
      description: >
        Das Gegenteil des Sonnenschutzes: Öffnet einen heruntergelassenen (z.B.
        vergessenen) Rollladen automatisch, wenn die Sonne laut Sonnenstand ins
        Fenster scheint und es draußen kalt ist — damit die Sonne kostenlos beim
        Aufheizen des Raums hilft. Nutzt dieselbe Fensterausrichtung/Sichtfeld wie
        der Sonnenschutz (Abschnitt "Fenstergeometrie & Sonnenausrichtung"), läuft
        aber unabhängig davon, ob der Sonnenschutz selbst aktiviert ist.
        Der Sturmschutz hat immer Vorrang — bei Starkwind greift Sonnenheizen nicht.
        Der "Mindestabstand zwischen Nachführ-Fahrten" aus dem Sonnenschutz-Abschnitt
        gilt auch für das Öffnen durch Sonnenheizen.
        ⚠️ Benötigt einen EIGENEN input_boolean-Helfer (nicht denselben wie der
        Sonnenschutz-Helfer!).
      icon: mdi:sun-thermometer
      collapsed: true
      input:
        solar_heating_enabled:
          name: Sonnenheizen aktivieren
          description: >
            Benötigt zwingend den Status-Helfer (nächstes Feld) sowie die Werte im
            Abschnitt "Fenstergeometrie & Sonnenausrichtung". Fehlt der Helfer,
            erinnert eine dauerhafte Benachrichtigung in Home Assistant daran.
          default: false
          selector:
            boolean: {}
        solar_heating_status_helper:
          name: Status-Helfer (input_boolean)
          description: >
            Erforderlich für Sonnenheizen: ein eigener input_boolean-Helfer NUR für
            dieses Fenster (separat vom Sonnenschutz-Helfer). Verhindert, dass ein
            manuell wieder heruntergelassener Rollladen im selben Zeitraum erneut
            aufgedrängt wird — erst wenn die Bedingungen (Sonne/Temperatur) einmal
            enden und neu eintreten, öffnet Sonnenheizen wieder.
          default: []
          selector:
            entity:
              domain: input_boolean
        solar_heating_temp_threshold:
          name: Temperatur-Schwelle
          description: >
            Sonnenheizen greift nur, wenn die Außentemperatur unter diesem Wert
            liegt (Heizperiode). Nutzt denselben Temperatursensor bzw. dieselbe
            Wetter-Entität wie der Sonnenschutz (Außentemperatur-Sensor bzw.
            Wetter-Entität aus dem Sturmschutz-Abschnitt).
            ⚠️ Sollte deutlich unter der Beschattungs-Temperatur-Schwelle liegen,
            damit sich Sonnenschutz und Sonnenheizen bei überlappenden Werten nicht
            widersprechen (gleichzeitig schließen und öffnen wollen).
          default: 12
          selector:
            number:
              min: -10
              max: 20
              step: 0.5
              mode: slider
              unit_of_measurement: °C
        solar_heating_temp_hysteresis:
          name: Temperatur-Hysterese
          description: >
            Sonnenheizen endet erst, wenn die Temperatur um diesen Wert über die
            Schwelle gestiegen ist (verhindert ständiges Auf und Ab).
          default: 2
          selector:
            number:
              min: 0
              max: 5
              step: 0.5
              mode: slider
              unit_of_measurement: °C
        solar_heating_min_position:
          name: Grenzwert "heruntergelassen"
          description: >
            Der Rollladen gilt erst unterhalb dieser Position als "heruntergelassen"
            und wird nur dann durch Sonnenheizen geöffnet (verhindert unnötiges
            Nachfahren bei einem bereits fast offenen Rollladen).
          default: 50
          selector:
            number:
              min: 0
              max: 100
              step: 1
              mode: slider
              unit_of_measurement: "%"
        solar_heating_position:
          name: Zielposition
          description: >
            Position (in %), auf die der Rollladen beim Sonnenheizen geöffnet wird.
          default: 100
          selector:
            number:
              min: 0
              max: 100
              step: 1
              mode: slider
              unit_of_measurement: "%"
    frost_protection_section:
      name: Frostschutz
      description: >
        Bei Frost kann der Rollladenpanzer im Kasten oder in den Führungsschienen
        festfrieren. Fährt der Motor dann ganz hoch, reißt er am Panzer — Gurt,
        Aufhängung oder Lamellen können Schaden nehmen. Der Frostschutz begrenzt
        deshalb bei Frost die automatischen Öffnungsfahrten auf eine maximale
        Position: morgens öffnen, Öffnen beim Fensteröffnen, die Position nach der
        Beschattung und Sonnenheizen. Der Sturmschutz fährt bewusst weiterhin ganz
        hoch, weil ein teilweise heruntergelassener Panzer im Wind flattert.
      icon: mdi:snowflake-alert
      collapsed: true
      input:
        frost_enabled:
          name: Frostschutz aktivieren
          description: >
            Nutzt dieselbe Temperaturquelle wie Sonnenschutz und Sonnenheizen: den
            Außentemperatur-Sensor aus dem Abschnitt "Sonnenschutz" bzw., wenn dort
            keiner gesetzt ist, die Temperatur der Wetter-Entität aus dem Abschnitt
            "Sturmschutz" — beides wirkt auch, wenn diese Features selbst
            deaktiviert sind. Ohne verfügbare Temperatur greift der Frostschutz
            nicht, der Rollladen öffnet dann wie gewohnt. Deaktiviert (Standard) =
            bisheriges Verhalten ohne Begrenzung.
          default: false
          selector:
            boolean: {}
        frost_temp_threshold:
          name: Temperatur-Schwelle
          description: >
            Der Frostschutz greift, wenn die Außentemperatur bei oder unter diesem
            Wert liegt. Ein kleiner Puffer über 0 °C (z.B. 2 °C) fängt Raureif und
            geschützt hängende Sensoren ab. Geprüft wird nur im Moment einer
            Öffnungsfahrt — eine Hysterese ist deshalb nicht nötig.
          default: 0
          selector:
            number:
              min: -15
              max: 10
              step: 0.5
              mode: slider
              unit_of_measurement: °C
        frost_max_position:
          name: Maximale Öffnungsposition bei Frost
          description: >
            Weiter als bis zu dieser Position (in %) öffnet die Automatik bei Frost
            nicht — der Panzer wird nicht bis zum Anschlag in den Kasten gezogen.
            Kipp- und Nachtlüftungs-Position werden nicht begrenzt (sie liegen
            normalerweise deutlich darunter), ebenso wenig das Zurückfahren nach
            dem Lüften. ⚠️ Rollläden ohne Positions-Angabe (nur auf/zu) lassen sich
            nicht begrenzen und öffnen auch bei Frost ganz.
          default: 90
          selector:
            number:
              min: 50
              max: 100
              step: 1
              mode: slider
              unit_of_measurement: "%"
    mosquito_section:
      name: Moskito-Modus
      description: >
        Schaltet die Lichter im Raum aus, wenn das Fenster nach Einbruch der Dunkelheit
        geöffnet oder gekippt wird — damit das Licht keine Insekten anlockt.
        Benötigt einen Fenstersensor.
      icon: mdi:bug
      collapsed: true
      input:
        mosquito_enabled:
          name: Moskito-Modus aktivieren
          default: false
          selector:
            boolean: {}
        mosquito_area:
          name: Bereich (optional)
          description: >
            Der Bereich, dessen Lichter ausgeschaltet werden. Wenn leer, wird
            automatisch der Bereich des Fenstersensors verwendet.
          default: ""
          selector:
            area: {}
        mosquito_exclude:
          name: Ausnahmen
          description: >
            Diese Lichter bleiben an (z.B. eine rote Stehlampe fürs Baby).
          default: []
          selector:
            entity:
              domain: light
              multiple: true
        mosquito_after_time:
          name: Frühestens ab (optional)
          description: >
            Zusätzliche Zeitbedingung: Der Moskito-Modus greift erst ab dieser Uhrzeit
            (und nur, wenn die Sonne unter dem Horizont ist). 00:00:00 = keine Einschränkung.
          default: "00:00:00"
          selector:
            time: {}
    night_mode_section:
      name: Nachtmodus
      description: >
        Schließen der Rollläden bei Nacht — über einen gemeinsamen Helfer, über eine
        eigene Uhrzeit für dieses Fenster oder nach Sonnenstand. Nur eines davon nutzen.
      icon: mdi:weather-night
      collapsed: true
      input:
        night_mode_boolean:
          name: Nachtmodus-Helfer (optional)
          description: >
            Ein input_boolean-Helfer. Wird er eingeschaltet, fährt der Rollladen für
            die Nacht herunter. Leer lassen, wenn kein Nachtmodus gewünscht ist oder
            stattdessen die Nachtmodus-Uhrzeit bzw. der Sonnenstand (folgende Felder)
            genutzt wird. In allen Blueprint-Instanzen denselben Helfer auswählen.
          default: []
          selector:
            entity:
              domain: input_boolean
        night_mode_time:
          name: Nachtmodus-Uhrzeit (optional)
          description: >
            Alternative zum Nachtmodus-Helfer: ein input_datetime-Helfer mit der
            Uhrzeit, zu der dieser Rollladen für die Nacht herunterfährt — z.B. wenn
            ein Fenster früher schließen soll als der Rest. Die Nacht gilt dann bis
            zur Uhrzeit für morgendliches Hochfahren (sofern dort ein Helfer gewählt
            ist), sonst bis Sonnenaufgang. Nur EINE Nacht-Quelle nutzen: Helfer,
            Uhrzeit oder Sonnenstand. Sind mehrere gesetzt, gilt Helfer vor Uhrzeit
            vor Sonnenstand, und eine dauerhafte Benachrichtigung in Home Assistant
            weist darauf hin.
            Wichtig: einen Helfer, der NUR eine Uhrzeit enthält (ohne Datum).
          default: []
          selector:
            entity:
              domain: input_datetime
        night_close_position:
          name: Nachtposition bei geschlossenem Fenster
          description: >
            Position (in %), auf die nachts gefahren wird, wenn das Fenster
            geschlossen ist. 0 = ganz schließen (bisheriges Verhalten). Bei einem
            höheren Wert wird nur abwärts gefahren: Steht der Rollladen schon
            tiefer, bleibt er dort — nachts wird nie wieder teilweise geöffnet.
            Tipp: Wer nachts einen Lüftungsschlitz möchte, stellt eine kleine
            Position ein (z.B. denselben Wert wie "Nachtposition bei offenem
            Fenster"). Rollläden ohne Positionsangabe (nur auf/zu) schließen
            weiterhin ganz.
            ⚠️ Keine allgemeine Untergrenze: Sturmschutz im Panzer-Modus,
            "Schließen erzwingen" und der "Rollladen schließen"-Knopf einer
            Benachrichtigung schließen weiterhin ganz, und bei gekipptem/offenem
            Fenster fährt der Nachtmodus wie bisher auf die Kipp-Position bzw. die
            Nachtposition bei offenem Fenster — diese daher nicht tiefer einstellen.
          default: 0
          selector:
            number:
              min: 0
              max: 100
              step: 1
              mode: slider
              unit_of_measurement: "%"
        night_sun_enabled:
          name: Nachtmodus nach Sonnenstand
          description: >
            Dritte Alternative zu Helfer und Uhrzeit: Die Nacht beginnt, sobald die
            Sonne abends unter die eingestellte Höhe sinkt — aber nie vor
            "frühestens" und spätestens zu "spätestens" (Felder unten). Der Rollladen
            schließt pro Abend genau einmal. Die Nacht gilt dann bis zur Uhrzeit für
            morgendliches Hochfahren (sofern dort ein Helfer gewählt ist), sonst bis
            Sonnenaufgang. Nur EINE Nacht-Quelle nutzen; sind mehrere gesetzt, gilt
            Helfer vor Uhrzeit vor Sonnenstand, und eine dauerhafte Benachrichtigung
            in Home Assistant weist darauf hin.
          default: false
          selector:
            boolean: {}
        night_sun_elevation:
          name: Sonnenhöhe für Nachtmodus
          description: >
            Sonnenhöhe (Elevation in Grad), unter der abends die Nacht beginnt.
            0° ≈ Sonnenuntergang, −3° ≈ mitten in der Abenddämmerung, −6° = Ende der
            bürgerlichen Dämmerung (draußen wird es dunkel). Positive Werte schließen
            schon vor Sonnenuntergang. Nur mit "Nachtmodus nach Sonnenstand".
          default: -3
          selector:
            number:
              min: -12
              max: 10
              step: 0.5
              mode: slider
              unit_of_measurement: °
        night_earliest:
          name: Nachtmodus frühestens um
          description: >
            Vor dieser Uhrzeit beginnt die Nacht nie, auch wenn die Sonne (z.B. im
            Winter) schon tiefer steht — dann schließt der Rollladen genau zu dieser
            Uhrzeit. Nur mit "Nachtmodus nach Sonnenstand".
          default: "18:00:00"
          selector:
            time: {}
        night_latest:
          name: Nachtmodus spätestens um
          description: >
            Ist die Sonne bis zu dieser Uhrzeit noch nicht unter die eingestellte Höhe
            gesunken (z.B. im Hochsommer), beginnt die Nacht spätestens jetzt. Darf
            auch kurz nach Mitternacht liegen (z.B. 00:30), aber nicht erst in der
            Morgendämmerung. Nur mit "Nachtmodus nach Sonnenstand".
          default: "22:30:00"
          selector:
            time: {}
        night_ventilation_position:
          name: Nachtposition bei offenem Fenster
          description: >
            Position (in %), auf die nachts gefahren wird, wenn das Fenster komplett
            offen ist. Bei gekipptem Fenster wird die Kipp-Position verwendet.
          default: 15
          selector:
            number:
              min: 0
              max: 100
              step: 1
              mode: slider
              unit_of_measurement: "%"
        night_random_delay:
          name: Zufällige Verzögerung (max.)
          description: >
            Der Rollladen fährt nach dem Einschalten des Nachtmodus zufällig
            zwischen 0 und dieser Anzahl Minuten später herunter — nur später, nie
            früher. Wirkt bei Abwesenheit bewohnt (Anwesenheitssimulation), und
            mehrere Rollläden fahren nicht exakt gleichzeitig. Ist der Nachtmodus
            nach der Wartezeit wieder aus oder die Automatik pausiert, entfällt
            die Fahrt — ebenso bei Sturm (außer im Panzer-Modus). 0 = sofort
            (bisheriges Verhalten). Hinweis: Startet Home Assistant während der
            Wartezeit neu, entfällt die Fahrt.
          default: 0
          selector:
            number:
              min: 0
              max: 60
              step: 1
              mode: slider
              unit_of_measurement: Minuten
    away_section:
      name: Abwesenheit
      description: >
        Reagiert darauf, dass niemand mehr zuhause ist: Rollladen beim Verlassen
        schließen, beim Heimkommen tagsüber wieder öffnen und während der
        Abwesenheit strenger beschatten. Morgens-Öffnen und Nachtmodus laufen
        auch während der Abwesenheit normal weiter — im Urlaub fahren die
        Rollläden damit weiter im Tagesrhythmus, statt tagelang unten zu bleiben.
        Ohne Anwesenheits-Entitäten ist dieser Abschnitt wirkungslos.
      icon: mdi:home-export-outline
      collapsed: true
      input:
        presence_entities:
          name: Anwesenheits-Entitäten
          description: >
            Woran die Automation erkennt, ob jemand zuhause ist — z.B. Personen,
            Geräte-Tracker, eine Personen-Gruppe, die Zone "Zuhause" oder ein
            eigener Anwesenheits-Helfer. Als abwesend gilt das Haus erst, wenn
            ALLE ausgewählten Entitäten "weg" melden: Personen/Tracker nicht
            "home", Gruppen/Binärsensoren/Helfer nicht "on"/"home", Zonen mit 0
            Personen. Eine nicht verfügbare oder unbekannte Entität zählt als
            anwesend (lieber einmal nicht schließen als unerwartet fahren) —
            deshalb nur Personen mit zugeordnetem Tracker auswählen.
            Leer = Abwesenheitsfunktionen aus. In allen Blueprint-Instanzen
            dieselben Entitäten auswählen.
          default: []
          selector:
            entity:
              multiple: true
              filter:
                - domain:
                    - person
                    - device_tracker
                    - group
                    - zone
                    - binary_sensor
                    - input_boolean
        away_delay:
          name: Wartezeit bis "abwesend"
          description: >
            So lange müssen alle ununterbrochen weg sein, bevor die Abwesenheit
            gilt — verhindert Fahrten, wenn jemand nur kurz zum Briefkasten geht
            oder ein Tracker kurz aussetzt. Das Heimkommen wirkt dagegen sofort.
          default: 10
          selector:
            number:
              min: 0
              max: 120
              step: 1
              mode: slider
              unit_of_measurement: Minuten
        away_close_enabled:
          name: Bei Abwesenheit schließen
          description: >
            Fährt den Rollladen auf die Abwesenheits-Position (nächstes Feld),
            sobald alle für die Wartezeit weg sind — nur abwärts, nicht während
            einer Pause, und bei Sturm hat der Sturmschutz Vorrang. Solange
            niemand zuhause ist und der Rollladen unten steht, öffnen ihn auch
            Sonnenschutz und Sonnenheizen nicht. Kommt nach einer echten
            Abwesenheit jemand zurück, steht der Rollladen noch auf oder unter der
            Abwesenheits-Position (egal wer ihn dorthin gefahren hat) und ist es
            weder Nacht (Nachtmodus-Helfer an) noch dunkel, öffnet er auf die
            Zielposition für morgens; die Beschattung bewertet danach der nächste
            Durchlauf neu.
            ⚠️ Aussperr-Schutz: Ist das Fenster bzw. die Tür offen oder gekippt,
            wird nicht geschlossen — vielleicht steht doch jemand ohne Handy auf
            dem Balkon.
          default: false
          selector:
            boolean: {}
        away_close_position:
          name: Position bei Abwesenheit
          description: >
            Die Position (in %), auf die der Rollladen bei Abwesenheit fährt. Es
            wird nur gefahren, wenn der Rollladen offener ist als diese Position.
            0 = ganz schließen.
          default: 0
          selector:
            number:
              min: 0
              max: 100
              step: 1
              mode: slider
              unit_of_measurement: "%"
        away_shading_strict:
          name: Strenger beschatten bei Abwesenheit
          description: >
            Solange niemand zuhause ist, gilt für den Sonnenschutz die maximale
            Sonneneinfall-Tiefe aus dem nächsten Feld statt der normalen —
            mehr Hitzeschutz, wenn ein dunklerer Raum niemanden stört. Wirkt ab
            Ablauf der Wartezeit bis zum Heimkommen und braucht den aktivierten
            Sonnenschutz.
          default: false
          selector:
            boolean: {}
        away_shading_depth:
          name: Maximale Sonneneinfall-Tiefe bei Abwesenheit
          description: >
            Wie die maximale Sonneneinfall-Tiefe im Sonnenschutz, gilt aber nur
            während der Abwesenheit. Ist die normale Tiefe bereits kleiner, bleibt
            es bei der normalen.
          default: 0.3
          selector:
            number:
              min: 0
              max: 3
              step: 0.1
              mode: box
              unit_of_measurement: m
    storm_protection_section:
      name: Sturmschutz
      description: Fährt den Rollladen bei starkem Wind hoch (oder im Panzer-Modus herunter).
      icon: mdi:weather-windy
      collapsed: true
      input:
        storm_enabled:
          name: Sturmschutz aktivieren
          description: Benötigt eine Wetter-Entität oder einen Wind-Sensor (unten auswählen).
          default: false
          selector:
            boolean: {}
        weather_entity:
          name: Wetter-Entität
          description: >
            Deine Wetter-Entität (z.B. von DWD oder der Standard-Integration).
            Für den Sturmschutz wird ihr wind_speed-Attribut verwendet, sofern kein
            Wind-Sensor gesetzt ist; außerdem dient sie als Temperatur-Fallback
            für den Sonnenschutz.
          default: []
          selector:
            entity:
              domain: weather
        storm_wind_sensor:
          name: Wind-Sensor (optional)
          description: >
            Alternativ zur Wetter-Entität: ein Sensor mit Windgeschwindigkeit, z.B.
            der Böen-Sensor deiner Wetterstation (Böen sind für den Sturmschutz meist
            aussagekräftiger als der Mittelwind). Wenn gesetzt, hat er Vorrang vor
            der Wetter-Entität.
          default: []
          selector:
            entity:
              domain: sensor
              device_class: wind_speed
        wind_speed_threshold:
          name: Windgeschwindigkeit-Grenzwert
          description: >
            Ab dieser Windgeschwindigkeit wird der Sturmschutz ausgelöst (ca. 55 km/h
            empfohlen). Wichtig: Der Wert wird direkt mit dem Sensorwert bzw. dem
            wind_speed-Attribut der Wetter-Entität verglichen — liefert deine Quelle
            m/s oder mph statt km/h, muss der Grenzwert entsprechend umgerechnet werden.
          default: 55
          selector:
            number:
              min: 30
              max: 120
              step: 1
              mode: slider
              unit_of_measurement: km/h
        storm_trigger_delay:
          name: Auslöseverzögerung
          description: >
            So lange muss der Wind ununterbrochen über dem Grenzwert liegen, bevor
            der Sturmschutz den Rollladen bewegt — einzelne kurze Böen lösen dann
            nicht sofort aus. Fällt der Wert zwischendurch unter den Grenzwert oder
            ist die Windquelle kurz nicht verfügbar, beginnt die Wartezeit von vorn.
            Morgens-Öffnen, Beschattung und Sonnenheizen setzen weiterhin sofort
            aus, solange der Wind über dem Grenzwert liegt.
            0 = sofort auslösen (bisheriges Verhalten).
          default: 0
          selector:
            number:
              min: 0
              max: 300
              step: 1
              mode: slider
              unit_of_measurement: Sekunden
        storm_release_delay:
          name: Entwarnung nach
          description: >
            Liegt der Wind nach einem Sturm so lange ununterbrochen unter dem
            Grenzwert, stellt die Automation den Normalzustand wieder her: Bei
            aktivem Nachtmodus wird der Nachtzustand nachgeholt (je nach Fenster
            geschlossen oder Lüftungsposition). Tagsüber öffnet sie im Panzer-Modus
            einen noch geschlossenen Rollladen auf die Zielposition für morgens
            (Fensterregel wie beim Sturmschutz, nicht während laufender
            Beschattung); ohne Panzer-Modus bleibt er oben. "Tagsüber" heißt:
            Nachtmodus aus, Sonne über dem Horizont und die Uhrzeit fürs
            Morgens-Öffnen (falls eingerichtet) vorbei. Ist ein Wind-Sensor gesetzt,
            entscheidet nur er. Während einer Pause entfällt die Entwarnung.
            0 = keine Entwarnung — der Rollladen bleibt nach dem Sturm in der
            Schutzposition, bis ein reguläres Ereignis ihn übernimmt (bisheriges
            Verhalten).
          default: 0
          selector:
            number:
              min: 0
              max: 180
              step: 1
              mode: slider
              unit_of_measurement: Minuten
        panzer_mode:
          name: Panzer-Modus
          description: Wenn aktiviert, wird der Rollladen bei Sturm geschlossen statt geöffnet.
          default: false
          selector:
            boolean: {}
        force_storm_action:
          name: Aktion bei Sturm erzwingen
          description: >
            Wenn aktiviert, wird der Rollladen bei Sturm auch bewegt, wenn das Fenster
            offen ist. ⚠️ Achtung: Aussperr-Gefahr!
          default: false
          selector:
            boolean: {}
    emergency_section:
      name: Notfall-Öffnen
      description: >
        Fährt den Rollladen im Notfall sofort ganz auf — z.B. bei Feueralarm
        (Fluchtweg und Zugang für die Feuerwehr) oder bei einer Hagelwarnung
        (Behang vor Hagel schützen).
      icon: mdi:fire-alert
      collapsed: true
      input:
        emergency_sensors:
          name: Notfall-Sensoren (optional)
          description: >
            Ein oder mehrere binäre Sensoren oder input_boolean-Helfer, z.B. Rauch-
            oder CO-Melder oder eine Hagelwarnung. Sobald einer davon "an" meldet,
            fährt der Rollladen ganz auf und bleibt oben, solange einer aktiv ist:
            In dieser Zeit bewegt die Automatik ihn nicht (weder Nachtmodus noch
            Beschattung, Sturmschutz, Zurückfahren nach dem Lüften oder der
            "Rollladen schließen"-Knopf einer Benachrichtigung), und der
            Moskito-Modus schaltet keine Lichter aus. Nicht verfügbare Sensoren
            zählen nicht als Alarm. Sind alle wieder aus, wird ein inzwischen
            aktiver Nachtmodus nachgeholt. Leer lassen = kein Notfall-Öffnen
            (bisheriges Verhalten).
            ⚠️ Achtung: Das Öffnen hat Vorrang vor allem anderen — auch vor
            Pause, Fensterzustand und Sturmschutz (inkl. Panzer-Modus). Der
            Rollladen fährt also auch bei offenem Fenster und bei Starkwind hoch.
          default: []
          selector:
            entity:
              multiple: true
              filter:
                - domain: binary_sensor
                - domain: input_boolean
    rain_protection_section:
      name: Regenschutz beim Lüften
      description: >
        Fährt den Rollladen bei Regen auf eine Schutzposition, solange das Fenster
        gekippt ist — damit es beim Lüften (z.B. die ganze Nacht über) nicht
        hereinregnet. Nach dem Regen fährt er auf die Position von vor dem Regen
        zurück. Solange der Regenschutz greift, fahren Morgens-Öffnen, Nachtmodus,
        Beschattung und Sonnenheizen den Rollladen nicht über die Regenposition.
        Der Sturmschutz hat Vorrang. Ohne Regensensor ist das Feature aus.
      icon: mdi:weather-pouring
      collapsed: true
      input:
        rain_sensor:
          name: Regensensor (optional)
          description: >
            Ein binärer Regensensor oder ein input_boolean-Helfer — "an" bedeutet
            Regen. Leer lassen, um den Regenschutz nicht zu nutzen. Wetter-Entität
            oder Regenmengen-Sensor lassen sich über einen Template-Binärsensor
            einbinden (siehe Dokumentation).
          default: []
          selector:
            entity:
              filter:
                - domain: binary_sensor
                - domain: input_boolean
        rain_position:
          name: Position bei Regen
          description: >
            Die Position (in %), auf die der Rollladen bei Regen und gekipptem
            Fenster fährt. Es wird nur heruntergefahren — steht der Rollladen
            bereits tiefer, bleibt er, wo er ist.
          default: 10
          selector:
            number:
              min: 0
              max: 100
              step: 1
              mode: slider
              unit_of_measurement: "%"
        rain_delay:
          name: Verzögerung bei Regenbeginn
          description: >
            Der Regenschutz greift erst, wenn der Regensensor so lange ununterbrochen
            Regen meldet (filtert einzelne Tropfen und Fehlmeldungen). 0 = sofort.
          default: 2
          selector:
            number:
              min: 0
              max: 30
              step: 1
              mode: slider
              unit_of_measurement: Minuten
        rain_restore:
          name: Nach dem Regen zurückfahren
          description: >
            Wenn aktiviert, fährt der Rollladen nach dem Regen wieder auf die
            Position von vor dem Regen — sofern das Fenster dann noch gekippt
            (bzw. geöffnet, siehe unten) ist und weder Nachtmodus, Sturm noch
            Pause aktiv sind. Ein während des
            Regens fälliges Morgens-Öffnen wird dabei nachgeholt. Wird das Fenster
            vorher geschlossen, übernimmt die normale Fenster-Interaktion.
          default: true
          selector:
            boolean: {}
        rain_restore_delay:
          name: Zurückfahren nach X Min. ohne Regen
          description: >
            So lange muss der Regensensor ununterbrochen "kein Regen" melden, bevor
            zurückgefahren wird (verhindert ständiges Auf und Ab bei Schauern).
          default: 15
          selector:
            number:
              min: 1
              max: 120
              step: 1
              mode: slider
              unit_of_measurement: Minuten
        rain_include_open:
          name: Auch bei ganz geöffnetem Fenster
          description: >
            Standardmäßig greift der Regenschutz nur bei gekipptem Fenster (bzw.
            bei offenem, wenn "Öffnen wie Kippen behandeln" aktiv ist). Wenn
            aktiviert, fährt der Rollladen auch bei komplett geöffnetem Fenster
            auf die Regenposition.
            ⚠️ Achtung: Für Balkon- und Terrassentüren nicht empfohlen — Aussperr-Gefahr!
          default: false
          selector:
            boolean: {}
    pause_section:
      name: Pausieren
      description: >
        Hält die Automation vorübergehend komplett an — z.B. während einer
        Videoaufnahme (Licht!), wenn Gäste im Zimmer schlafen oder der
        Fensterputzer da ist.
      icon: mdi:pause-circle
      collapsed: true
      input:
        pause_boolean:
          name: Pausier-Helfer (optional)
          description: >
            Ein oder mehrere input_boolean-Helfer, die die Automatik anhalten —
            keine Fahrten, keine Lichter, keine Meldungen. Ob dafür der ein- oder
            ausgeschaltete Zustand zählt, legst du im nächsten Feld fest; bei
            mehreren Helfern pausiert die Automatik nur, wenn ALLE gleichzeitig
            im Pausier-Zustand sind. Ausnahmen: Notfall-Öffnen und Sturmschutz
            greifen weiterhin (Sicherheit und Hardware-Schutz gehen vor), und der
            "Rollladen schließen"-Knopf einer Benachrichtigung funktioniert wie
            der Wandtaster — bewusste Befehle werden nicht blockiert. Beim Ende
            der Pause wird ein inzwischen aktiver Nachtmodus nachgeholt, bei Regen
            der Regenschutz hergestellt und die Beschattung neu bewertet; verpasste Einzelereignisse (z.B. das
            morgendliche Öffnen oder das Zurückfahren nach dem Lüften) werden
            nicht nachgeholt.
          default: []
          selector:
            entity:
              domain: input_boolean
              multiple: true
        pause_mode:
          name: Logik des Pausier-Helfers
          description: >
            Gilt für alle ausgewählten Pausier-Helfer gemeinsam. "AN pausiert"
            passt zu Helfern wie "Aufnahme läuft" — pausiert wird, wenn alle
            eingeschaltet sind. "AUS pausiert" macht die Helfer zu Aktiv-Schaltern
            fürs Dashboard (z.B. "Rollladensteuerung aktiv") — pausiert wird, wenn
            alle ausgeschaltet sind; sobald einer an ist, läuft die Automatik.
          default: on_pauses
          selector:
            select:
              mode: list
              options:
                - value: on_pauses
                  label: Helfer AN = Automatik pausiert (z.B. "Aufnahme läuft")
                - value: off_pauses
                  label: Helfer AUS = Automatik pausiert (z.B. "Rollladensteuerung aktiv")
    block_section:
      name: Hindernis-Sperre
      description: >
        Verhindert, dass die Automatik den Rollladen herunterfährt, solange etwas
        im Weg ist — z.B. eine offene Fliegengittertür (der Panzer liefe sonst
        auf und hakte im Kasten aus) oder jemand, der auf der Terrasse sitzt.
        Fahrten nach oben (morgens öffnen, Fenster öffnen/kippen, Sonnenheizen,
        Sturm ohne Panzer-Modus, Beschattungs-Ende nach oben) laufen normal
        weiter. Wandtaster und andere Automationen werden nicht gesperrt, und
        eine bereits laufende Fahrt wird nicht gestoppt.
      icon: mdi:hand-back-left
      collapsed: true
      input:
        block_sensors:
          name: Sperr-Sensoren (optional)
          description: >
            Ein oder mehrere binäre Sensoren oder input_boolean-Helfer, z.B. der
            Kontakt der Fliegengittertür oder ein Präsenzmelder auf der Terrasse.
            Solange einer davon an ist (Tür offen, Person erkannt), fährt die
            Automatik den Rollladen nicht nach unten: kein Nachtmodus (auch keine
            Lüftungs- oder Kipp-Position), keine Beschattung (auch kein
            Beschattungs-Ende auf eine tiefere Position), kein "Schließen
            erzwingen", kein Zurückfahren nach dem Lüften und kein Schließen im
            Panzer-Modus bei Sturm. Auch der "Rollladen schließen"-Knopf einer
            Benachrichtigung wird gesperrt — Sicherheit vor Komfort. Ist die
            Sperre aufgehoben, wird ein eingeschalteter Nachtmodus hergestellt
            und die Beschattung neu bewertet; bei anhaltendem Sturm hat der
            Sturmschutz Vorrang (im Panzer-Modus wird dann geschlossen). Das
            Zurückfahren nach dem Lüften wird nicht nachgeholt.
            ⚠️ Auch ein nicht verfügbarer oder unbekannter Sensor (z.B. leere
            Batterie) sperrt — "unbekannt" ist kein Beweis für "zu". Ein dauerhaft
            toter Sensor verhindert also dauerhaft jedes automatische Herunterfahren.
            Leer lassen = keine Sperre (bisheriges Verhalten).
          default: []
          selector:
            entity:
              multiple: true
              filter:
                - domain: binary_sensor
                - domain: input_boolean
        block_release_delay:
          name: Wartezeit bis zur Freigabe
          description: >
            Die Sperre gilt erst als aufgehoben, wenn ALLE Sperr-Sensoren
            mindestens so lange aus sind — z.B. damit der Rollladen nicht sofort
            herunterfährt, wenn der Präsenzmelder auf der Terrasse kurz "frei"
            meldet, obwohl noch jemand draußen sitzt. 0 = Freigabe sofort beim
            Ausschalten.
          default: 0
          selector:
            number:
              min: 0
              max: 60
              step: 1
              mode: slider
              unit_of_measurement: Minuten
    restart_section:
      name: Nach HA-Neustart
      description: >
        Holt nach einem Neustart von Home Assistant nach, was in die Ausfallzeit
        gefallen ist — z.B. wenn ein Update genau über die Morgens-Uhrzeit lief.
      icon: mdi:restart
      collapsed: true
      input:
        restart_catch_up:
          name: Nach Neustart nachholen
          description: >
            Fällt die Morgens-Uhrzeit in einen Neustart von Home Assistant, bleibt
            der Rollladen an diesem Tag sonst zu; auch ein aktiver Nachtmodus wird
            nach dem Start nicht erneut hergestellt. Wenn aktiviert, wartet die
            Automation nach dem Start 60 Sekunden (bis Rollladen und Sensoren
            verfügbar sind) und prüft dann: Liegt die heutige Morgens-Uhrzeit
            höchstens 2 Stunden zurück, wird der Rollladen wie beim Morgens-Öffnen
            hochgefahren, falls er geschlossener als die Zielposition ist. Später
            nicht mehr — wer den Rollladen Stunden nach der Morgens-Uhrzeit noch
            zu hat, will das vermutlich so (Mittagsschlaf, Hitze). Ist dagegen
            Nacht (Sonne unter dem Horizont, abends oder vor der Morgens-Uhrzeit)
            und der Nachtmodus eingeschaltet, wird der Nachtzustand hergestellt — bei
            gekipptem oder offenem Fenster wird dabei nur hochgefahren, nie
            abgesenkt. Sturmschutz und Pause haben Vorrang; Beschattung und
            Sonnenheizen übernehmen ihre nächsten Durchläufe ohnehin selbst.
            Ein nachts von Hand geöffneter Rollladen fährt bei geschlossenem
            Fenster wieder zu. ⚠️ Aussperr-Gefahr, falls der Fensterkontakt nach
            dem Neustart einen veralteten Zustand meldet (Balkontür inzwischen
            offen, Kontakt meldet noch "zu"). Aus = bisheriges Verhalten (nach
            einem Neustart wird nichts nachgeholt).
          default: false
          selector:
            boolean: {}
    notification_section:
      name: Benachrichtigungen
      description: >
        Benachrichtigungen bei zu lange offenem oder gekipptem Fenster. Wird das
        Fenster geschlossen, verschwindet die Meldung automatisch vom Gerät.
        Benötigt einen Fenstersensor.
        Optional mit Erinnerungen in festem Abstand und zusätzlichen Diensten
        (z.B. Alexa oder Telegram).
      icon: mdi:bell
      collapsed: true
      input:
        notification_device:
          name: Benachrichtigungs-Geräte
          description: >
            Geräte mit der Home Assistant Companion App. Leer = keine
            Handy-Benachrichtigungen (Zusatz-Dienste im nächsten Feld werden
            trotzdem benachrichtigt).
          default: []
          selector:
            device:
              multiple: true
              filter:
                - integration: mobile_app
        notification_extra_targets:
          name: Zusätzliche Benachrichtigungs-Dienste (optional)
          description: >
            Weitere Notify-Dienste, die Titel und Text der Meldung bekommen — bei
            der ersten Meldung und bei jeder Erinnerung, z.B.
            notify.alexa_media_kueche, notify.persistent_notification oder der
            Notify-Dienst deines Telegram-Bots. Ein Dienst pro Eintrag, mit oder
            ohne "notify."-Präfix; Benachrichtigungs-Entitäten (notify.…) gehen
            ebenfalls. Diese Ziele bekommen keinen "Rollladen schließen"-Knopf,
            und dort wird beim Schließen des Fensters nichts abgeräumt. Ein
            falscher Eintrag stört den Versand an die übrigen Ziele nicht
            (Hinweis im Home-Assistant-Log).
          default: []
          selector:
            text:
              multiple: true
        notification_timeout:
          name: Benachrichtigung nach X Min. (Fenster offen)
          default: 45
          selector:
            number:
              min: 5
              max: 240
              step: 1
              mode: slider
              unit_of_measurement: Minuten
        notification_timeout_tilted:
          name: Benachrichtigung nach X Min. (Fenster gekippt)
          default: 60
          selector:
            number:
              min: 5
              max: 480
              step: 1
              mode: slider
              unit_of_measurement: Minuten
        notification_repeat_interval:
          name: Erinnerung alle X Min. wiederholen
          description: >
            Ist das Fenster nach der ersten Meldung weiterhin offen bzw. gekippt,
            wird die Meldung in diesem Abstand erneut gesendet. Auf dem Handy
            ersetzt sie die vorherige Meldung, der "Rollladen schließen"-Knopf
            bleibt. Die Erinnerungen enden, sobald das Fenster geschlossen wird
            (oder von offen auf gekippt wechselt bzw. umgekehrt). 0 = keine
            Wiederholung.
          default: 0
          selector:
            number:
              min: 0
              max: 120
              step: 5
              mode: slider
              unit_of_measurement: Minuten
        notification_repeat_max:
          name: Maximale Anzahl Erinnerungen
          description: >
            Wie oft die Meldung höchstens wiederholt wird (zusätzlich zur ersten
            Meldung). Nur wirksam, wenn oben ein Abstand gesetzt ist. Fällt eine
            Erinnerung in den Schlafmodus oder eine Pause, entfällt sie, zählt
            aber mit.
          default: 3
          selector:
            number:
              min: 1
              max: 10
              step: 1
              mode: slider
        use_area_name:
          name: Bereichsnamen in Benachrichtigungen verwenden
          description: Wenn aktiviert, wird der Bereichsname (z.B. "Wohnzimmer") statt des Sensor-Namens verwendet.
          default: false
          selector:
            boolean: {}
        sleep_mode_boolean:
          name: Schlafmodus-Helfer (optional)
          description: >
            Wenn dieser input_boolean 'on' ist, werden keine Benachrichtigungen
            gesendet — auch keine Erinnerungen und nichts an die Zusatz-Dienste.
          default: []
          selector:
            entity:
              domain: input_boolean
        notify_only_when_home:
          name: Nur anwesend
          description: >
            Wenn aktiviert, bekommt ein Gerät die Benachrichtigung nur, wenn seine
            Person gerade zuhause ist. Grundlage ist der Geräte-Tracker der
            Companion App; ist dieser Tracker einer Person zugeordnet, zählt deren
            Status (person.*), sonst der Tracker selbst. Geräte ohne Tracker
            erhalten die Meldung weiterhin immer. Aus = alle ausgewählten Geräte
            werden benachrichtigt (bisheriges Verhalten).
          default: false
          selector:
            boolean: {}

    diagnosis_section:
      name: Diagnose
      description: >
        Beantwortet die häufigste Frage: "Warum steht der Rollladen so?" Nach jeder
        Fahrt, die diese Automation auslöst, wird die letzte Aktion samt Grund
        festgehalten — z.B. "21:30 Nachtmodus → 15 % (Fenster offen)". Auch die
        wichtigsten bewusst ausgelassenen Fahrten werden vermerkt, z.B. "07:00
        Morgens öffnen übersprungen (Sturm)". Rein informativ: Am Verhalten der
        Steuerung ändert sich dadurch nichts. Geschrieben wird in einem eigenen,
        kurzen Lauf der Automation (er taucht zusätzlich in den Traces auf); ohne
        Helfer und Logbuch entfällt er ganz.
      icon: mdi:information-outline
      collapsed: true
      input:
        status_helper:
          name: Status-Text-Helfer (input_text, optional)
          description: >
            Ein Text-Helfer (input_text) NUR für dieses Fenster. Darin steht
            jederzeit die letzte Aktion mit Uhrzeit und Grund — ideal für eine
            Dashboard-Karte. Empfohlen: beim Anlegen die maximale Länge auf 255
            setzen (Standard sind 100 Zeichen, längere Texte werden gekürzt).
            Leer lassen = kein Status-Text (bisheriges Verhalten).
          default: []
          selector:
            entity:
              domain: input_text
        status_logbook:
          name: Zusätzlich ins Logbuch schreiben
          description: >
            Schreibt jede Aktion zusätzlich als Eintrag ins Logbuch des Rollladens —
            so lässt sich auch der Verlauf nachvollziehen, nicht nur die letzte
            Aktion. Funktioniert auch ohne Status-Text-Helfer, setzt aber die
            Logbuch-Integration voraus (bei Standard-Installationen immer
            vorhanden). Aus = keine Logbuch-Einträge (bisheriges Verhalten).
          default: false
          selector:
            boolean: {}

mode: parallel
max: 20

variables:
  cover_entity: !input cover
  window_sensor: !input window_sensor
  # Fensterzustand in Kleinschreibung: manche Drei-Zustands-Sensoren (z.B. Senoro)
  # melden Open/Tilted/Closed. Wird zu Laufbeginn ausgewertet — nach einem Wait
  # den Zustand direkt neu lesen. Ohne Fenstersensor (Festverglasung) gilt das
  # Fenster immer als geschlossen — states() auf der leeren Liste würde sonst
  # jeden Lauf abbrechen
  window_state: "{{ (states(window_sensor) | lower) if window_sensor is string else 'closed' }}"
  tilted_position: !input tilted_position
  window_reaction_delay: !input window_reaction_delay
  open_position: !input open_position
  reclose_timeout: !input reclose_timeout
  force_close: !input force_close
  treat_open_as_tilted: !input treat_open_as_tilted
  morning_enabled: !input morning_enabled
  morning_time: !input morning_time
  morning_sun_enabled: !input morning_sun_enabled
  morning_sun_elevation: !input morning_sun_elevation
  morning_latest: !input morning_latest
  morning_position: !input morning_position
  morning_random_delay: !input morning_random_delay
  morning_soft_duration: !input morning_soft_duration
  night_mode_boolean: !input night_mode_boolean
  night_mode_time: !input night_mode_time
  night_sun_enabled: !input night_sun_enabled
  night_sun_elevation: !input night_sun_elevation
  night_earliest: !input night_earliest
  night_latest: !input night_latest
  # Morgens nach Sonnenstand schon fällig (Sonne hoch genug oder "spätestens"
  # erreicht)? Ohne Morgens-Helfer endet die Nacht dann bereits, auch wenn die
  # Sonne noch nicht aufgegangen ist — sonst wäre der Rollladen offen, während noch
  # Nacht gilt, und das Schließen des Fensters würde ihn wieder herunterfahren
  morning_open_due: >-
    {{ morning_enabled and morning_sun_enabled
       and (state_attr('sun.sun', 'elevation') | float(-90) > morning_sun_elevation
            or now().strftime('%H:%M:%S') >= today_at(morning_latest).strftime('%H:%M:%S')) }}
  # Nachtmodus nach Sonnenstand, Bausteine für Zustand und Auslöser: Die Nacht
  # läuft von "frühestens" bis zum Morgen (Ende wie bei der Nachtmodus-Uhrzeit,
  # siehe unten) und ist aktiv, sobald die Sonne darin unter der Schwelle steht
  # oder "spätestens" erreicht ist. Fenster als [Beginn, Ende), auch über
  # Mitternacht. after_latest zählt "spätestens" selbst nicht mit — so schließt
  # der Sonnen-Auslöser auch, wenn er in dieselbe Sekunde fällt. Beim
  # Sonnen-Auslöser zählt die Uhrzeit des Sonnen-Updates, nicht die des (evtl.
  # verzögerten) Laufs. Fehlt next_rising, gilt Mittag als Ende — so schließt
  # "spätestens" auch ohne Sonnendaten
  night_sun: >-
    {% if night_sun_enabled %}
      {% set t = (trigger.to_state.last_updated | as_local).strftime('%H:%M:%S')
         if trigger.id | default('') == 'night_close_sun' else now().strftime('%H:%M:%S') %}
      {% set e = today_at(night_earliest).strftime('%H:%M:%S') %}
      {% set l = today_at(night_latest).strftime('%H:%M:%S') %}
      {% if morning_time is string and has_value(morning_time) %}
        {% set end = states(morning_time)[-8:] %}
        {% set sun_up = false %}
      {% else %}
        {% set rising = as_datetime(state_attr('sun.sun', 'next_rising'), none) %}
        {% set end = (rising | as_local).strftime('%H:%M:%S') if rising else '12:00:00' %}
        {% set sun_up = t < '12:00:00' and (is_state('sun.sun', 'above_horizon') or morning_open_due) %}
      {% endif %}
      {% set elev = state_attr('sun.sun', 'elevation') %}
      {% set low = elev is number and elev < night_sun_elevation %}
      {% set after_e = (e <= t < end) if e <= end else (t >= e or t < end) %}
      {% set after_l = (l <= t < end) if l <= end else (t >= l or t < end) %}
      {{ {'night': after_e and (low or after_l) and not sun_up,
          'sun_low': low, 'after_latest': after_l and t != l} }}
    {% else %}
      {{ {'night': false, 'sun_low': false, 'after_latest': false} }}
    {% endif %}
  # Nacht aktiv? Mit Helfer zählt dessen Zustand. Mit Uhrzeit gilt die Nacht ab
  # dieser Uhrzeit bis zur Morgens-Uhrzeit (falls dort ein Helfer gewählt ist),
  # sonst bis Sonnenaufgang — vormittags zählt dafür der Sonnenstand, denn next_rising
  # zeigt nach Sonnenaufgang schon auf morgen (die Nacht liefe sonst ein paar Minuten,
  # vor der Zeitumstellung eine Stunde zu lang) — bzw. bis zum früheren Öffnen nach
  # Sonnenstand (morning_open_due). Ein reiner Auslöser würde nicht
  # reichen: Die Beschattung würde den gerade geschlossenen Rollladen an einem
  # heißen Abend wieder hochfahren.
  # Vorrang bei mehreren Quellen: Helfer vor Uhrzeit vor Sonnenstand. Uhrzeiten als
  # HH:MM:SS-Strings vergleichen (die letzten 8 Zeichen passen auch bei
  # Datum+Uhrzeit-Helfern)
  night_mode_on: >-
    {% if night_mode_boolean is string %}
      {{ is_state(night_mode_boolean, 'on') }}
    {% elif night_mode_time is string and has_value(night_mode_time) %}
      {% set t = now().strftime('%H:%M:%S') %}
      {% set start = states(night_mode_time)[-8:] %}
      {% if morning_time is string and has_value(morning_time) %}
        {% set end = states(morning_time)[-8:] %}
        {% set sun_up = false %}
      {% else %}
        {% set rising = as_datetime(state_attr('sun.sun', 'next_rising'), none) %}
        {% set end = (rising | as_local).strftime('%H:%M:%S') if rising else start %}
        {% set sun_up = t < '12:00:00' and (is_state('sun.sun', 'above_horizon') or morning_open_due) %}
      {% endif %}
      {{ ((start <= t < end) if start <= end else (t >= start or t < end)) and not sun_up }}
    {% elif night_sun_enabled and night_mode_time is not string %}
      {{ night_sun.night }}
    {% else %}
      {{ false }}
    {% endif %}
  night_close_position: !input night_close_position
  night_ventilation_position: !input night_ventilation_position
  night_random_delay: !input night_random_delay
  storm_enabled: !input storm_enabled
  storm_release_delay: !input storm_release_delay
  weather_entity: !input weather_entity
  storm_wind_sensor: !input storm_wind_sensor
  wind_speed_threshold: !input wind_speed_threshold
  panzer_mode: !input panzer_mode
  force_storm_action: !input force_storm_action
  shading_status_helper: !input shading_status_helper
  window_azimuth: !input window_azimuth
  shading_fov_left: !input shading_fov_left
  shading_fov_right: !input shading_fov_right
  shading_min_elevation: !input shading_min_elevation
  shading_max_elevation: !input shading_max_elevation
  window_height: !input window_height
  window_sill_height: !input window_sill_height
  shading_depth: !input shading_depth
  glass_bottom_position: !input glass_bottom_position
  glass_top_position: !input glass_top_position
  shading_min_position: !input shading_min_position
  shading_end_position: !input shading_end_position
  shading_temp_sensor: !input shading_temp_sensor
  shading_temp_threshold: !input shading_temp_threshold
  shading_temp_hysteresis: !input shading_temp_hysteresis
  glare_enabled: !input glare_enabled
  glare_position: !input glare_position
  shading_min_change: !input shading_min_change
  shading_override_threshold: !input shading_override_threshold
  shading_override_duration: !input shading_override_duration
  min_move_interval: !input min_move_interval
  force_shading: !input force_shading
  shading_weather_states: !input shading_weather_states
  shading_enable_entity: !input shading_enable_entity
  shading_time_from: !input shading_time_from
  shading_time_until: !input shading_time_until
  shading_start_delay: !input shading_start_delay
  shading_end_delay: !input shading_end_delay
  # Merker der Ein-/Ausschaltverzögerung (per scene.create): "Sonne, Temperatur
  # und Wetterlage erfüllen den Start bzw. das Ende seit der Verzögerung
  # ununterbrochen". Überleben keinen HA-Neustart (dafür gibt es das
  # Neustart-Fenster im Sonnenschutz-Zweig)
  shading_start_marker: "scene.shading_start_{{ cover_entity | slugify }}"
  shading_end_marker: "scene.shading_end_{{ cover_entity | slugify }}"
  # Merker "Beschattung neu abgleichen": nach Pause, Hindernis oder Regen hat sich
  # der Sollwert verschoben bzw. der Rollladen wurde fremd bewegt. Der nächste Tick
  # fährt einmal auf die Sollposition, statt die Abweichung als manuellen Eingriff
  # zu werten (Status-Helfer bleibt an, damit ein fälliges Ende nicht verloren geht)
  shading_resync_marker: "scene.shading_resync_{{ cover_entity | slugify }}"
  solar_heating_status_helper: !input solar_heating_status_helper
  solar_heating_temp_threshold: !input solar_heating_temp_threshold
  solar_heating_temp_hysteresis: !input solar_heating_temp_hysteresis
  solar_heating_min_position: !input solar_heating_min_position
  solar_heating_position: !input solar_heating_position
  frost_enabled: !input frost_enabled
  frost_temp_threshold: !input frost_temp_threshold
  frost_max_position: !input frost_max_position
  # Frost = Frostschutz an, Temperaturquelle (dieselbe wie Sonnenschutz/
  # Sonnenheizen) verfügbar und Temperatur <= Schwelle. Ohne Quelle oder bei
  # unavailable kein Frost — Öffnungsfahrten laufen dann unbegrenzt wie bisher
  frost_active: >-
    {% if not frost_enabled %}
      {{ false }}
    {% elif shading_temp_sensor is string %}
      {{ has_value(shading_temp_sensor)
         and states(shading_temp_sensor) | float(99) <= frost_temp_threshold }}
    {% elif weather_entity is string %}
      {{ has_value(weather_entity)
         and state_attr(weather_entity, 'temperature') | float(99) <= frost_temp_threshold }}
    {% else %}
      {{ false }}
    {% endif %}
  mosquito_area_input: !input mosquito_area
  mosquito_exclude: !input mosquito_exclude
  pause_boolean: !input pause_boolean
  pause_mode: !input pause_mode
  # Pausiert = ALLE ausgewählten Helfer stehen im Pausier-Zustand. Ältere
  # Instanzen speichern einen einzelnen Helfer als String statt Liste — beides
  # wird unterstützt. Nicht existierende/unavailable Helfer pausieren nie (fail-safe).
  pause_active: >-
    {% set helpers = [pause_boolean] if pause_boolean is string else pause_boolean %}
    {% set pausing = 'on' if pause_mode == 'on_pauses' else 'off' %}
    {% set found = expand(helpers) | list %}
    {{ helpers | length > 0
       and found | length > 0
       and found | rejectattr('state', 'eq', pausing) | list | length == 0 }}
  emergency_sensors: !input emergency_sensors
  # Notfall aktiv = mindestens ein Sensor meldet 'on'; unavailable/unknown zählen
  # nicht als Alarm. Bewusst ohne expand(), damit Gruppen-Sensoren ihren eigenen
  # Zustand behalten, statt in ihre Mitglieder aufgelöst zu werden
  emergency_active: >-
    {% set sensors = [emergency_sensors] if emergency_sensors is string else emergency_sensors %}
    {{ sensors | select('is_state', 'on') | list | length > 0 }}
  block_sensors: !input block_sensors
  block_release_delay: !input block_release_delay
  # Hindernis-Sperre: gesperrt, solange ein Sensor nicht eindeutig 'off' meldet
  # (unavailable/unknown/nicht existent zählen als Hindernis — "unbekannt" ist
  # kein Beweis für "zu") oder der zuletzt ausgeschaltete noch in der Wartezeit
  # steckt. 2 s Toleranz, damit sich der Freigabe-Trigger (for: = Wartezeit)
  # nicht wegen Timer-Jitter selbst noch als gesperrt sieht.
  block_active: >-
    {% set sensors = [block_sensors] if block_sensors is string else block_sensors %}
    {% set ns = namespace(blocked = false) %}
    {% for s in sensors %}
      {% if states(s) != 'off'
            or as_timestamp(now()) - as_timestamp(states[s].last_changed) < (block_release_delay | float(0)) * 60 - 2 %}
        {% set ns.blocked = true %}
      {% endif %}
    {% endfor %}
    {{ ns.blocked }}
  presence_entities: !input presence_entities
  away_close_enabled: !input away_close_enabled
  away_close_position: !input away_close_position
  away_shading_strict: !input away_shading_strict
  away_shading_depth: !input away_shading_depth
  # Anwesenheit pro Entität: 'home' = sicher da, 'away' = sicher weg,
  # 'unknown' = unavailable/unknown — zählt NICHT als weg (fail-safe).
  # Gleiche Logik wie im Template-Trigger away_start
  presence_states: >-
    {% set ns = namespace(out=[]) %}
    {% for e in ([presence_entities] if presence_entities is string else presence_entities) %}
      {% set st = states(e) %}
      {% set d = e.split('.')[0] %}
      {% if st in ['unavailable', 'unknown'] %}
        {% set ns.out = ns.out + ['unknown'] %}
      {% elif (d == 'zone' and st | int(1) > 0)
            or (d in ['person', 'device_tracker'] and st == 'home')
            or (d not in ['zone', 'person', 'device_tracker'] and st in ['on', 'home']) %}
        {% set ns.out = ns.out + ['home'] %}
      {% else %}
        {% set ns.out = ns.out + ['away'] %}
      {% endif %}
    {% endfor %}
    {{ ns.out }}
  presence_all_away: "{{ presence_states | length > 0 and presence_states | reject('eq', 'away') | list | length == 0 }}"
  presence_anyone_home: "{{ 'home' in presence_states }}"
  # Merker "Abwesenheit hat begonnen" (dynamische Szene, gesetzt nach Ablauf der
  # Wartezeit, entfernt beim Heimkommen). Überlebt keinen HA-Neustart — dann
  # entfallen bis zur nächsten Abwesenheit nur Wiederöffnen und strenge Beschattung
  away_marker: "scene.away_{{ cover_entity | slugify }}"
  # Bei Abwesenheit unten gehalten: Sonnenschutz und Sonnenheizen fassen den
  # Rollladen nicht an. 'closing' deckt die laufende Fahrt nach unten ab, damit
  # ein gleichzeitiger Tick das Abwesenheits-Schließen nicht abbricht
  away_hold: >-
    {{ away_close_enabled and presence_all_away
       and (state_attr(cover_entity, 'current_position') | int(101) <= away_close_position
            or is_state(cover_entity, 'closing')) }}
  sleep_mode_boolean: !input sleep_mode_boolean
  use_area_name: !input use_area_name
  notification_timeout: !input notification_timeout
  notification_timeout_tilted: !input notification_timeout_tilted
  notification_device: !input notification_device
  notify_only_when_home: !input notify_only_when_home
  status_helper: !input status_helper
  status_logbook: !input status_logbook
  notification_repeat_interval: !input notification_repeat_interval
  notification_repeat_max: !input notification_repeat_max
  notification_extra_targets: !input notification_extra_targets
  # Zusatz-Dienste normalisieren: mit oder ohne "notify."-Präfix, Groß-/
  # Kleinschreibung und Leerzeichen egal. Einträge in ungültigem Format landen
  # in "invalid" (Warnung im Log), leere Einträge werden still übergangen
  notification_extra_parsed: >-
    {% set raw = [notification_extra_targets] if notification_extra_targets is string else (notification_extra_targets or []) %}
    {% set ns = namespace(valid=[], invalid=[]) %}
    {% for t in raw if t is string %}
      {% set s = t | string | trim | lower | regex_replace('^notify\\.', '') %}
      {% if s | regex_match('^[a-z0-9_]+$') %}
        {% if s not in ns.valid %}{% set ns.valid = ns.valid + [s] %}{% endif %}
      {% elif t | string | trim | length > 0 %}
        {% set ns.invalid = ns.invalid + [t | string | trim] %}
      {% endif %}
    {% endfor %}
    {{ {'valid': ns.valid, 'invalid': ns.invalid} }}
  notification_extra_services: "{{ notification_extra_parsed.valid }}"
  # Ohne Fenstersensor gibt es keine Meldungen — 'none' ist dann nur Platzhalter
  action_id: "{{ 'CLOSE_SHUTTER__' ~ (window_sensor if window_sensor is string else 'none') }}"
  notification_tag: "{{ 'fenster_offen_' ~ ((window_sensor if window_sensor is string else 'none') | slugify) }}"
  # Gemerkte Ausgangsposition fürs Zurückfahren (per scene.create angelegt)
  reclose_scene: "scene.reclose_{{ cover_entity | slugify }}"
  device_name_map: >
    {% set ns = namespace(device_names=[]) %}
    {% for device_id in notification_device %}
      {% set device_name = device_attr(device_id, "name") %}
      {% if device_name %}
        {% set ns.device_names = ns.device_names + ["mobile_app_" + device_name | slugify] %}
      {% endif %}
    {% endfor %}
    {{ ns.device_names }}
  rain_sensor: !input rain_sensor
  rain_position: !input rain_position
  rain_delay: !input rain_delay
  rain_restore: !input rain_restore
  rain_include_open: !input rain_include_open
  # Eigene Szene für den Regen-Snapshot — die Lüften-Szene (reclose_) bleibt unberührt
  rain_scene: "{{ 'scene.rain_' ~ (cover_entity | slugify) }}"
  # Fensterzustand, bei dem der Regenschutz greift: gekippt, offen nur mit
  # "Öffnen wie Kippen behandeln" oder "Auch bei ganz geöffnetem Fenster"
  rain_window_protected: >-
    {{ window_state == 'tilted'
       or (window_state in ['on', 'open'] and (treat_open_as_tilted or rain_include_open)) }}
  # Regenschutz gilt gerade: Regen seit mindestens rain_delay (1 s Toleranz,
  # damit der rain_start-Trigger selbst sicher besteht), Fenster im geschützten
  # Zustand und Cover mit Positionsangabe. Andere Branches fahren dann nicht
  # über die Regenposition
  rain_hold: >-
    {{ rain_sensor is string
       and is_state(rain_sensor, 'on')
       and (as_timestamp(now()) - as_timestamp(states[rain_sensor].last_changed)) >= (rain_delay | float(0)) * 60 - 1
       and rain_window_protected
       and state_attr(cover_entity, 'current_position') is not none }}
  # Sturm gerade aktiv (für den Regenschutz; Wind-Sensor hat Vorrang vor der Wetter-Entität)
  rain_storm_active: >-
    {% if storm_wind_sensor is string %}
      {% set wind = states(storm_wind_sensor) | float(0) %}
    {% elif weather_entity is string %}
      {% set wind = state_attr(weather_entity, 'wind_speed') | float(0) %}
    {% else %}
      {% set wind = 0 %}
    {% endif %}
    {{ storm_enabled and wind >= wind_speed_threshold }}

# Nur für Trigger-Templates: filtert den Notification-Action-Event bereits im
# Trigger, damit nicht jede Notification-Action jeder Instanz einen Lauf startet
trigger_variables:
  window_sensor_tv: !input window_sensor
  presence_tv: !input presence_entities
  # Für die Verzögerungs-Trigger der Beschattung (Template-Trigger sehen die
  # Werte aus variables: nicht)
  cover_tv: !input cover
  # Diagnose: Schreib-Trigger nur, wenn Helfer oder Logbuch genutzt werden
  status_helper_tv: !input status_helper
  status_logbook_tv: !input status_logbook
  shading_start_delay_tv: !input shading_start_delay
  shading_end_delay_tv: !input shading_end_delay
  shading_status_helper_tv: !input shading_status_helper
  window_azimuth_tv: !input window_azimuth
  shading_fov_left_tv: !input shading_fov_left
  shading_fov_right_tv: !input shading_fov_right
  shading_min_elevation_tv: !input shading_min_elevation
  shading_max_elevation_tv: !input shading_max_elevation
  shading_temp_sensor_tv: !input shading_temp_sensor
  shading_temp_threshold_tv: !input shading_temp_threshold
  shading_temp_hysteresis_tv: !input shading_temp_hysteresis
  glare_enabled_tv: !input glare_enabled
  shading_weather_states_tv: !input shading_weather_states
  weather_entity_tv: !input weather_entity

triggers:
  - trigger: time
    at: !input morning_time
    id: morning_open
    enabled: !input morning_enabled
  # Morgens nach Sonnenstand: Sonne steigt über die Schwelle bzw. "spätestens" ist
  # erreicht. Ob wirklich geöffnet wird, entscheidet der Morgens-Zweig
  - trigger: numeric_state
    entity_id: sun.sun
    attribute: elevation
    above: !input morning_sun_elevation
    id: morning_open_sun
    enabled: !input morning_sun_enabled
  - trigger: time
    at: !input morning_latest
    id: morning_open_latest
    enabled: !input morning_sun_enabled
  # Großgeschriebene Varianten für Sensoren, die Open/Tilted/Closed melden.
  # Ohne Fenstersensor (leere Liste) feuern die Fenster-Trigger nie
  - trigger: state
    entity_id: !input window_sensor
    to:
      - "on"
      - "open"
      - "Open"
      - "tilted"
      - "Tilted"
    for:
      seconds: !input window_reaction_delay
    id: window_change
  - trigger: state
    entity_id: !input window_sensor
    to:
      - "on"
      - "open"
      - "Open"
    for:
      minutes: !input notification_timeout
    id: window_open_long
  - trigger: state
    entity_id: !input window_sensor
    to:
      - "tilted"
      - "Tilted"
    for:
      minutes: !input notification_timeout_tilted
    id: window_tilted_long
  - trigger: state
    entity_id: !input window_sensor
    to:
      - "off"
      - "closed"
      - "Closed"
    for:
      seconds: !input window_reaction_delay
    id: window_closed
  # Beide Richtungen, gleiche ID: Welcher Übergang die Pause beendet, hängt von
  # der gewählten Logik ab — das Gate am Aktions-Anfang sortiert den jeweils
  # anderen (Pause-Beginn) aus, weil die Pause dann gerade aktiv ist
  - trigger: state
    entity_id: !input pause_boolean
    from: "on"
    to: "off"
    id: pause_ended
  - trigger: state
    entity_id: !input pause_boolean
    from: "off"
    to: "on"
    id: pause_ended
  # Hindernis-Sperre aufgehoben: feuert pro Sensor, der die Wartezeit lang aus
  # ist — ob wirklich ALLE frei sind, prüft der Zweig. Ohne from:, damit auch
  # unavailable/unknown → aus (gilt als Hindernis) die Sperre beenden kann
  - trigger: state
    entity_id: !input block_sensors
    to: "off"
    for:
      minutes: !input block_release_delay
    id: block_released
  - trigger: state
    entity_id: !input night_mode_boolean
    to: "on"
    id: night_close
  # Alternative zum Helfer: eigene Nacht-Uhrzeit für dieses Fenster. Eigene ID,
  # damit der Nachtmodus-Zweig erkennt, welcher der beiden Wege ausgelöst hat
  - trigger: time
    at: !input night_mode_time
    id: night_close_time
  # Feuert nur beim echten Start von Home Assistant, nicht beim Neuladen der Automationen
  - trigger: homeassistant
    event: start
    id: ha_started
    enabled: !input restart_catch_up
  # Nachtmodus nach Sonnenstand: Sonne sinkt unter die Schwelle, "frühestens" oder
  # "spätestens" ist erreicht. Welcher davon schließt, entscheidet der Nachtmodus-Zweig
  - trigger: numeric_state
    entity_id: sun.sun
    attribute: elevation
    below: !input night_sun_elevation
    id: night_close_sun
    enabled: !input night_sun_enabled
  - trigger: time
    at: !input night_earliest
    id: night_close_sun_earliest
    enabled: !input night_sun_enabled
  - trigger: time
    at: !input night_latest
    id: night_close_sun_latest
    enabled: !input night_sun_enabled
  - trigger: numeric_state
    entity_id: !input weather_entity
    attribute: wind_speed
    above: !input wind_speed_threshold
    for:
      seconds: !input storm_trigger_delay
    id: storm_detected
    enabled: !input storm_enabled
  - trigger: numeric_state
    entity_id: !input storm_wind_sensor
    above: !input wind_speed_threshold
    for:
      seconds: !input storm_trigger_delay
    id: storm_detected
    enabled: !input storm_enabled
  # Feuern pro Sensor — ob der Notfall insgesamt vorbei ist, prüft der Zweig.
  # Ende nur bei echtem 'off': ein Sensor, der im Alarm unavailable wird (z.B.
  # ein Rauchmelder im Brand), soll keine Nacht-Schließfahrt auslösen
  - trigger: state
    entity_id: !input emergency_sensors
    to: "on"
    id: emergency_open
  - trigger: state
    entity_id: !input emergency_sensors
    from: "on"
    to: "off"
    id: emergency_ended
  # Ein Alarm, der schon während des Hochfahrens anlag, löst keinen sichtbaren
  # Zustandswechsel aus — beim Start daher einmal prüfen (Zweig prüft den Alarm)
  - trigger: homeassistant
    event: start
    id: emergency_open
  - trigger: event
    event_type: mobile_app_notification_action
    event_data:
      action: "CLOSE_SHUTTER__{{ window_sensor_tv if window_sensor_tv is string else 'none' }}"
    id: close_shutter_action
  # Interner Versand an einen Zusatz-Dienst (siehe Benachrichtigungs-Zweig);
  # über Rollladen + Fenster gefiltert, damit nur die eigene Instanz reagiert
  - trigger: event
    event_type: s42_rollladen_zusatz_meldung
    event_data:
      cover: "{{ cover_tv }}"
      window: "{{ window_sensor_tv }}"
    id: notify_extra_target
  # Diagnose: Jede Fahrt meldet ihren Grund per Event an die eigene Instanz
  # (über den Rollladen gefiltert); ein kurzer eigener Lauf schreibt Text-Helfer
  # und Logbuch — so steht der Schreib-Code nur einmal in der Datei. Ohne Helfer
  # und ohne Logbuch ist der Trigger aus, die Events verpuffen dann folgenlos
  - trigger: event
    event_type: s42_rollladen_status
    event_data:
      cover: "{{ cover_tv }}"
    id: status_update
    enabled: "{{ status_helper_tv is string or status_logbook_tv }}"
  - trigger: time_pattern
    minutes: "/5"
    id: shading_tick
    enabled: !input shading_enabled
  # Freigabe entzogen: Beschattung sofort beenden statt erst beim nächsten Tick.
  # Gleiche ID wie der Tick, der Sonnenschutz-Zweig bewertet ohnehin alles neu.
  # Nur on → off: unavailable/unknown heißt "Zustand halten", ein späteres off
  # übernimmt der Tick. Ohne Freigabe-Helfer ([]) feuert der Trigger nie
  - trigger: state
    entity_id: !input shading_enable_entity
    from: "on"
    to: "off"
    id: shading_tick
    enabled: !input shading_enabled
  # Einschaltverzögerung: feuert, wenn Sonne, Temperatur und Wetterlage eine
  # Beschattung seit shading_start_delay Minuten ununterbrochen erlauben. Bei
  # Verzögerung 0 konstant false (keine Listener, kein Lauf) — dann startet wie
  # bisher der Tick. Alle übrigen Voraussetzungen (Fenster, Nacht, Sturm, Pause,
  # Freigabe, Zeitfenster, Regen, Abwesenheit, Hindernis …) prüft erst der Zweig.
  # Spricht im Moment des Feuerns etwas dagegen, merkt er sich den Ablauf der
  # Wartezeit (shading_start_marker) und der nächste Tick danach startet — ein
  # Template-Trigger feuert nur beim Wechsel false -> true, ohne Merker käme
  # z.B. nach dem Schließen des Fensters kein zweiter Anlauf.
  # KOPIE der Zweig-Variablen sun_in_window/outdoor_temp/weather_ok (start_core,
  # mit Blendschutz auch unter der Temperatur-Schwelle)
  # — Änderungen dort hier und im Ausschalt-Trigger nachziehen!
  - trigger: template
    value_template: >-
      {%- if shading_start_delay_tv | int(0) <= 0
            or shading_status_helper_tv is not string -%}
        {{ false }}
      {%- else -%}
        {%- set elevation = state_attr('sun.sun', 'elevation') | float(0) -%}
        {%- set azimuth = state_attr('sun.sun', 'azimuth') | float(0) -%}
        {%- set az_diff = ((azimuth - window_azimuth_tv + 180) % 360) - 180 -%}
        {%- set sun_in_window = elevation >= shading_min_elevation_tv
              and elevation <= shading_max_elevation_tv
              and az_diff >= (0 - shading_fov_left_tv)
              and az_diff <= shading_fov_right_tv -%}
        {%- if shading_temp_sensor_tv is string -%}
          {%- set temp = states(shading_temp_sensor_tv) | float(-99) -%}
        {%- elif weather_entity_tv is string -%}
          {%- set temp = state_attr(weather_entity_tv, 'temperature') | float(-99) -%}
        {%- else -%}
          {%- set temp = -99 -%}
        {%- endif -%}
        {%- set weather_ok = shading_weather_states_tv | length == 0
              or weather_entity_tv is not string
              or states(weather_entity_tv) in ['unknown', 'unavailable']
              or states(weather_entity_tv) in shading_weather_states_tv -%}
        {{ sun_in_window and (temp >= shading_temp_threshold_tv or glare_enabled_tv) and weather_ok }}
      {%- endif -%}
    for:
      minutes: !input shading_start_delay
    id: shading_start_delayed
    enabled: !input shading_enabled
  # Ausschaltverzögerung: feuert, wenn eine LAUFENDE Beschattung seit
  # shading_end_delay Minuten ununterbrochen enden müsste. Bei Verzögerung 0
  # konstant false — dann beendet wie bisher der Tick. Eine nicht verfügbare
  # Temperaturquelle zählt nicht als Ende-Grund (wie temp_available im Zweig).
  # Verhindert gerade etwas das Ende, merkt sich der Zweig auch hier den Ablauf
  # (shading_end_marker). Freigabe aus und Ende des Zeitfensters beenden ohne
  # Verzögerung — das sind bewusste Vorgaben, kein Wolkenflackern.
  # KOPIE der Zweig-Variablen sun_in_window/outdoor_temp/temp_available/
  # weather_bad (end_core) — Änderungen dort hier und im Einschalt-Trigger nachziehen!
  - trigger: template
    value_template: >-
      {%- if shading_end_delay_tv | int(0) <= 0
            or shading_status_helper_tv is not string
            or not is_state(shading_status_helper_tv, 'on') -%}
        {{ false }}
      {%- else -%}
        {%- set elevation = state_attr('sun.sun', 'elevation') | float(0) -%}
        {%- set azimuth = state_attr('sun.sun', 'azimuth') | float(0) -%}
        {%- set az_diff = ((azimuth - window_azimuth_tv + 180) % 360) - 180 -%}
        {%- set sun_in_window = elevation >= shading_min_elevation_tv
              and elevation <= shading_max_elevation_tv
              and az_diff >= (0 - shading_fov_left_tv)
              and az_diff <= shading_fov_right_tv -%}
        {%- if shading_temp_sensor_tv is string -%}
          {%- set temp = states(shading_temp_sensor_tv) | float(-99) -%}
          {%- set temp_available = has_value(shading_temp_sensor_tv) -%}
        {%- elif weather_entity_tv is string -%}
          {%- set temp = state_attr(weather_entity_tv, 'temperature') | float(-99) -%}
          {%- set temp_available = has_value(weather_entity_tv)
                and state_attr(weather_entity_tv, 'temperature') is not none -%}
        {%- else -%}
          {%- set temp = -99 -%}
          {%- set temp_available = false -%}
        {%- endif -%}
        {%- set weather_bad = shading_weather_states_tv | length > 0
              and weather_entity_tv is string
              and states(weather_entity_tv) not in ['unknown', 'unavailable']
              and states(weather_entity_tv) not in shading_weather_states_tv -%}
        {#- "< Schwelle": Bei Hysterese 0 darf Gleichstand nicht zugleich Start- und
            Ende-Bedingung sein — sonst pendelt die Beschattung zwischen beiden Triggern -#}
        {{ (not sun_in_window)
           or (not glare_enabled_tv and temp_available and temp < shading_temp_threshold_tv
               and temp <= (shading_temp_threshold_tv - shading_temp_hysteresis_tv))
           or weather_bad }}
      {%- endif -%}
    for:
      minutes: !input shading_end_delay
    id: shading_end_delayed
    enabled: !input shading_enabled
  - trigger: time_pattern
    minutes: "/5"
    id: solar_heating_tick
    enabled: !input solar_heating_enabled
  - trigger: state
    entity_id: !input window_sensor
    to:
      - "on"
      - "open"
      - "Open"
      - "tilted"
      - "Tilted"
    for:
      seconds: !input window_reaction_delay
    id: mosquito_lights
    enabled: !input mosquito_enabled
  # Sturm-Entwarnung: Wind liegt wieder so lange unter dem Grenzwert. Bei 0 Minuten
  # feuern die Trigger sofort, der Zweig prüft storm_release_delay und tut dann nichts
  - trigger: numeric_state
    entity_id: !input weather_entity
    attribute: wind_speed
    below: !input wind_speed_threshold
    for:
      minutes: !input storm_release_delay
    id: storm_released
    enabled: !input storm_enabled
  - trigger: numeric_state
    entity_id: !input storm_wind_sensor
    below: !input wind_speed_threshold
    for:
      minutes: !input storm_release_delay
    id: storm_released
    enabled: !input storm_enabled
  # Abwesenheit beginnt: ALLE Anwesenheits-Entitäten sicher weg, und zwar
  # ununterbrochen für die Wartezeit. Template statt state-Trigger, weil
  # state-Trigger mit for: pro Entität zählen und Zonenwechsel ("Arbeit" →
  # unterwegs) die Wartezeit neu starten würden. Leere Liste: nie wahr
  - trigger: template
    value_template: >-
      {% set ents = [presence_tv] if presence_tv is string else presence_tv %}
      {% set ns = namespace(away=0) %}
      {% for e in ents %}
        {% set st = states(e) %}
        {% set d = e.split('.')[0] %}
        {% if st not in ['unavailable', 'unknown']
           and not ((d == 'zone' and st | int(1) > 0)
                    or (d in ['person', 'device_tracker'] and st == 'home')
                    or (d not in ['zone', 'person', 'device_tracker'] and st in ['on', 'home'])) %}
          {% set ns.away = ns.away + 1 %}
        {% endif %}
      {% endfor %}
      {{ ents | length > 0 and ns.away == ents | length }}
    for:
      minutes: !input away_delay
    id: away_start
  # Heimkommen: jede Zustandsänderung (ohne Attribut-Änderungen) — ob wirklich
  # jemand zurück ist und vorher eine Abwesenheit lief, prüft der Zweig
  - trigger: state
    entity_id: !input presence_entities
    to: null
    id: away_return
  # Regenschutz: leerer Regensensor = Trigger feuern nie (Feature aus)
  - trigger: state
    entity_id: !input rain_sensor
    to: "on"
    for:
      minutes: !input rain_delay
    id: rain_start
  - trigger: state
    entity_id: !input rain_sensor
    to: "off"
    for:
      minutes: !input rain_restore_delay
    id: rain_end
  # Fenster zu: Regen-Snapshot verwerfen — das Zurückfahren übernimmt die
  # normale Fenster-Interaktion
  - trigger: state
    entity_id: !input window_sensor
    to:
      - "off"
      - "closed"
      - "Closed"
    for:
      seconds: !input window_reaction_delay
    id: rain_window_closed

actions:
  # Notfall: Solange ein Notfall-Sensor 'on' meldet, bewegt die Automatik nichts
  # und schaltet keine Lichter. Durch dürfen nur die Notfall-Trigger selbst und
  # die Benachrichtigungen samt Zusatz-Diensten und Abräumen (bewegen nichts;
  # das nächtliche Schließen im Abräum-Zweig prüft den Notfall selbst) sowie die
  # Beschattungs-Läufe (pflegen nur ihre Verzögerungs-Merker, der Zweig prüft
  # den Notfall danach selbst), das Festhalten des Status (Diagnose) und das
  # Regen-Aufräumen (Snapshot verwerfen; Zurückfahren prüft den Notfall selbst)
  - condition: >-
      {{ trigger.id | default('') in ['emergency_open', 'emergency_ended', 'window_open_long', 'window_tilted_long', 'window_closed',
                                      'notify_extra_target', 'shading_tick', 'shading_start_delayed', 'shading_end_delayed',
                                      'status_update', 'rain_end', 'rain_window_closed']
         or not emergency_active }}
  # Pausier-Helfer: hält die AUTOMATIK an, mit diesen Ausnahmen — Notfall-Öffnen
  # (Sicherheit geht vor), Sturmschutz (Hardware-Schutz geht vor),
  # Benachrichtigungs-Aufräumen (bewegt nichts; das nächtliche Schließen im
  # selben Zweig prüft die Pause selbst), der Notification-Knopf (ein bewusster
  # Nutzer-Befehl, wie der Wandtaster), das Ende der Hindernis-Sperre (holt in
  # der Pause nur das Panzer-Schließen nach), das Heimkommen (räumt nur den
  # Abwesenheits-Merker ab, fährt in der Pause nicht), das Regen-Aufräumen
  # (Regen-Snapshot; das Zurückfahren nach dem Regen prüft die Pause selbst) und
  # die Beschattungs-Läufe (pflegen nur ihre Verzögerungs-Merker, der Zweig
  # prüft die Pause danach selbst) sowie das Festhalten des Status (Diagnose)
  - condition: >-
      {{ trigger.id | default('') in ['emergency_open', 'storm_detected', 'window_closed', 'close_shutter_action', 'block_released',
                                      'away_return', 'rain_end', 'rain_window_closed', 'shading_tick', 'shading_start_delayed',
                                      'shading_end_delayed', 'status_update']
         or not pause_active }}
  - choose:
      # --- DIAGNOSE: LETZTE AKTION FESTHALTEN ---
      # Text-Helfer auf dessen Max-Länge gekürzt; continue_on_error, damit ein
      # fehlender oder falsch konfigurierter Helfer bzw. eine fehlende
      # Logbuch-Integration nie stört
      - conditions:
          - condition: trigger
            id: status_update
        sequence:
          - variables:
              status_text: "{{ trigger.event.data.text | default('') | string }}"
          - if:
              - "{{ status_helper is string }}"
            then:
              - action: input_text.set_value
                continue_on_error: true
                target:
                  entity_id: "{{ status_helper }}"
                data:
                  value: "{{ (now().strftime('%H:%M ') ~ status_text)[:state_attr(status_helper, 'max') | int(100)] }}"
          - if:
              - "{{ status_logbook }}"
            then:
              - action: logbook.log
                continue_on_error: true
                data:
                  name: "{{ state_attr(cover_entity, 'friendly_name') or cover_entity }}"
                  entity_id: "{{ cover_entity }}"
                  message: "{{ status_text }}"

      # --- MORGENS ÖFFNEN ---
      - conditions:
          - condition: trigger
            id:
              - morning_open
              - morning_open_sun
              - morning_open_latest
        sequence:
          # Startzeit des Laufs (der Sonnen-Trigger kennt kein trigger.now)
          - variables:
              morning_run_start: "{{ as_timestamp(now()) }}"
          # Nach Sonnenstand pro Tag genau einmal öffnen: "frühestens" (morning_open)
          # nur, wenn die Sonne schon hoch genug steht; der Sonnen-Auslöser nur
          # zwischen frühestens und spätestens; "spätestens" nur, wenn die Sonne die
          # Höhe noch nicht erreicht hat. Grenzen inklusiv: Fallen Sonnen-Update und
          # Uhrzeit in dieselbe Sekunde, öffnen notfalls beide (harmlos), statt keiner;
          # beim Sonnen-Auslöser zählt dafür die Uhrzeit des Sonnen-Updates.
          # Ohne Helfer gibt es kein "frühestens" ('' liegt vor jeder Uhrzeit); liegt
          # "frühestens" nicht vor "spätestens", gilt "frühestens". "Morgens öffnen
          # aktivieren" bleibt Hauptschalter (enabled: wertet nur einen Input aus)
          - condition: >-
              {% if not morning_sun_enabled %}
                {{ true }}
              {% elif not morning_enabled %}
                {{ false }}
              {% else %}
                {% set elev = state_attr('sun.sun', 'elevation') %}
                {% set reached = elev is number and elev > morning_sun_elevation %}
                {% set t = (trigger.to_state.last_updated | as_local).strftime('%H:%M:%S')
                   if trigger.id == 'morning_open_sun' else now().strftime('%H:%M:%S') %}
                {% set l = today_at(morning_latest).strftime('%H:%M:%S') %}
                {% set e = states(morning_time)[-8:]
                   if morning_time is string and has_value(morning_time) else '' %}
                {% if trigger.id == 'morning_open' %}
                  {{ reached or e >= l }}
                {% elif trigger.id == 'morning_open_sun' %}
                  {{ e <= t <= l }}
                {% else %}
                  {{ not reached and e < l }}
                {% endif %}
              {% endif %}
          # Zufallsversatz (Anwesenheitssimulation): 0 bis X Minuten später öffnen,
          # nie früher. Bei 0 entfällt die Wartezeit komplett (bisheriges Verhalten)
          - if:
              - "{{ morning_random_delay | int(0) > 0 }}"
            then:
              - variables:
                  shading_on_before: "{{ shading_status_helper is string and is_state(shading_status_helper, 'on') }}"
              - delay:
                  seconds: "{{ range(0, (morning_random_delay | int(0)) * 60 + 1) | random }}"
              # Zustand nach dem Warten neu bewerten: Das Pause-Gate oben ist veraltet.
              # Hat die Beschattung erst während der Wartezeit begonnen, hat sie den
              # Rollladen übernommen — Öffnen gäbe nur ein Auf und gleich wieder Ab
              # (ohne Verzögerung wäre er jetzt ebenfalls beschattet). Wind und
              # Position werden unten ohnehin erst jetzt bewertet
              - variables:
                  pause_now: >-
                    {% set helpers = [pause_boolean] if pause_boolean is string else pause_boolean %}
                    {% set pausing = 'on' if pause_mode == 'on_pauses' else 'off' %}
                    {% set found = expand(helpers) | list %}
                    {{ helpers | length > 0
                       and found | length > 0
                       and found | rejectattr('state', 'eq', pausing) | list | length == 0 }}
                  shading_started: >-
                    {{ not shading_on_before
                       and shading_status_helper is string
                       and is_state(shading_status_helper, 'on') }}
              - if:
                  - "{{ pause_now or shading_started }}"
                then:
                  - stop: "Nach der Zufallsverzögerung pausiert oder Beschattung inzwischen aktiv"
          # Sturm hat immer Vorrang: bei Starkwind wird morgens nicht bewegt
          # (im Panzer-Modus wäre das Öffnen direkt kontraproduktiv)
          - variables:
              wind_now: >-
                {% if storm_wind_sensor is string %}
                  {{ states(storm_wind_sensor) | float(0) }}
                {% elif weather_entity is string %}
                  {{ state_attr(weather_entity, 'wind_speed') | float(0) }}
                {% else %}
                  0
                {% endif %}
              # Frostschutz: bei Frost höchstens bis zur Frost-Position öffnen
              morning_target: >-
                {{ [morning_position | int, frost_max_position | int] | min if frost_active
                   else morning_position | int }}
              # Regenschutz jetzt lesen — nach einer Zufallsverzögerung ist rain_hold
              # vom Laufbeginn veraltet (Regen inzwischen vorbei oder Fenster zu)
              rain_hold_now: >-
                {{ rain_sensor is string
                   and is_state(rain_sensor, 'on')
                   and (as_timestamp(now()) - as_timestamp(states[rain_sensor].last_changed)) >= (rain_delay | float(0)) * 60 - 1
                   and ((states(window_sensor) | lower if window_sensor is string else 'closed') == 'tilted'
                        or ((states(window_sensor) | lower if window_sensor is string else 'closed') in ['on', 'open'] and (treat_open_as_tilted or rain_include_open))) }}
          - if:
              - "{{ storm_enabled and (wind_now | float(0)) >= wind_speed_threshold }}"
            then:
              - event: s42_rollladen_status
                event_data:
                  cover: "{{ cover_entity }}"
                  text: "Morgens öffnen übersprungen (Sturm)"
              - stop: "Sturm — Morgens-Öffnen entfällt"
          # Regenschutz aktiv: nicht öffnen, sondern die Morgen-Position als
          # Rückkehr-Position fürs Regenende vormerken (Regen-Snapshot überschreiben)
          - if:
              - "{{ rain_hold_now }}"
            then:
              - if:
                  - "{{ rain_restore }}"
                  - "{{ state_attr(cover_entity, 'current_position') | int(101) < morning_target }}"
                then:
                  - action: scene.create
                    data:
                      scene_id: "{{ 'rain_' ~ (cover_entity | slugify) }}"
                      entities: "{{ {cover_entity: {'state': 'open', 'current_position': morning_target | int}} }}"
              - event: s42_rollladen_status
                event_data:
                  cover: "{{ cover_entity }}"
                  text: "Morgens öffnen übersprungen (Regenschutz)"
              - stop: "Regenschutz aktiv — Morgens-Öffnen erst nach dem Regen"
          - choose:
              # Sanftes Wecken: in Schritten zur Zielposition statt in einem Zug
              - conditions:
                  - "{{ morning_soft_duration | int(0) > 0 }}"
                  - "{{ state_attr(cover_entity, 'current_position') is not none }}"
                  - "{{ state_attr(cover_entity, 'current_position') | int(101) < morning_target }}"
                sequence:
                  # Alte Beschattungs-Episode gleich zu Beginn freigeben (wie beim
                  # Öffnen in einem Zug) — eine während des Weckens neu startende
                  # Beschattung übernimmt dann und beendet das Wecken
                  - if:
                      - "{{ shading_status_helper is string and is_state(shading_status_helper, 'on') }}"
                    then:
                      - action: input_boolean.turn_off
                        target:
                          entity_id: "{{ shading_status_helper }}"
                  - variables:
                      soft_started: "{{ as_timestamp(now()) }}"
                      # Fahrplan: Schritte von mindestens 5 %, höchstens einer pro
                      # Minute (Motorschonung); der letzte fährt exakt die Zielposition an
                      soft_plan: >-
                        {%- set start = state_attr(cover_entity, 'current_position') | int(0) -%}
                        {%- set target = morning_target | int(100) -%}
                        {%- set n = [[morning_soft_duration | int(0) + 1, ((target - start) / 5) | int] | min, 1] | max -%}
                        {%- set ns = namespace(plan=[]) -%}
                        {%- for i in range(1, n) -%}
                          {%- set ns.plan = ns.plan + [(start + (target - start) * i / n) | round(0) | int] -%}
                        {%- endfor -%}
                        {{ ns.plan + [target] }}
                      # Erster Schritt sofort, der letzte nach Ablauf der Dauer
                      soft_interval: >-
                        {{ (morning_soft_duration | int(0) * 60 / ([soft_plan | length - 1, 1] | max)) | round(0) | int }}
                  - event: s42_rollladen_status
                    event_data:
                      cover: "{{ cover_entity }}"
                      text: "Morgens → {{ morning_target }} % sanft in {{ morning_soft_duration | int }} Min.{{ ' (Frost-Grenze)' if morning_target | int < morning_position | int else '' }}"
                  - repeat:
                      sequence:
                        - action: cover.set_cover_position
                          target:
                            entity_id: !input cover
                          data:
                            position: "{{ soft_plan[repeat.index - 1] }}"
                        - if:
                            - "{{ repeat.index < soft_plan | length }}"
                          then:
                            - delay:
                                seconds: "{{ soft_interval }}"
                            # Erst prüfen, wenn der Rollladen steht — mitten in einer
                            # Fahrt ist die gemeldete Position noch nicht aussagekräftig
                            - wait_template: "{{ not is_state(cover_entity, 'opening') and not is_state(cover_entity, 'closing') }}"
                              timeout:
                                minutes: 2
                      # Nach jedem Schritt die Welt neu bewerten. Abbruch (Rest wird
                      # nicht mehr gefahren), sobald etwas anderes übernimmt. Alles
                      # direkt hier ausgewertet: Variablen aus dem Schleifen-Inneren
                      # sind für "until" nicht sichtbar. repeat.index ist 1-basiert:
                      # soft_plan[repeat.index - 1] = zuletzt befohlene Position
                      until:
                        - condition: or
                          conditions:
                            # Fahrplan fertig
                            - "{{ repeat.index >= soft_plan | length }}"
                            # Fährt immer noch (Fremdbefehl) oder steht um mindestens eine
                            # Schrittweite (5 %) woanders als befohlen: Handbetätigung oder
                            # eine andere Automatik (auch "einen Schritt zurück" zählt)
                            - "{{ is_state(cover_entity, 'opening') or is_state(cover_entity, 'closing') }}"
                            - "{{ (state_attr(cover_entity, 'current_position') | int(-100) - soft_plan[repeat.index - 1] | int) | abs >= 5 }}"
                            # Sturm hat Vorrang
                            - >-
                              {% if storm_wind_sensor is string %}
                                {% set wind = states(storm_wind_sensor) | float(0) %}
                              {% elif weather_entity is string %}
                                {% set wind = state_attr(weather_entity, 'wind_speed') | float(0) %}
                              {% else %}
                                {% set wind = 0 %}
                              {% endif %}
                              {{ storm_enabled and wind >= wind_speed_threshold }}
                            # Pause inzwischen aktiv
                            - >-
                              {% set helpers = [pause_boolean] if pause_boolean is string else pause_boolean %}
                              {% set pausing = 'on' if pause_mode == 'on_pauses' else 'off' %}
                              {% set found = expand(helpers) | list %}
                              {{ helpers | length > 0
                                 and found | length > 0
                                 and found | rejectattr('state', 'eq', pausing) | list | length == 0 }}
                            # Nachtmodus seit Weckbeginn (wieder) eingeschaltet — war er
                            # beim Start noch an, stört das nicht (wie beim Öffnen in einem Zug)
                            - >-
                              {{ night_mode_boolean is string and is_state(night_mode_boolean, 'on')
                                 and as_timestamp(states[night_mode_boolean].last_changed) > soft_started }}
                            # Fenster seit Weckbeginn geöffnet/gekippt: Fenster-Interaktion
                            # übernimmt (über Nacht gekippt zählt nicht)
                            - >-
                              {{ window_sensor is string
                                 and (states(window_sensor) | lower) in ['on', 'open', 'tilted']
                                 and as_timestamp(states[window_sensor].last_changed) > soft_started }}
                            # Beschattung hat seit Weckbeginn eingesetzt und übernimmt —
                            # sonst hielte sie die weiteren Schritte für Handeingriffe
                            - >-
                              {{ shading_status_helper is string and is_state(shading_status_helper, 'on')
                                 and as_timestamp(states[shading_status_helper].last_changed) > soft_started }}
              - conditions:
                  - "{{ state_attr(cover_entity, 'current_position') is not none }}"
                  - "{{ state_attr(cover_entity, 'current_position') | int(101) < morning_target }}"
                sequence:
                  - action: cover.set_cover_position
                    target:
                      entity_id: !input cover
                    data:
                      position: "{{ morning_target }}"
                  - event: s42_rollladen_status
                    event_data:
                      cover: "{{ cover_entity }}"
                      text: "Morgens → {{ morning_target }} %{{ ' (Frost-Grenze)' if morning_target | int < morning_position | int else '' }}"
              # Fallback für Cover ohne Positions-Attribut (kann auch bei Frost
              # nicht begrenzen, open_cover fährt immer ganz auf)
              - conditions:
                  - "{{ state_attr(cover_entity, 'current_position') is none }}"
                sequence:
                  - action: cover.open_cover
                    target:
                      entity_id: !input cover
                  - event: s42_rollladen_status
                    event_data:
                      cover: "{{ cover_entity }}"
                      text: "Morgens → auf"
          # Morgens-Öffnen ist für die Beschattung eine Fremdbewegung: Status freigeben,
          # damit ein heißer Sommermorgen direkt wieder frisch beschattet werden kann
          - if:
              - "{{ shading_status_helper is string and is_state(shading_status_helper, 'on') }}"
              # Sanftes Wecken: eine erst während des Weckens gestartete Beschattung
              # hat übernommen und darf nicht wieder freigegeben werden
              - "{{ morning_soft_duration | int(0) == 0 or as_timestamp(states[shading_status_helper].last_changed) < morning_run_start }}"
            then:
              - action: input_boolean.turn_off
                target:
                  entity_id: "{{ shading_status_helper }}"
          # Fenster gerade offen/gekippt: Ein wartendes Zurückfahren würde sonst die
          # Position von vor dem Lüften (meist: zu) zurückholen. Morgens ersetzt sie —
          # gemerkte Ausgangsposition verwerfen, nach dem Schließen bleibt der
          # Rollladen, wo er ist. Auch wenn oben nichts gefahren ist (schon offen).
          # Existenz vorher prüfen: scene.delete schlägt bei fehlender Szene fehl
          # (continue_on_error: falls ein paralleler Lauf sie gerade gelöscht hat)
          # Fensterzustand jetzt lesen (nach Zufallsversatz/sanftem Wecken veraltet)
          - if:
              - "{{ ((states(window_sensor) | lower) if window_sensor is string else 'closed') not in ['off', 'closed'] }}"
              - "{{ expand(reclose_scene) | count > 0 }}"
            then:
              - action: scene.delete
                continue_on_error: true
                target:
                  entity_id: "{{ reclose_scene }}"

      # --- NACHTMODUS ---
      - conditions:
          - condition: trigger
            id:
              - night_close
              - night_close_time
              - night_close_sun
              - night_close_sun_earliest
              - night_close_sun_latest
        sequence:
          - variables:
              sun_trigger: >-
                {{ trigger.id in ['night_close_sun', 'night_close_sun_earliest', 'night_close_sun_latest'] }}
          # Fehlkonfiguration laut machen: Blueprints können "nur eine Quelle" nicht
          # im Formular erzwingen. Vorrang: Helfer vor Uhrzeit vor Sonnenstand — die
          # Auslöser der nachrangigen Quellen bewegen dann nichts
          - if:
              - "{{ [night_mode_boolean is string, night_mode_time is string, night_sun_enabled] | select | list | count > 1 }}"
            then:
              - action: persistent_notification.create
                data:
                  notification_id: "rollladen_nachtmodus_doppelt_{{ cover_entity | slugify }}"
                  title: "Rollladensteuerung: Nachtmodus mehrfach konfiguriert"
                  message: >-
                    {%- set sources = [] -%}
                    {%- if night_mode_boolean is string %}{% set sources = sources + ['Nachtmodus-Helfer'] %}{% endif -%}
                    {%- if night_mode_time is string %}{% set sources = sources + ['Nachtmodus-Uhrzeit'] %}{% endif -%}
                    {%- if night_sun_enabled %}{% set sources = sources + ['Nachtmodus nach Sonnenstand'] %}{% endif -%}
                    Für "{{ state_attr(cover_entity, 'friendly_name') or cover_entity }}"
                    sind mehrere Nachtmodus-Quellen gesetzt ({{ sources | join(', ') }})
                    — es darf nur eine davon gesetzt sein. Bis dahin gilt
                    "{{ sources[0] }}", die übrigen werden ignoriert (Vorrang: Helfer
                    vor Uhrzeit vor Sonnenstand). Bitte in der Automation die übrigen
                    Felder leeren bzw. "Nachtmodus nach Sonnenstand" ausschalten.
              - if:
                  - >-
                    {{ (trigger.id == 'night_close_time' and night_mode_boolean is string)
                       or (sun_trigger and (night_mode_boolean is string or night_mode_time is string)) }}
                then:
                  - stop: "Mehrere Nachtmodus-Quellen gesetzt — dieser Auslöser hat keinen Vorrang"
          # Nachtmodus nach Sonnenstand: pro Abend genau einmal schließen, und zwar nur
          # mit dem Auslöser, mit dem die Nacht gerade beginnt — "frühestens", wenn die
          # Sonne schon tief steht; der Sonnen-Auslöser bis einschließlich "spätestens";
          # "spätestens" nur, wenn die Sonne noch nicht tief genug steht
          - condition: >-
              {{ not sun_trigger
                 or (night_sun.night
                     and (trigger.id == 'night_close_sun_earliest'
                          or (trigger.id == 'night_close_sun' and not night_sun.after_latest)
                          or (trigger.id == 'night_close_sun_latest' and not night_sun.sun_low))) }}
          # Zufallsversatz (Anwesenheitssimulation): 0 bis X Minuten später
          # schließen, nie früher. Bei 0 entfällt die Wartezeit komplett
          - if:
              - "{{ night_random_delay | int(0) > 0 }}"
            then:
              - delay:
                  seconds: "{{ range(0, (night_random_delay | int(0)) * 60 + 1) | random }}"
              # Zustand nach dem Warten neu bewerten: Nachtmodus inzwischen wieder
              # aus oder Pause aktiv (das Gate oben ist veraltet) → gar nichts tun,
              # auch die Status-Helfer bleiben dann unangetastet. Wurde der Helfer
              # zwischendurch aus- und wieder eingeschaltet, übernimmt der neuere Lauf
              - variables:
                  pause_now: >-
                    {% set helpers = [pause_boolean] if pause_boolean is string else pause_boolean %}
                    {% set pausing = 'on' if pause_mode == 'on_pauses' else 'off' %}
                    {% set found = expand(helpers) | list %}
                    {{ helpers | length > 0
                       and found | length > 0
                       and found | rejectattr('state', 'eq', pausing) | list | length == 0 }}
                  # Uhrzeit-/Sonnenstand-Auslöser haben keinen Zustandswechsel — dort gilt
                  # die Nacht bis zum Morgen, eine Wartezeit von max. 60 Minuten ändert daran nichts
                  night_still_on: >-
                    {% if trigger.platform == 'state' and trigger.entity_id == night_mode_boolean %}
                      {{ is_state(night_mode_boolean, 'on')
                         and states[night_mode_boolean].last_changed == trigger.to_state.last_changed }}
                    {% else %}
                      {{ true }}
                    {% endif %}
              - if:
                  - "{{ pause_now or not night_still_on }}"
                then:
                  - stop: "Nach der Zufallsverzögerung pausiert oder Nachtmodus nicht mehr (durchgehend) an"
          # Beschattungs-Status zurücksetzen: Die Nacht beendet die Beschattung,
          # sonst springt der Rollladen morgens beim ersten Tick auf die End-Position.
          # Bewusst erst nach der Zufallsverzögerung: Bis dahin ist die Beschattung
          # durch den Nachtmodus ohnehin eingefroren — und bricht der Lauf oben ab
          # (Nachtmodus wieder aus), endet sie regulär, statt in
          # Beschattungsposition hängen zu bleiben
          - if:
              - "{{ shading_status_helper is string and is_state(shading_status_helper, 'on') }}"
            then:
              - action: input_boolean.turn_off
                target:
                  entity_id: "{{ shading_status_helper }}"
          # Sonnenheizen-Status ebenfalls zurücksetzen, damit die nächste Aktivierung
          # (nächster sonniger kalter Morgen) nicht durch einen Alt-Zustand blockiert wird
          - if:
              - "{{ solar_heating_status_helper is string and is_state(solar_heating_status_helper, 'on') }}"
            then:
              - action: input_boolean.turn_off
                target:
                  entity_id: "{{ solar_heating_status_helper }}"
          # Sturm hat Vorrang vor der verzögerten Fahrt: Während der Wartezeit kann
          # Starkwind aufgekommen sein — dann bleibt der Rollladen oben, wo ihn der
          # Sturmschutz haben will. Im Panzer-Modus ist Schließen ohnehin die
          # Schutzrichtung. Ohne Verzögerung bleibt das bisherige Verhalten unverändert
          - variables:
              wind_now: >-
                {% if storm_wind_sensor is string %}
                  {{ states(storm_wind_sensor) | float(0) }}
                {% elif weather_entity is string %}
                  {{ state_attr(weather_entity, 'wind_speed') | float(0) }}
                {% else %}
                  0
                {% endif %}
          - condition: >-
              {{ night_random_delay | int(0) == 0
                 or not storm_enabled
                 or panzer_mode
                 or (wind_now | float(0)) < wind_speed_threshold }}
          # Fenster, Notfall und Hindernis-Sperre JETZT lesen: Nach einer
          # Zufallsverzögerung (bis 60 Minuten) sind die Werte vom Laufbeginn veraltet —
          # ein inzwischen geöffnetes Fenster darf nicht zugefahren werden
          - variables:
              win_now: "{{ (states(window_sensor) | lower) if window_sensor is string else 'closed' }}"
              # Regenschutz mit dem Fenster von jetzt (wie rain_hold oben)
              rain_hold_now: >-
                {{ rain_sensor is string
                   and is_state(rain_sensor, 'on')
                   and (as_timestamp(now()) - as_timestamp(states[rain_sensor].last_changed)) >= (rain_delay | float(0)) * 60 - 1
                   and (win_now == 'tilted'
                        or (win_now in ['on', 'open'] and (treat_open_as_tilted or rain_include_open))) }}
              emergency_now: >-
                {% set sensors = [emergency_sensors] if emergency_sensors is string else emergency_sensors %}
                {{ sensors | select('is_state', 'on') | list | length > 0 }}
              block_now: >-
                {% set sensors = [block_sensors] if block_sensors is string else block_sensors %}
                {% set ns = namespace(blocked = false) %}
                {% for s in sensors %}
                  {% if states(s) != 'off'
                        or as_timestamp(now()) - as_timestamp(states[s].last_changed) < (block_release_delay | float(0)) * 60 - 2 %}
                    {% set ns.blocked = true %}
                  {% endif %}
                {% endfor %}
                {{ ns.blocked }}
          # Notfall: Rollladen bleibt oben. Hindernis-Sperre: Status-Helfer oben
          # trotzdem zurücksetzen (die Nacht beendet die Episoden), aber nicht
          # fahren — die Freigabe holt das nach
          - condition: "{{ not emergency_now }}"
          - condition: "{{ not block_now }}"
          - choose:
              # Regenschutz aktiv: Lüftungsposition höchstens bis zur Regenposition
              - conditions:
                  - "{{ rain_hold_now }}"
                sequence:
                  - action: cover.set_cover_position
                    target:
                      entity_id: !input cover
                    data:
                      position: >-
                        {% set vent = tilted_position if (win_now == 'tilted' or treat_open_as_tilted)
                           else night_ventilation_position %}
                        {{ [vent | int, rain_position | int] | min }}
                  - event: s42_rollladen_status
                    event_data:
                      cover: "{{ cover_entity }}"
                      text: "Nachtmodus → {{ [(tilted_position if (win_now == 'tilted' or treat_open_as_tilted) else night_ventilation_position) | int, rain_position | int] | min }} % (Fenster {{ 'gekippt' if win_now == 'tilted' else 'offen' }}, Regen)"
              - conditions:
                  - "{{ win_now == 'tilted' or (treat_open_as_tilted and win_now in ['on', 'open']) }}"
                sequence:
                  - action: cover.set_cover_position
                    target:
                      entity_id: !input cover
                    data:
                      position: !input tilted_position
                  - event: s42_rollladen_status
                    event_data:
                      cover: "{{ cover_entity }}"
                      text: "Nachtmodus → {{ tilted_position | int }} % (Fenster {{ 'gekippt' if win_now == 'tilted' else 'offen, wie gekippt' }})"
              - conditions:
                  - "{{ win_now in ['on', 'open'] }}"
                sequence:
                  - action: cover.set_cover_position
                    target:
                      entity_id: !input cover
                    data:
                      position: !input night_ventilation_position
                  - event: s42_rollladen_status
                    event_data:
                      cover: "{{ cover_entity }}"
                      text: "Nachtmodus → {{ night_ventilation_position | int }} % (Fenster offen)"
            default:
              # Fenster zu: ganz schließen (Nachtposition 0 oder Cover ohne
              # Positionsangabe), sonst nur abwärts auf die Nachtposition — ein
              # schon tieferer Rollladen wird nachts nicht wieder teilgeöffnet
              - choose:
                  - conditions:
                      - "{{ night_close_position | int(0) == 0 or state_attr(cover_entity, 'current_position') is none }}"
                    sequence:
                      - action: cover.close_cover
                        target:
                          entity_id: !input cover
                      - event: s42_rollladen_status
                        event_data:
                          cover: "{{ cover_entity }}"
                          text: "Nachtmodus → zu"
                  - conditions:
                      - "{{ state_attr(cover_entity, 'current_position') | int(-1) > night_close_position | int(0) }}"
                    sequence:
                      - action: cover.set_cover_position
                        target:
                          entity_id: !input cover
                        data:
                          position: !input night_close_position
                      - event: s42_rollladen_status
                        event_data:
                          cover: "{{ cover_entity }}"
                          text: "Nachtmodus → {{ night_close_position | int }} %"

      # --- STURMSCHUTZ ---
      - conditions:
          - condition: trigger
            id: storm_detected
          - "{{ force_storm_action or window_state in ['off', 'closed'] }}"
        sequence:
          # Beschattungs-Status zurücksetzen: Die Sturm-Bewegung darf nicht als
          # manueller Eingriff gewertet werden — sobald der Wind nachlässt, soll
          # der nächste Tick wieder frisch beschatten können
          - if:
              - "{{ shading_status_helper is string and is_state(shading_status_helper, 'on') }}"
            then:
              - action: input_boolean.turn_off
                target:
                  entity_id: "{{ shading_status_helper }}"
          - if:
              - "{{ not panzer_mode }}"
            then:
              # Bewusst ohne Frost-Begrenzung: Bei Sturm ist der ganz eingefahrene
              # Panzer sicherer als ein teilweise offener, der im Wind flattert
              - action: cover.open_cover
                target:
                  entity_id: !input cover
              - event: s42_rollladen_status
                event_data:
                  cover: "{{ cover_entity }}"
                  text: "Sturm → auf"
            else:
              # Hindernis-Sperre geht auch dem Panzer-Modus vor: Ein aufgelaufener,
              # ausgehakter Panzer schützt vor nichts mehr — die Freigabe holt es nach
              - condition: "{{ not block_active }}"
              - action: cover.close_cover
                target:
                  entity_id: !input cover
              - event: s42_rollladen_status
                event_data:
                  cover: "{{ cover_entity }}"
                  text: "Sturm → zu (Panzer-Modus)"

      # --- STURMSCHUTZ ÜBERSPRUNGEN (nur Diagnose) ---
      # Greift nur, wenn die Option davor nicht passte: Fenster nicht zu und
      # "Aktion bei Sturm erzwingen" aus — bewegt nichts, vermerkt nur den Grund
      - conditions:
          - condition: trigger
            id: storm_detected
        sequence:
          - event: s42_rollladen_status
            event_data:
              cover: "{{ cover_entity }}"
              text: >-
                Sturmschutz übersprungen
                ({{ 'Fenster gekippt' if window_state == 'tilted'
                    else 'Fenster offen' if window_state in ['on', 'open']
                    else 'Fensterstatus unbekannt' }})

      # --- STURM-ENTWARNUNG: NORMALZUSTAND HERSTELLEN ---
      # Bewusst keine Pause-Ausnahme: Während einer Pause passiert nichts, das
      # Pause-Ende holt den Nachtmodus nach
      - conditions:
          - condition: trigger
            id: storm_released
          # Wind-Sensor hat Vorrang: Ist er gesetzt, zählt die Wetter-Entität nicht
          - "{{ not (storm_wind_sensor is string and trigger.entity_id == weather_entity) }}"
          # Nur nach echtem Unterschreiten: Der Wert direkt davor muss numerisch
          # über dem Grenzwert gelegen haben (from_state bleibt auch mit for: der
          # Zustand vor dem Unterschreiten). unavailable/unknown schalten den
          # below-Trigger ebenfalls scharf, etwa nach einem Neustart — ohne diese
          # Prüfung gäbe es Entwarnungen an windstillen Tagen
          - >-
            {% set fs = trigger.from_state %}
            {% if fs is none %}
              {% set v = none %}
            {% elif trigger.entity_id == weather_entity %}
              {% set v = fs.attributes.get('wind_speed') %}
            {% else %}
              {% set v = fs.state %}
            {% endif %}
            {{ is_number(v) and v | float >= wind_speed_threshold }}
        sequence:
          # Regenschutz nachholen (wie beim Pause-Ende): rain_start feuert nur einmal und
          # wurde evtl. durch Sturm, Notfall oder Hindernis ausgelassen
          - if:
              - "{{ rain_hold }}"
              - "{{ not rain_storm_active or panzer_mode }}"
              - "{{ state_attr(cover_entity, 'current_position') | int(-1) > rain_position }}"
              - "{{ not block_active }}"
            then:
              - if:
                  - "{{ rain_restore and expand(rain_scene) | count == 0 }}"
                then:
                  - action: scene.create
                    data:
                      scene_id: "{{ 'rain_' ~ (cover_entity | slugify) }}"
                      snapshot_entities:
                        - "{{ cover_entity }}"
              - action: cover.set_cover_position
                target:
                  entity_id: !input cover
                data:
                  position: !input rain_position
              - event: s42_rollladen_status
                event_data:
                  cover: "{{ cover_entity }}"
                  text: "Sturm vorbei → {{ rain_position | int }} % (Regenschutz)"
              # Beschattungs-Status NICHT freigeben (sonst ginge ein Beschattungs-Ende
              # verloren, das in die Zwischenzeit fällt), sondern zum Abgleich vormerken:
              # Der nächste Tick fährt auf die Sollposition, ohne die Abweichung als
              # manuellen Eingriff zu werten — oder beendet die Beschattung regulär
              - if:
                  - "{{ shading_status_helper is string and is_state(shading_status_helper, 'on') }}"
                then:
                  - action: scene.create
                    data:
                      scene_id: "{{ 'shading_resync_' ~ (cover_entity | slugify) }}"
                      snapshot_entities:
                        - "{{ cover_entity }}"
          # Ab hier nur mit eingestellter Entwarnung
          - condition: "{{ storm_release_delay | int(0) > 0 }}"
          - variables:
              release_night: "{{ night_mode_on }}"
              # Tagsüber = Nachtmodus aus, Sonne über dem Horizont und Morgens-Uhrzeit
              # (falls eingerichtet) vorbei — im Zweifel lieber zu lassen als im
              # Dunkeln oder vor der Weckzeit öffnen. Morgens nach Sonnenstand: die
              # Uhrzeit ist "frühestens", zusätzlich muss das Öffnen fällig sein
              release_daytime: >-
                {% set mt = morning_time if morning_enabled and morning_time is string else '' %}
                {% set morning_passed = not mt or not has_value(mt)
                   or state_attr(mt, 'has_date') or now() >= today_at(states(mt)) %}
                {% if morning_enabled and morning_sun_enabled %}
                  {% set morning_passed = morning_passed and morning_open_due %}
                {% endif %}
                {{ not release_night and morning_passed and is_state('sun.sun', 'above_horizon') }}
          - choose:
              # Nachtmodus aktiv: Nachtzustand wie beim Pause-Ende nachholen
              # (bei Hindernis-Sperre nicht — das Ende der Sperre holt nach)
              - conditions:
                  - "{{ release_night }}"
                  - "{{ not block_active }}"
                sequence:
                  - choose:
                      # Regenschutz aktiv: Lüftungsposition höchstens bis zur Regenposition
                      - conditions:
                          - "{{ rain_hold }}"
                        sequence:
                          - action: cover.set_cover_position
                            target:
                              entity_id: !input cover
                            data:
                              position: >-
                                {% set vent = tilted_position if (window_state == 'tilted' or treat_open_as_tilted)
                                   else night_ventilation_position %}
                                {{ [vent | int, rain_position | int] | min }}
                          - event: s42_rollladen_status
                            event_data:
                              cover: "{{ cover_entity }}"
                              text: "Sturm vorbei → {{ [(tilted_position if (window_state == 'tilted' or treat_open_as_tilted) else night_ventilation_position) | int, rain_position | int] | min }} % (Nachtmodus, Regen)"
                      - conditions:
                          - "{{ window_state == 'tilted' or (treat_open_as_tilted and window_state in ['on', 'open']) }}"
                        sequence:
                          - action: cover.set_cover_position
                            target:
                              entity_id: !input cover
                            data:
                              position: !input tilted_position
                          - event: s42_rollladen_status
                            event_data:
                              cover: "{{ cover_entity }}"
                              text: "Sturm vorbei → {{ tilted_position | int }} % (Nachtmodus, Fenster {{ 'gekippt' if window_state == 'tilted' else 'offen, wie gekippt' }})"
                      - conditions:
                          - "{{ window_state in ['on', 'open'] }}"
                        sequence:
                          - action: cover.set_cover_position
                            target:
                              entity_id: !input cover
                            data:
                              position: !input night_ventilation_position
                          - event: s42_rollladen_status
                            event_data:
                              cover: "{{ cover_entity }}"
                              text: "Sturm vorbei → {{ night_ventilation_position | int }} % (Nachtmodus, Fenster offen)"
                    default:
                      # Wie im Nachtmodus-Zweig: ganz schließen oder nur abwärts auf die Nachtposition
                      - choose:
                          - conditions:
                              - "{{ night_close_position | int(0) == 0 or state_attr(cover_entity, 'current_position') is none }}"
                            sequence:
                              - action: cover.close_cover
                                target:
                                  entity_id: !input cover
                              - event: s42_rollladen_status
                                event_data:
                                  cover: "{{ cover_entity }}"
                                  text: "Sturm vorbei → zu (Nachtmodus)"
                          - conditions:
                              - "{{ state_attr(cover_entity, 'current_position') | int(-1) > night_close_position | int(0) }}"
                            sequence:
                              - action: cover.set_cover_position
                                target:
                                  entity_id: !input cover
                                data:
                                  position: !input night_close_position
                              - event: s42_rollladen_status
                                event_data:
                                  cover: "{{ cover_entity }}"
                                  text: "Sturm vorbei → {{ night_close_position | int }} % (Nachtmodus)"
              # Tagsüber im Panzer-Modus: den noch geschlossenen Rollladen wie
              # morgens öffnen (nur aufwärts, Fensterregel wie beim Sturmschutz).
              # Hat ihn inzwischen etwas anderes bewegt, bleibt er. Eine laufende
              # Beschattung (Status an, auch bei 0 %) hat Vorrang — sonst führe er
              # hoch und der nächste Tick gleich wieder herunter. Der Sturm-Zweig hat
              # den Status bereits freigegeben, der nächste Tick beschattet bei Bedarf
              - conditions:
                  - "{{ panzer_mode and release_daytime }}"
                  - "{{ force_storm_action or window_state in ['off', 'closed'] }}"
                  - "{{ is_state(cover_entity, 'closed') }}"
                  - "{{ not (shading_status_helper is string and is_state(shading_status_helper, 'on')) }}"
                sequence:
                  # Frostschutz: das Wiederöffnen ist eine normale Öffnungsfahrt
                  - variables:
                      release_target: >-
                        {{ [morning_position | int, frost_max_position | int] | min if frost_active
                           else morning_position | int }}
                  - choose:
                      - conditions:
                          - "{{ state_attr(cover_entity, 'current_position') is not none }}"
                          - "{{ state_attr(cover_entity, 'current_position') | int(101) < release_target }}"
                        sequence:
                          - action: cover.set_cover_position
                            target:
                              entity_id: !input cover
                            data:
                              position: "{{ release_target }}"
                          - event: s42_rollladen_status
                            event_data:
                              cover: "{{ cover_entity }}"
                              text: "Sturm vorbei → {{ release_target }} %"
                      # Fallback für Cover ohne Positions-Attribut
                      - conditions:
                          - "{{ state_attr(cover_entity, 'current_position') is none }}"
                        sequence:
                          - action: cover.open_cover
                            target:
                              entity_id: !input cover
                          - event: s42_rollladen_status
                            event_data:
                              cover: "{{ cover_entity }}"
                              text: "Sturm vorbei → auf"

      # --- PAUSE BEENDET: ZUSTAND NACHHOLEN ---
      - conditions:
          - condition: trigger
            id: pause_ended
          # Nur nachholen, wenn VOR diesem Helfer-Wechsel wirklich pausiert war:
          # Bei mehreren Helfern feuert der Trigger auch bei Wechseln, die die
          # (nie aktive) Pause gar nicht beendet haben — dann darf hier nichts passieren
          - >-
            {% set helpers = [pause_boolean] if pause_boolean is string else pause_boolean %}
            {% set pausing = 'on' if pause_mode == 'on_pauses' else 'off' %}
            {% set ns = namespace(all = helpers | length > 0) %}
            {% for h in helpers %}
              {% set st = trigger.from_state.state if h == trigger.entity_id else states(h) %}
              {% if st != pausing %}{% set ns.all = false %}{% endif %}
            {% endfor %}
            {{ ns.all }}
        sequence:
          # Während der Pause ist der Sollwert weitergewandert.
          # Beschattungs-Status NICHT freigeben (sonst ginge ein Beschattungs-Ende
          # verloren, das in die Zwischenzeit fällt), sondern zum Abgleich vormerken:
          # Der nächste Tick fährt auf die Sollposition, ohne die Abweichung als
          # manuellen Eingriff zu werten — oder beendet die Beschattung regulär
          - if:
              - "{{ shading_status_helper is string and is_state(shading_status_helper, 'on') }}"
            then:
              - action: scene.create
                data:
                  scene_id: "{{ 'shading_resync_' ~ (cover_entity | slugify) }}"
                  snapshot_entities:
                    - "{{ cover_entity }}"
          # Regenschutz nachholen: Regnet es bei gekipptem Fenster, nicht bis zum
          # nächsten Regenbeginn ungeschützt bleiben. Sturm hat Vorrang (außer im
          # Panzer-Modus, dort ist Herunterfahren ohnehin die Schutzrichtung)
          - if:
              - "{{ rain_hold }}"
              - "{{ not rain_storm_active or panzer_mode }}"
              - "{{ state_attr(cover_entity, 'current_position') | int(-1) > rain_position }}"
              - "{{ not block_active }}"
            then:
              - if:
                  - "{{ rain_restore and expand(rain_scene) | count == 0 }}"
                then:
                  - action: scene.create
                    data:
                      scene_id: "{{ 'rain_' ~ (cover_entity | slugify) }}"
                      snapshot_entities:
                        - "{{ cover_entity }}"
              - action: cover.set_cover_position
                target:
                  entity_id: !input cover
                data:
                  position: !input rain_position
              - event: s42_rollladen_status
                event_data:
                  cover: "{{ cover_entity }}"
                  text: "Pause beendet → {{ rain_position | int }} % (Regenschutz)"
          # Verpassten Nachtmodus nachholen — "nachts offen" wäre der schlimmste
          # während der Pause verpasste Zustand. Sturm hat weiterhin Vorrang.
          - variables:
              wind_now: >-
                {% if storm_wind_sensor is string %}
                  {{ states(storm_wind_sensor) | float(0) }}
                {% elif weather_entity is string %}
                  {{ state_attr(weather_entity, 'wind_speed') | float(0) }}
                {% else %}
                  0
                {% endif %}
          - if:
              - "{{ night_mode_on }}"
              - "{{ not storm_enabled or (wind_now | float(0)) < wind_speed_threshold }}"
              # Bei Hindernis nicht nachholen — das übernimmt dann die Freigabe
              - "{{ not block_active }}"
            then:
              - choose:
                  # Regenschutz aktiv: Lüftungsposition höchstens bis zur Regenposition
                  - conditions:
                      - "{{ rain_hold }}"
                    sequence:
                      - action: cover.set_cover_position
                        target:
                          entity_id: !input cover
                        data:
                          position: >-
                            {% set vent = tilted_position if (window_state == 'tilted' or treat_open_as_tilted)
                               else night_ventilation_position %}
                            {{ [vent | int, rain_position | int] | min }}
                      - event: s42_rollladen_status
                        event_data:
                          cover: "{{ cover_entity }}"
                          text: "Pause beendet → {{ [(tilted_position if (window_state == 'tilted' or treat_open_as_tilted) else night_ventilation_position) | int, rain_position | int] | min }} % (Nachtmodus, Regen)"
                  - conditions:
                      - "{{ window_state == 'tilted' or (treat_open_as_tilted and window_state in ['on', 'open']) }}"
                    sequence:
                      - action: cover.set_cover_position
                        target:
                          entity_id: !input cover
                        data:
                          position: !input tilted_position
                      - event: s42_rollladen_status
                        event_data:
                          cover: "{{ cover_entity }}"
                          text: "Pause beendet → {{ tilted_position | int }} % (Nachtmodus, Fenster {{ 'gekippt' if window_state == 'tilted' else 'offen, wie gekippt' }})"
                  - conditions:
                      - "{{ window_state in ['on', 'open'] }}"
                    sequence:
                      - action: cover.set_cover_position
                        target:
                          entity_id: !input cover
                        data:
                          position: !input night_ventilation_position
                      - event: s42_rollladen_status
                        event_data:
                          cover: "{{ cover_entity }}"
                          text: "Pause beendet → {{ night_ventilation_position | int }} % (Nachtmodus, Fenster offen)"
                default:
                  # Wie im Nachtmodus-Zweig: ganz schließen oder nur abwärts auf die Nachtposition
                  - choose:
                      - conditions:
                          - "{{ night_close_position | int(0) == 0 or state_attr(cover_entity, 'current_position') is none }}"
                        sequence:
                          - action: cover.close_cover
                            target:
                              entity_id: !input cover
                          - event: s42_rollladen_status
                            event_data:
                              cover: "{{ cover_entity }}"
                              text: "Pause beendet → zu (Nachtmodus)"
                      - conditions:
                          - "{{ state_attr(cover_entity, 'current_position') | int(-1) > night_close_position | int(0) }}"
                        sequence:
                          - action: cover.set_cover_position
                            target:
                              entity_id: !input cover
                            data:
                              position: !input night_close_position
                          - event: s42_rollladen_status
                            event_data:
                              cover: "{{ cover_entity }}"
                              text: "Pause beendet → {{ night_close_position | int }} % (Nachtmodus)"

      # --- NOTFALL-ÖFFNEN ---
      - conditions:
          - condition: trigger
            id: emergency_open
          # Für den Start-Trigger: nur bei tatsächlich anliegendem Alarm
          - "{{ emergency_active }}"
        sequence:
          # Fluchtweg bzw. Behangschutz geht vor allem: öffnen ohne Rücksicht auf
          # Fenster, Nachtmodus, Sturm (auch Panzer-Modus), Beschattung und Pause.
          # Im Notfall zuerst fahren, dann aufräumen
          - action: cover.open_cover
            target:
              entity_id: !input cover
          - event: s42_rollladen_status
            event_data:
              cover: "{{ cover_entity }}"
              text: "Notfall → auf"
          # Status-Helfer freigeben: Nach dem Notfall sollen Beschattung und
          # Sonnenheizen frisch bewerten, statt die Notfall-Fahrt als manuellen
          # Eingriff zu werten bzw. an einem Alt-Zustand festzuhalten
          - if:
              - "{{ shading_status_helper is string and is_state(shading_status_helper, 'on') }}"
            then:
              - action: input_boolean.turn_off
                target:
                  entity_id: "{{ shading_status_helper }}"
          - if:
              - "{{ solar_heating_status_helper is string and is_state(solar_heating_status_helper, 'on') }}"
            then:
              - action: input_boolean.turn_off
                target:
                  entity_id: "{{ solar_heating_status_helper }}"

      # --- NOTFALL BEENDET: NACHTMODUS NACHHOLEN ---
      - conditions:
          - condition: trigger
            id: emergency_ended
          # Der Trigger feuert pro Sensor: nur nachholen, wenn ALLE wieder 'off'
          # melden — ein im Alarm ausgefallener (unavailable) Sensor verhindert
          # die Nacht-Schließfahrt
          - >-
            {% set sensors = [emergency_sensors] if emergency_sensors is string else emergency_sensors %}
            {{ sensors | reject('is_state', 'off') | list | length == 0 }}
        sequence:
          # Wie beim Pause-Ende: Ein während des Notfalls verpasster Nachtmodus
          # wird nachgeholt, Sturm hat Vorrang (im Panzer-Modus wird das vom
          # Notfall verhinderte Schließen nachgeholt). Die Beschattung bewertet der
          # nächste Tick neu (Status-Helfer wurde beim Öffnen freigegeben).
          # Läuft gerade eine Pause, sortiert das Gate oben diesen Lauf aus —
          # dann holt das Pause-Ende den Nachtmodus nach
          # Regenschutz nachholen (wie beim Pause-Ende): rain_start feuert nur einmal und
          # wurde evtl. durch Sturm, Notfall oder Hindernis ausgelassen
          - if:
              - "{{ rain_hold }}"
              - "{{ not rain_storm_active or panzer_mode }}"
              - "{{ state_attr(cover_entity, 'current_position') | int(-1) > rain_position }}"
              - "{{ not block_active }}"
            then:
              - if:
                  - "{{ rain_restore and expand(rain_scene) | count == 0 }}"
                then:
                  - action: scene.create
                    data:
                      scene_id: "{{ 'rain_' ~ (cover_entity | slugify) }}"
                      snapshot_entities:
                        - "{{ cover_entity }}"
              - action: cover.set_cover_position
                target:
                  entity_id: !input cover
                data:
                  position: !input rain_position
              - event: s42_rollladen_status
                event_data:
                  cover: "{{ cover_entity }}"
                  text: "Notfall vorbei → {{ rain_position | int }} % (Regenschutz)"
              # Beschattungs-Status NICHT freigeben (sonst ginge ein Beschattungs-Ende
              # verloren, das in die Zwischenzeit fällt), sondern zum Abgleich vormerken:
              # Der nächste Tick fährt auf die Sollposition, ohne die Abweichung als
              # manuellen Eingriff zu werten — oder beendet die Beschattung regulär
              - if:
                  - "{{ shading_status_helper is string and is_state(shading_status_helper, 'on') }}"
                then:
                  - action: scene.create
                    data:
                      scene_id: "{{ 'shading_resync_' ~ (cover_entity | slugify) }}"
                      snapshot_entities:
                        - "{{ cover_entity }}"
          - variables:
              wind_now: >-
                {% if storm_wind_sensor is string %}
                  {{ states(storm_wind_sensor) | float(0) }}
                {% elif weather_entity is string %}
                  {{ state_attr(weather_entity, 'wind_speed') | float(0) }}
                {% else %}
                  0
                {% endif %}
          - choose:
              # Sturm hält an: Im Panzer-Modus das Schließen nachholen (gleiche
              # Fenster-Regel wie beim Sturmschutz) — der Sturm-Trigger feuert erst
              # beim nächsten Überschreiten der Schwelle wieder. Ohne Panzer-Modus
              # bleibt der Rollladen oben, wo der Sturmschutz ihn ohnehin haben will.
              # Bei Hindernis-Sperre holt das Ende der Sperre das Schließen nach
              - conditions:
                  - "{{ storm_enabled and (wind_now | float(0)) >= wind_speed_threshold }}"
                sequence:
                  - if:
                      - "{{ panzer_mode }}"
                      - "{{ force_storm_action or window_state in ['off', 'closed'] }}"
                      - "{{ not block_active }}"
                    then:
                      - action: cover.close_cover
                        target:
                          entity_id: !input cover
                      - event: s42_rollladen_status
                        event_data:
                          cover: "{{ cover_entity }}"
                          text: "Notfall vorbei → zu (Sturm, Panzer-Modus)"
              - conditions:
                  - "{{ night_mode_on }}"
                  # Hindernis-Sperre: nicht herunterfahren — das Ende der Sperre holt nach
                  - "{{ not block_active }}"
                sequence:
                  - choose:
                      # Regenschutz aktiv: Lüftungsposition höchstens bis zur Regenposition
                      - conditions:
                          - "{{ rain_hold }}"
                        sequence:
                          - action: cover.set_cover_position
                            target:
                              entity_id: !input cover
                            data:
                              position: >-
                                {% set vent = tilted_position if (window_state == 'tilted' or treat_open_as_tilted)
                                   else night_ventilation_position %}
                                {{ [vent | int, rain_position | int] | min }}
                          - event: s42_rollladen_status
                            event_data:
                              cover: "{{ cover_entity }}"
                              text: "Notfall vorbei → {{ [(tilted_position if (window_state == 'tilted' or treat_open_as_tilted) else night_ventilation_position) | int, rain_position | int] | min }} % (Nachtmodus, Regen)"
                      - conditions:
                          - "{{ window_state == 'tilted' or (treat_open_as_tilted and window_state in ['on', 'open']) }}"
                        sequence:
                          - action: cover.set_cover_position
                            target:
                              entity_id: !input cover
                            data:
                              position: !input tilted_position
                          - event: s42_rollladen_status
                            event_data:
                              cover: "{{ cover_entity }}"
                              text: "Notfall vorbei → {{ tilted_position | int }} % (Nachtmodus, Fenster {{ 'gekippt' if window_state == 'tilted' else 'offen, wie gekippt' }})"
                      - conditions:
                          - "{{ window_state in ['on', 'open'] }}"
                        sequence:
                          - action: cover.set_cover_position
                            target:
                              entity_id: !input cover
                            data:
                              position: !input night_ventilation_position
                          - event: s42_rollladen_status
                            event_data:
                              cover: "{{ cover_entity }}"
                              text: "Notfall vorbei → {{ night_ventilation_position | int }} % (Nachtmodus, Fenster offen)"
                    default:
                      # Wie im Nachtmodus-Zweig: ganz schließen oder nur abwärts auf die Nachtposition
                      - choose:
                          - conditions:
                              - "{{ night_close_position | int(0) == 0 or state_attr(cover_entity, 'current_position') is none }}"
                            sequence:
                              - action: cover.close_cover
                                target:
                                  entity_id: !input cover
                              - event: s42_rollladen_status
                                event_data:
                                  cover: "{{ cover_entity }}"
                                  text: "Notfall vorbei → zu (Nachtmodus)"
                          - conditions:
                              - "{{ state_attr(cover_entity, 'current_position') | int(-1) > night_close_position | int(0) }}"
                            sequence:
                              - action: cover.set_cover_position
                                target:
                                  entity_id: !input cover
                                data:
                                  position: !input night_close_position
                              - event: s42_rollladen_status
                                event_data:
                                  cover: "{{ cover_entity }}"
                                  text: "Notfall vorbei → {{ night_close_position | int }} % (Nachtmodus)"

      # --- HINDERNIS-SPERRE AUFGEHOBEN: ZUSTAND NACHHOLEN ---
      - conditions:
          - condition: trigger
            id: block_released
          # Der Trigger feuert pro Sensor — nur nachholen, wenn wirklich ALLE frei
          # sind und auch der zuletzt ausgeschaltete die Wartezeit hinter sich hat
          # (sonst erledigt das später dessen eigener Trigger)
          - "{{ not block_active }}"
        sequence:
          # Während der Sperre wurde nicht nachgeführt. In einer Pause übernimmt
          # das Pause-Ende den Abgleich und den Regenschutz.
          - if:
              - "{{ not pause_active }}"
            then:
              # Beschattungs-Status NICHT freigeben (sonst ginge ein Beschattungs-Ende
              # verloren, das in die Zwischenzeit fällt), sondern zum Abgleich vormerken:
              # Der nächste Tick fährt auf die Sollposition, ohne die Abweichung als
              # manuellen Eingriff zu werten — oder beendet die Beschattung regulär
              - if:
                  - "{{ shading_status_helper is string and is_state(shading_status_helper, 'on') }}"
                then:
                  - action: scene.create
                    data:
                      scene_id: "{{ 'shading_resync_' ~ (cover_entity | slugify) }}"
                      snapshot_entities:
                        - "{{ cover_entity }}"
              # Regenschutz nachholen (wie beim Pause-Ende): rain_start feuert nur einmal und
              # wurde evtl. durch Sturm, Notfall oder Hindernis ausgelassen
              - if:
                  - "{{ rain_hold }}"
                  - "{{ not rain_storm_active or panzer_mode }}"
                  - "{{ state_attr(cover_entity, 'current_position') | int(-1) > rain_position }}"
                  - "{{ not block_active }}"
                then:
                  - if:
                      - "{{ rain_restore and expand(rain_scene) | count == 0 }}"
                    then:
                      - action: scene.create
                        data:
                          scene_id: "{{ 'rain_' ~ (cover_entity | slugify) }}"
                          snapshot_entities:
                            - "{{ cover_entity }}"
                  - action: cover.set_cover_position
                    target:
                      entity_id: !input cover
                    data:
                      position: !input rain_position
                  - event: s42_rollladen_status
                    event_data:
                      cover: "{{ cover_entity }}"
                      text: "Hindernis frei → {{ rain_position | int }} % (Regenschutz)"
                  # Beschattungs-Status NICHT freigeben (sonst ginge ein Beschattungs-Ende
                  # verloren, das in die Zwischenzeit fällt), sondern zum Abgleich vormerken:
                  # Der nächste Tick fährt auf die Sollposition, ohne die Abweichung als
                  # manuellen Eingriff zu werten — oder beendet die Beschattung regulär
                  - if:
                      - "{{ shading_status_helper is string and is_state(shading_status_helper, 'on') }}"
                    then:
                      - action: scene.create
                        data:
                          scene_id: "{{ 'shading_resync_' ~ (cover_entity | slugify) }}"
                          snapshot_entities:
                            - "{{ cover_entity }}"
          - variables:
              wind_now: >-
                {% if storm_wind_sensor is string %}
                  {{ states(storm_wind_sensor) | float(0) }}
                {% elif weather_entity is string %}
                  {{ state_attr(weather_entity, 'wind_speed') | float(0) }}
                {% else %}
                  0
                {% endif %}
          - choose:
              # Sturm hat Vorrang vor dem Nachtmodus. Im Panzer-Modus das gesperrte
              # Schließen nachholen (gleiche Fenster-Regel wie beim Sturmschutz,
              # auch in der Pause) — der Sturm-Trigger feuert erst beim nächsten
              # Überschreiten wieder
              - conditions:
                  - "{{ storm_enabled and (wind_now | float(0)) >= wind_speed_threshold }}"
                sequence:
                  - if:
                      - "{{ panzer_mode }}"
                      - "{{ force_storm_action or window_state in ['off', 'closed'] }}"
                    then:
                      - action: cover.close_cover
                        target:
                          entity_id: !input cover
                      - event: s42_rollladen_status
                        event_data:
                          cover: "{{ cover_entity }}"
                          text: "Hindernis frei → zu (Sturm, Panzer-Modus)"
              # Verpassten Nachtmodus nachholen (fensterabhängig wie beim Pause-Ende);
              # in einer Pause holt ihn stattdessen das Pause-Ende nach
              - conditions:
                  - "{{ not pause_active }}"
                  - "{{ night_mode_on }}"
                sequence:
                  - choose:
                      # Regenschutz aktiv: Lüftungsposition höchstens bis zur Regenposition
                      - conditions:
                          - "{{ rain_hold }}"
                        sequence:
                          - action: cover.set_cover_position
                            target:
                              entity_id: !input cover
                            data:
                              position: >-
                                {% set vent = tilted_position if (window_state == 'tilted' or treat_open_as_tilted)
                                   else night_ventilation_position %}
                                {{ [vent | int, rain_position | int] | min }}
                          - event: s42_rollladen_status
                            event_data:
                              cover: "{{ cover_entity }}"
                              text: "Hindernis frei → {{ [(tilted_position if (window_state == 'tilted' or treat_open_as_tilted) else night_ventilation_position) | int, rain_position | int] | min }} % (Nachtmodus, Regen)"
                      - conditions:
                          - "{{ window_state == 'tilted' or (treat_open_as_tilted and window_state in ['on', 'open']) }}"
                        sequence:
                          - action: cover.set_cover_position
                            target:
                              entity_id: !input cover
                            data:
                              position: !input tilted_position
                          - event: s42_rollladen_status
                            event_data:
                              cover: "{{ cover_entity }}"
                              text: "Hindernis frei → {{ tilted_position | int }} % (Nachtmodus, Fenster {{ 'gekippt' if window_state == 'tilted' else 'offen, wie gekippt' }})"
                      - conditions:
                          - "{{ window_state in ['on', 'open'] }}"
                        sequence:
                          - action: cover.set_cover_position
                            target:
                              entity_id: !input cover
                            data:
                              position: !input night_ventilation_position
                          - event: s42_rollladen_status
                            event_data:
                              cover: "{{ cover_entity }}"
                              text: "Hindernis frei → {{ night_ventilation_position | int }} % (Nachtmodus, Fenster offen)"
                    default:
                      # Wie im Nachtmodus-Zweig: ganz schließen oder nur abwärts auf die Nachtposition
                      - choose:
                          - conditions:
                              - "{{ night_close_position | int(0) == 0 or state_attr(cover_entity, 'current_position') is none }}"
                            sequence:
                              - action: cover.close_cover
                                target:
                                  entity_id: !input cover
                              - event: s42_rollladen_status
                                event_data:
                                  cover: "{{ cover_entity }}"
                                  text: "Hindernis frei → zu (Nachtmodus)"
                          - conditions:
                              - "{{ state_attr(cover_entity, 'current_position') | int(-1) > night_close_position | int(0) }}"
                            sequence:
                              - action: cover.set_cover_position
                                target:
                                  entity_id: !input cover
                                data:
                                  position: !input night_close_position
                              - event: s42_rollladen_status
                                event_data:
                                  cover: "{{ cover_entity }}"
                                  text: "Hindernis frei → {{ night_close_position | int }} % (Nachtmodus)"

      # --- NACH HA-NEUSTART: VERPASSTES NACHHOLEN ---
      # Fällt die Morgens-Uhrzeit in einen Neustart, feuert ihr Trigger nicht; ein
      # kurz vor dem Herunterfahren eingeschalteter Nachtmodus kann seinen Fahrbefehl
      # verloren haben — dieser Zweig bewertet einmal nach dem Start neu
      - conditions:
          - condition: trigger
            id: ha_started
        sequence:
          # Erst warten, bis Integrationen, Rollladen und Sensoren verfügbar sind —
          # danach zählt nur der AKTUELLE Zustand, nicht der beim Start
          - delay:
              seconds: 60
          - variables:
              pause_now: >-
                {% set helpers = [pause_boolean] if pause_boolean is string else pause_boolean %}
                {% set pausing = 'on' if pause_mode == 'on_pauses' else 'off' %}
                {% set found = expand(helpers) | list %}
                {{ helpers | length > 0
                   and found | length > 0
                   and found | rejectattr('state', 'eq', pausing) | list | length == 0 }}
              wind_now: >-
                {% if storm_wind_sensor is string %}
                  {{ states(storm_wind_sensor) | float(0) }}
                {% elif weather_entity is string %}
                  {{ state_attr(weather_entity, 'wind_speed') | float(0) }}
                {% else %}
                  0
                {% endif %}
              # Sekunden seit der heutigen Morgens-Uhrzeit (negativ = steht noch bevor).
              # Ohne Morgens-Öffnen bzw. ohne Uhrzeit-Helfer (nur Uhrzeit, ohne Datum)
              # gilt -1: nichts nachzuholen, und kein Morgens-Trigger hat geöffnet.
              # Morgens nach Sonnenstand: Wann die Sonne die Höhe überschritten hat,
              # ist unbekannt — noch nicht fällig (oder vor "frühestens") = -1, fällig
              # vor "spätestens" = 0 (gerade eben), danach gezählt ab "spätestens"
              # (bzw. ab "frühestens", falls das nicht davor liegt)
              morning_since: >-
                {% set e_ok = morning_time is string and has_value(morning_time)
                   and state_attr(morning_time, 'has_time')
                   and not state_attr(morning_time, 'has_date') %}
                {% if morning_enabled and morning_sun_enabled %}
                  {% set l = today_at(morning_latest) %}
                  {% set e = today_at(states(morning_time)) if e_ok else none %}
                  {% set ref = e if e is not none and e >= l else l %}
                  {% if not morning_open_due or (e is not none and now() < e) %}
                    -1
                  {% else %}
                    {{ [(now() - ref).total_seconds(), 0] | max }}
                  {% endif %}
                {% elif morning_enabled and e_ok %}
                  {{ (now() - today_at(states(morning_time))).total_seconds() }}
                {% else %}
                  -1
                {% endif %}
              # Fenster, Notfall und Hindernis-Sperre jetzt lesen (Laufbeginn ist 60 s her)
              win_now: "{{ (states(window_sensor) | lower) if window_sensor is string else 'closed' }}"
              # Regen bei geschütztem Fenster — ohne die Regen-Verzögerung, denn der
              # Neustart setzt deren Zeitstempel zurück (rain_start feuert danach nicht)
              rain_hold_restart: >-
                {{ rain_sensor is string and is_state(rain_sensor, 'on')
                   and (win_now == 'tilted'
                        or (win_now in ['on', 'open'] and (treat_open_as_tilted or rain_include_open))) }}
              # Lüftungspositionen, bei Regen höchstens die Regenposition
              vent_tilt: >-
                {{ [tilted_position | int, rain_position | int] | min if rain_hold_restart
                   else tilted_position | int }}
              vent_open: >-
                {{ [night_ventilation_position | int, rain_position | int] | min if rain_hold_restart
                   else night_ventilation_position | int }}
              emergency_now: >-
                {% set sensors = [emergency_sensors] if emergency_sensors is string else emergency_sensors %}
                {{ sensors | select('is_state', 'on') | list | length > 0 }}
              block_now: >-
                {% set sensors = [block_sensors] if block_sensors is string else block_sensors %}
                {% set ns = namespace(blocked = false) %}
                {% for s in sensors %}
                  {% if states(s) != 'off'
                        or as_timestamp(now()) - as_timestamp(states[s].last_changed) < (block_release_delay | float(0)) * 60 - 2 %}
                    {% set ns.blocked = true %}
                  {% endif %}
                {% endfor %}
                {{ ns.blocked }}
              # Frostschutz: auch das nachgeholte Öffnen ist eine Öffnungsfahrt
              morning_target: >-
                {{ [morning_position | int, frost_max_position | int] | min if frost_active
                   else morning_position | int }}
          # Pause, Sturm und Notfall nach dem Warten erneut prüfen — alle verhindern jedes Nachholen
          - condition: "{{ not pause_now }}"
          - condition: "{{ not emergency_now }}"
          - condition: "{{ not storm_enabled or (wind_now | float(0)) < wind_speed_threshold }}"
          # Regenschutz wiederherstellen (wie beim Pause-Ende)
          - if:
              - "{{ rain_hold_restart }}"
              - "{{ state_attr(cover_entity, 'current_position') | int(-1) > rain_position }}"
              - "{{ not block_now }}"
            then:
              - if:
                  - "{{ rain_restore and expand(rain_scene) | count == 0 }}"
                then:
                  - action: scene.create
                    data:
                      scene_id: "{{ 'rain_' ~ (cover_entity | slugify) }}"
                      snapshot_entities:
                        - "{{ cover_entity }}"
              - action: cover.set_cover_position
                target:
                  entity_id: !input cover
                data:
                  position: !input rain_position
              - event: s42_rollladen_status
                event_data:
                  cover: "{{ cover_entity }}"
                  text: "Nach Neustart → {{ rain_position | int }} % (Regenschutz)"
          - choose:
              # Morgens-Uhrzeit höchstens 2 Stunden her: Morgens-Öffnen nachholen —
              # auch bei noch aktivem Nachtmodus, genau wie der reguläre Morgens-Trigger.
              # Später nicht mehr: Wer den Rollladen Stunden danach noch zu hat, will
              # das vermutlich so (Mittagsschlaf, Hitze) — ein Öffnen am Nachmittag
              # wäre kein Nachholen, sondern ein Fehler
              - conditions:
                  - "{{ 0 <= morning_since | float(-1) <= 7200 }}"
                sequence:
                  # Führen Beschattung oder Sonnenheizen den Rollladen gerade (Status-
                  # Helfer an), nichts anfassen: sonst fährt er hoch und beim nächsten
                  # Tick wieder runter, bzw. ein manuelles Schließen würde übergangen
                  - condition: >-
                      {{ not (shading_status_helper is string and is_state(shading_status_helper, 'on'))
                         and not (solar_heating_status_helper is string and is_state(solar_heating_status_helper, 'on')) }}
                  # Regenschutz aktiv: nicht öffnen, sondern wie im Morgens-Zweig die
                  # Morgen-Position fürs Regenende vormerken
                  - if:
                      - "{{ rain_hold_restart }}"
                    then:
                      - if:
                          - "{{ rain_restore }}"
                          - "{{ state_attr(cover_entity, 'current_position') | int(101) < morning_target }}"
                        then:
                          - action: scene.create
                            data:
                              scene_id: "{{ 'rain_' ~ (cover_entity | slugify) }}"
                              entities: "{{ {cover_entity: {'state': 'open', 'current_position': morning_target | int}} }}"
                      - event: s42_rollladen_status
                        event_data:
                          cover: "{{ cover_entity }}"
                          text: "Nach Neustart: Morgens öffnen übersprungen (Regenschutz)"
                      - stop: "Regenschutz aktiv — Morgens-Öffnen erst nach dem Regen"
                  - choose:
                      - conditions:
                          - "{{ state_attr(cover_entity, 'current_position') is not none }}"
                          - "{{ state_attr(cover_entity, 'current_position') | int(101) < morning_target }}"
                        sequence:
                          - action: cover.set_cover_position
                            target:
                              entity_id: !input cover
                            data:
                              position: "{{ morning_target }}"
                          - event: s42_rollladen_status
                            event_data:
                              cover: "{{ cover_entity }}"
                              text: "Nach Neustart → {{ morning_target }} % (Morgens nachgeholt){{ ' (Frost-Grenze)' if morning_target | int < morning_position | int else '' }}"
                      # Cover ohne Positions-Attribut: nur öffnen, wenn er als
                      # geschlossen gemeldet wird (unavailable/unknown zählt nicht)
                      - conditions:
                          - "{{ state_attr(cover_entity, 'current_position') is none }}"
                          - "{{ is_state(cover_entity, 'closed') }}"
                        sequence:
                          - action: cover.open_cover
                            target:
                              entity_id: !input cover
                          - event: s42_rollladen_status
                            event_data:
                              cover: "{{ cover_entity }}"
                              text: "Nach Neustart → auf (Morgens nachgeholt)"
              # Aktiven Nachtmodus wiederherstellen — nur, solange wirklich Nacht ist:
              # Sonne unter dem Horizont, und es ist Abend (Sonne nicht steigend) oder
              # die Morgens-Uhrzeit steht noch bevor. Danach hat der Morgens-Trigger
              # (der den Nachtmodus nicht beachtet) meist schon geöffnet; ein noch
              # aktiver Helfer hieße dann nicht "zu". Ohne Fensterkontakt nichts bewegen
              - conditions:
                  - "{{ night_mode_on }}"
                  - >-
                    {{ is_state('sun.sun', 'below_horizon')
                       and (not state_attr('sun.sun', 'rising') or morning_since | float(-1) < 0) }}
                  - "{{ window_sensor is not string or has_value(window_sensor) }}"
                  # Hindernis-Sperre: das Ende der Sperre holt den Nachtmodus nach
                  - "{{ not block_now }}"
                sequence:
                  # Status-Helfer wie beim Einschalten des Nachtmodus zurücksetzen:
                  # Die Nacht beendet Beschattung und Sonnenheizen
                  - if:
                      - "{{ shading_status_helper is string and is_state(shading_status_helper, 'on') }}"
                    then:
                      - action: input_boolean.turn_off
                        target:
                          entity_id: "{{ shading_status_helper }}"
                  - if:
                      - "{{ solar_heating_status_helper is string and is_state(solar_heating_status_helper, 'on') }}"
                    then:
                      - action: input_boolean.turn_off
                        target:
                          entity_id: "{{ solar_heating_status_helper }}"
                  # Bei gekipptem/offenem Fenster nur HOCHfahren, nie absenken: Der
                  # Neustart kommt zu einem beliebigen Zeitpunkt — steht gerade jemand
                  # auf dem Balkon, würde er sonst ausgesperrt
                  - choose:
                      - conditions:
                          - "{{ win_now == 'tilted' or (treat_open_as_tilted and win_now in ['on', 'open']) }}"
                          - "{{ state_attr(cover_entity, 'current_position') | int(101) < vent_tilt | int }}"
                        sequence:
                          - action: cover.set_cover_position
                            target:
                              entity_id: !input cover
                            data:
                              position: "{{ vent_tilt }}"
                          - event: s42_rollladen_status
                            event_data:
                              cover: "{{ cover_entity }}"
                              text: "Nach Neustart → {{ vent_tilt }} % (Nachtmodus, Fenster {{ 'gekippt' if win_now == 'tilted' else 'offen, wie gekippt' }})"
                      - conditions:
                          - "{{ win_now in ['on', 'open'] }}"
                          - "{{ not treat_open_as_tilted }}"
                          - "{{ state_attr(cover_entity, 'current_position') | int(101) < vent_open | int }}"
                        sequence:
                          - action: cover.set_cover_position
                            target:
                              entity_id: !input cover
                            data:
                              position: "{{ vent_open }}"
                          - event: s42_rollladen_status
                            event_data:
                              cover: "{{ cover_entity }}"
                              text: "Nach Neustart → {{ vent_open }} % (Nachtmodus, Fenster offen)"
                      # Fenster zu: wie beim Einschalten des Nachtmodus ganz schließen
                      # oder nur abwärts auf die Nachtposition
                      - conditions:
                          - "{{ win_now in ['off', 'closed'] }}"
                        sequence:
                          - choose:
                              - conditions:
                                  - "{{ night_close_position | int(0) == 0 or state_attr(cover_entity, 'current_position') is none }}"
                                sequence:
                                  - action: cover.close_cover
                                    target:
                                      entity_id: !input cover
                                  - event: s42_rollladen_status
                                    event_data:
                                      cover: "{{ cover_entity }}"
                                      text: "Nach Neustart → zu (Nachtmodus)"
                              - conditions:
                                  - "{{ state_attr(cover_entity, 'current_position') | int(-1) > night_close_position | int(0) }}"
                                sequence:
                                  - action: cover.set_cover_position
                                    target:
                                      entity_id: !input cover
                                    data:
                                      position: !input night_close_position
                                  - event: s42_rollladen_status
                                    event_data:
                                      cover: "{{ cover_entity }}"
                                      text: "Nach Neustart → {{ night_close_position | int }} % (Nachtmodus)"

      # --- ABWESENHEIT BEGINNT ---
      - conditions:
          - condition: trigger
            id: away_start
          - "{{ away_close_enabled or away_shading_strict }}"
          # Der Template-Trigger war für die Wartezeit wahr — trotzdem neu prüfen
          - "{{ presence_all_away }}"
        sequence:
          - variables:
              wind_now: >-
                {% if storm_wind_sensor is string %}
                  {{ states(storm_wind_sensor) | float(0) }}
                {% elif weather_entity is string %}
                  {{ state_attr(weather_entity, 'wind_speed') | float(0) }}
                {% else %}
                  0
                {% endif %}
              # Schließen nur bei sicher geschlossenem Fenster (Aussperr-Schutz;
              # auch unavailable blockiert), ohne Sturm (Sturmschutz hat Vorrang)
              # und ohne Hindernis-Sperre
              close_ok: >-
                {{ away_close_enabled
                   and (not storm_enabled or (wind_now | float(0)) < wind_speed_threshold)
                   and window_state in ['off', 'closed']
                   and not block_active }}
          # Abwesenheit merken — Grundlage für Wiederöffnen und strenge Beschattung.
          # Vor dem Status-Reset, damit ein gleichzeitiger Tick nicht noch mit der
          # normalen Tiefe neu startet; fehlertolerant, das Schließen geht vor
          - action: scene.create
            continue_on_error: true
            data:
              scene_id: "{{ 'away_' ~ (cover_entity | slugify) }}"
              snapshot_entities:
                - "{{ cover_entity }}"
          # Beschattungs-Status freigeben: Das Schließen ist eine Fremdbewegung, und
          # die strenge Beschattung verschiebt die Sollposition sprunghaft — beides
          # darf der nächste Tick nicht als manuellen Eingriff werten
          - if:
              - "{{ close_ok or away_shading_strict }}"
              - "{{ shading_status_helper is string and is_state(shading_status_helper, 'on') }}"
            then:
              - action: input_boolean.turn_off
                target:
                  entity_id: "{{ shading_status_helper }}"
          - if:
              - "{{ close_ok }}"
            then:
              # Sonnenheizen-Status zurücksetzen wie beim Nachtmodus — solange der
              # Rollladen bei Abwesenheit unten steht, pausiert Sonnenheizen ohnehin
              - if:
                  - "{{ solar_heating_status_helper is string and is_state(solar_heating_status_helper, 'on') }}"
                then:
                  - action: input_boolean.turn_off
                    target:
                      entity_id: "{{ solar_heating_status_helper }}"
              - choose:
                  # Nur abwärts fahren
                  - conditions:
                      - "{{ state_attr(cover_entity, 'current_position') is not none }}"
                      - "{{ state_attr(cover_entity, 'current_position') | int(-1) > away_close_position }}"
                    sequence:
                      - action: cover.set_cover_position
                        target:
                          entity_id: !input cover
                        data:
                          position: !input away_close_position
                      - event: s42_rollladen_status
                        event_data:
                          cover: "{{ cover_entity }}"
                          text: "Abwesenheit → {{ away_close_position | int }} %"
                  # Fallback für Cover ohne Positions-Attribut: ganz schließen
                  - conditions:
                      - "{{ state_attr(cover_entity, 'current_position') is none }}"
                      - "{{ is_state(cover_entity, 'open') }}"
                    sequence:
                      - action: cover.close_cover
                        target:
                          entity_id: !input cover
                      - event: s42_rollladen_status
                        event_data:
                          cover: "{{ cover_entity }}"
                          text: "Abwesenheit → zu"

      # --- ABWESENHEIT ENDET: JEMAND IST ZURÜCK ---
      - conditions:
          - condition: trigger
            id: away_return
          - "{{ presence_anyone_home }}"
          # Nur wenn vorher wirklich eine Abwesenheit begonnen hatte: Kurzes
          # Weg-und-zurück (unter der Wartezeit), Tracker-Aussetzer und Neustarts
          # bewegen so nichts
          - "{{ expand(away_marker) | count > 0 }}"
        sequence:
          # Merker zuerst entfernen — auch während einer Pause, sonst gälte ein
          # späteres kurzes Weg-und-zurück als Heimkommen
          - action: scene.delete
            continue_on_error: true
            target:
              entity_id: "{{ away_marker }}"
          # Fahren und Status-Änderungen nur ohne Pause
          - condition: "{{ not pause_active }}"
          - variables:
              wind_now: >-
                {% if storm_wind_sensor is string %}
                  {{ states(storm_wind_sensor) | float(0) }}
                {% elif weather_entity is string %}
                  {{ state_attr(weather_entity, 'wind_speed') | float(0) }}
                {% else %}
                  0
                {% endif %}
              # Rollladen wurde bei Abwesenheit unten gehalten: steht noch auf/unter
              # der Abwesenheits-Position oder fährt gerade dorthin
              was_held: >-
                {% set pos = state_attr(cover_entity, 'current_position') %}
                {{ away_close_enabled
                   and ((pos is not none and pos | int(101) <= away_close_position)
                        or (pos is none and is_state(cover_entity, 'closed'))
                        or is_state(cover_entity, 'closing')) }}
              # Wieder öffnen nur, wenn es weder Nacht noch dunkel ist (beim
              # Heimkommen soll Tageslicht rein, abends bleibt er zu) und kein
              # Sturm herrscht
              # Frostschutz: das Wiederöffnen ist eine normale Öffnungsfahrt
              return_target: >-
                {{ [morning_position | int, frost_max_position | int] | min if frost_active
                   else morning_position | int }}
              open_ok: >-
                {{ was_held
                   and not night_mode_on
                   and not is_state('sun.sun', 'below_horizon')
                   and (not storm_enabled or (wind_now | float(0)) < wind_speed_threshold) }}
          # Beschattungs-Status freigeben: Wiederöffnen ist eine Fremdbewegung, nach
          # strenger Beschattung gilt wieder die normale Sollposition, und ein
          # während des Unten-Haltens aufgeschobenes Beschattungs-Ende darf nicht
          # nachträglich (womöglich im Dunkeln) noch öffnen
          - if:
              - "{{ was_held or away_shading_strict }}"
              - "{{ shading_status_helper is string and is_state(shading_status_helper, 'on') }}"
            then:
              - action: input_boolean.turn_off
                target:
                  entity_id: "{{ shading_status_helper }}"
          - if:
              - "{{ open_ok }}"
            then:
              - choose:
                  # Nur aufwärts fahren — oder eine noch laufende Abwärtsfahrt abfangen
                  - conditions:
                      - "{{ state_attr(cover_entity, 'current_position') is not none }}"
                      - >-
                        {{ state_attr(cover_entity, 'current_position') | int(101) < return_target
                           or is_state(cover_entity, 'closing') }}
                    sequence:
                      - action: cover.set_cover_position
                        target:
                          entity_id: !input cover
                        data:
                          position: "{{ return_target }}"
                      - event: s42_rollladen_status
                        event_data:
                          cover: "{{ cover_entity }}"
                          text: "Heimkommen → {{ return_target }} %"
                  # Fallback für Cover ohne Positions-Attribut
                  - conditions:
                      - "{{ state_attr(cover_entity, 'current_position') is none }}"
                    sequence:
                      - action: cover.open_cover
                        target:
                          entity_id: !input cover
                      - event: s42_rollladen_status
                        event_data:
                          cover: "{{ cover_entity }}"
                          text: "Heimkommen → auf"

      # --- SONNENSCHUTZ ---
      - conditions:
          - condition: trigger
            id:
              - shading_tick
              - shading_start_delayed
              - shading_end_delayed
        sequence:
          # Fehlkonfiguration laut machen: Blueprints kennen keine bedingten
          # Pflichtfelder — ohne diesen Hinweis bliebe ein aktivierter Sonnenschutz
          # ohne Status-Helfer einfach still wirkungslos
          - if:
              - "{{ shading_status_helper is not string }}"
            then:
              - action: persistent_notification.create
                data:
                  notification_id: "rollladen_helfer_fehlt_{{ cover_entity | slugify }}"
                  title: "Rollladensteuerung: Status-Helfer fehlt"
                  message: >-
                    Der Sonnenschutz für "{{ state_attr(cover_entity, 'friendly_name') or cover_entity }}"
                    ist aktiviert, aber es ist kein Status-Helfer (input_boolean)
                    ausgewählt — die Beschattung bleibt dadurch wirkungslos.
                    Bitte in der Automation einen Helfer auswählen oder den
                    Sonnenschutz deaktivieren.
              - stop: "Sonnenschutz aktiviert, aber kein Status-Helfer konfiguriert"
          # Kern der Start-/Ende-Logik (Sonne, Temperatur, Wetterlage) ist in den
          # Verzögerungs-Triggern (shading_start_delayed, shading_end_delayed)
          # dupliziert — Änderungen hier dort nachziehen!
          - variables:
              sun_elevation: "{{ state_attr('sun.sun', 'elevation') | float(0) }}"
              sun_azimuth: "{{ state_attr('sun.sun', 'azimuth') | float(0) }}"
              az_diff: "{{ ((sun_azimuth - window_azimuth + 180) % 360) - 180 }}"
              # Bewusst ohne Hysterese an der Höchstgrenze: Die Sonnenhöhe ist berechnet
              # (kein Messrauschen) und steigt bis mittags stetig, danach fällt sie —
              # jede Grenze wird pro Tag höchstens einmal je Richtung überschritten
              sun_in_window: >-
                {{ sun_elevation >= shading_min_elevation
                   and sun_elevation <= shading_max_elevation
                   and az_diff >= (0 - shading_fov_left)
                   and az_diff <= shading_fov_right }}
              outdoor_temp: >-
                {% if shading_temp_sensor is string %}
                  {{ states(shading_temp_sensor) | float(-99) }}
                {% elif weather_entity is string %}
                  {{ state_attr(weather_entity, 'temperature') | float(-99) }}
                {% else %}
                  -99
                {% endif %}
              wind_now: >-
                {% if storm_wind_sensor is string %}
                  {{ states(storm_wind_sensor) | float(0) }}
                {% elif weather_entity is string %}
                  {{ state_attr(weather_entity, 'wind_speed') | float(0) }}
                {% else %}
                  0
                {% endif %}
              storm_ok: "{{ not storm_enabled or (wind_now | float(0)) < wind_speed_threshold }}"
              # Ist die Temperaturquelle gerade verfügbar? Ein kurzer unavailable-Blip
              # (Integrations-Reload, Funk-Aussetzer) darf eine laufende Beschattung
              # nicht beenden — unavailable heißt "Zustand halten", nicht "abbrechen"
              temp_available: >-
                {% if shading_temp_sensor is string %}
                  {{ has_value(shading_temp_sensor) }}
                {% elif weather_entity is string %}
                  {{ has_value(weather_entity) and state_attr(weather_entity, 'temperature') is not none }}
                {% else %}
                  false
                {% endif %}
              # Um die Hysterese abgekühlt (nur mit verfügbarem Temperaturwert)
              temp_cooled: >-
                {{ temp_available and outdoor_temp <= (shading_temp_threshold - shading_temp_hysteresis) }}
              # Wetterlagen-Filter: ohne Auswahl (leer) immer erlaubt (Altverhalten,
              # rein auf Sonnenstand/Temperatur basierend); ohne gesetzte Wetter-Entität
              # oder bei unavailable/unknown ebenfalls erlaubt (Filter kann nicht
              # ausgewertet werden und soll die Beschattung dann nicht lahmlegen)
              weather_ok: >-
                {{ shading_weather_states | length == 0
                   or not (weather_entity is string)
                   or states(weather_entity) in ['unknown', 'unavailable']
                   or states(weather_entity) in shading_weather_states }}
              # Beenden nur bei STABIL schlechter Wetterlage (>= 10 Minuten unverändert):
              # Wetterzustände flattern gern (bewölkt <-> teilweise bewölkt) — ohne diese
              # Trägheit würde der Rollladen im 5-Minuten-Takt voll auf- und zufahren.
              # Bewusster Trade-off: Flattert das Wetter zwischen zwei NICHT erlaubten
              # Lagen (z.B. rainy <-> pouring), bleibt last_changed jung und dieses
              # Ende greift nicht — dann beenden Sonnenstand/Temperatur die Beschattung
              weather_bad_stable: >-
                {{ shading_weather_states | length > 0
                   and weather_entity is string
                   and states(weather_entity) not in ['unknown', 'unavailable']
                   and states(weather_entity) not in shading_weather_states
                   and (as_timestamp(now()) - as_timestamp(states[weather_entity].last_changed)) > 600 }}
              # Externe Freigabe: ohne Freigabe-Helfer immer erlaubt (Altverhalten).
              # Starten/Nachführen nur bei 'on', Beenden nur bei 'off' — wie bei der
              # Temperaturquelle heißt unavailable/unknown "Zustand halten"
              enable_ok: >-
                {{ shading_enable_entity is not string
                   or is_state(shading_enable_entity, 'on') }}
              enable_off: >-
                {{ shading_enable_entity is string
                   and is_state(shading_enable_entity, 'off') }}
              # Zeitfenster: "ab" == "bis" (Standard 00:00/00:00) = keine Einschränkung,
              # "ab" > "bis" = über Mitternacht. Die "bis"-Uhrzeit zählt nicht mehr dazu
              shading_time_ok: >-
                {% set t_from = today_at(shading_time_from) %}
                {% set t_until = today_at(shading_time_until) %}
                {% set t_now = now() %}
                {{ t_from == t_until
                   or (t_from < t_until and t_from <= t_now and t_now < t_until)
                   or (t_from > t_until and (t_now >= t_from or t_now < t_until)) }}
              # Strengere Beschattung, solange eine Abwesenheit läuft (Merker gesetzt
              # und niemand zurück); nie lockerer als die normale Einfall-Tiefe
              shading_depth_now: >-
                {{ [away_shading_depth, shading_depth] | min
                   if away_shading_strict and not presence_anyone_home and expand(away_marker) | count > 0
                   else shading_depth }}
              # Wetterlage nicht erlaubt, ohne 10-Minuten-Trägheit: gilt bei gesetzter
              # Ausschaltverzögerung (Trigger UND Tick) — dort sorgt die Verzögerung
              # (for:) für die Stabilität
              weather_bad: >-
                {{ shading_weather_states | length > 0
                   and weather_entity is string
                   and states(weather_entity) not in ['unknown', 'unavailable']
                   and states(weather_entity) not in shading_weather_states }}
              # Kern der Start- bzw. Ende-Bedingung — genau das prüfen die
              # Verzögerungs-Trigger
              start_core: >-
                {{ sun_in_window and (outdoor_temp >= shading_temp_threshold or glare_enabled) and weather_ok }}
              end_core: >-
                {{ (not sun_in_window)
                   or (not glare_enabled and temp_available and outdoor_temp < shading_temp_threshold
                       and outdoor_temp <= (shading_temp_threshold - shading_temp_hysteresis))
                   or weather_bad }}
              # Ein-/Ausschaltverzögerung: Ist sie gesetzt, darf nur starten bzw. beenden,
              # wessen Kern-Bedingung die Verzögerung lang ununterbrochen erfüllt war —
              # gerade gefeuerter Verzögerungs-Trigger oder Merker von einem früheren,
              # der da noch nicht durfte. Bei 0 bleibt alles beim Tick.
              # Ausnahme nach einem (Neu-)Start der Automation (HA-Neustart, Neuladen,
              # Wiedereinschalten — this.last_changed): Ein Template-Trigger, dessen
              # Bedingung schon beim Start erfüllt ist, feuert erst nach dem nächsten
              # Wechsel, und die Merker sind nach einem Neustart weg. Diesen Fall fängt
              # der Tick nach Ablauf der Verzögerung ab Start auf (10-Minuten-Fenster =
              # sicher ein Tick)
              minutes_since_setup: >-
                {{ (as_timestamp(now()) - as_timestamp(this.last_changed, 0)) / 60 }}
              start_debounced: >-
                {% set d = shading_start_delay | int(0) %}
                {{ d <= 0
                   or (start_core
                       and (trigger.id == 'shading_start_delayed'
                            or expand(shading_start_marker) | count > 0
                            or (minutes_since_setup >= d and minutes_since_setup < d + 10))) }}
              end_debounced: >-
                {% set d = shading_end_delay | int(0) %}
                {{ d <= 0
                   or (end_core
                       and is_state(shading_status_helper, 'on')
                       and (trigger.id == 'shading_end_delayed'
                            or expand(shading_end_marker) | count > 0
                            or (minutes_since_setup >= d and minutes_since_setup < d + 10))) }}
          # Merker der Verzögerungen pflegen: anlegen, sobald die Kern-Bedingung die
          # Verzögerung lang erfüllt war; verwerfen, sobald sie nicht mehr gilt. So
          # geht ein Start bzw. Ende nicht verloren, wenn im entscheidenden Moment
          # etwas anderes dagegen sprach — der nächste Tick danach holt es nach.
          # Kurze Unterbrechungen zwischen zwei Ticks bemerkt nur der Trigger selbst
          - if:
              - "{{ shading_start_delay | int(0) > 0 }}"
            then:
              - if:
                  - "{{ start_debounced }}"
                then:
                  - if:
                      - "{{ expand(shading_start_marker) | count == 0 }}"
                    then:
                      - action: scene.create
                        data:
                          scene_id: "{{ 'shading_start_' ~ (cover_entity | slugify) }}"
                          snapshot_entities:
                            - "{{ cover_entity }}"
                else:
                  - if:
                      - "{{ expand(shading_start_marker) | count > 0 }}"
                    then:
                      - action: scene.delete
                        continue_on_error: true
                        target:
                          entity_id: "{{ shading_start_marker }}"
          - if:
              - "{{ shading_end_delay | int(0) > 0 }}"
            then:
              - if:
                  - "{{ end_debounced }}"
                then:
                  - if:
                      - "{{ expand(shading_end_marker) | count == 0 }}"
                    then:
                      - action: scene.create
                        data:
                          scene_id: "{{ 'shading_end_' ~ (cover_entity | slugify) }}"
                          snapshot_entities:
                            - "{{ cover_entity }}"
                else:
                  - if:
                      - "{{ expand(shading_end_marker) | count > 0 }}"
                    then:
                      - action: scene.delete
                        continue_on_error: true
                        target:
                          entity_id: "{{ shading_end_marker }}"
          # Die Verzögerungs-Trigger kommen auch während Pause und Notfall durch,
          # damit ihre Merker stimmen — bewegt wird dann nichts
          - condition: "{{ not pause_active and not emergency_active }}"
          # Bei Abwesenheit unten gehalten: weder beschatten noch (Ende) öffnen
          - condition: "{{ not away_hold }}"
          # Regenschutz aktiv: Beschattung ruht — sie würde den Rollladen sonst über
          # die Regenposition fahren (Sonnenstand im Sichtfeld heißt nicht Sonnenschein)
          - condition: "{{ not rain_hold }}"
          - choose:
              # Beschattung starten / der Sonne nachführen. Mit Blendschutz auch
              # unterhalb der Temperatur-Schwelle (Ziel dann: Blendschutz-Ziel)
              - conditions:
                  # Starten nur mit erfüllter Einschaltverzögerung (s.o.), Nachführen im Tick
                  - >-
                    {{ start_debounced
                       or (trigger.id == 'shading_tick' and is_state(shading_status_helper, 'on')) }}
                  - "{{ sun_in_window and (outdoor_temp >= shading_temp_threshold or glare_enabled) }}"
                  - "{{ storm_ok }}"
                  - "{{ weather_ok }}"
                  - "{{ enable_ok }}"
                  - "{{ shading_time_ok }}"
                  - "{{ not night_mode_on }}"
                  - "{{ force_shading or treat_open_as_tilted or window_state not in ['on', 'open'] }}"
                  # Hindernis-Sperre: weder beginnen noch nachführen (Beenden bleibt erlaubt)
                  - "{{ not block_active }}"
                sequence:
                  - variables:
                      # Höhe (über dem Boden), auf der ein Sonnenstrahl die Fensterebene
                      # durchqueren darf, damit er maximal shading_depth_now tief in den Raum fällt
                      ray_height: >-
                        {{ shading_depth_now * tan(sun_elevation * pi / 180)
                           / ([cos(az_diff * pi / 180), 0.087] | max) }}
                      # Hitzeschutz-Ziel: Position laut Geometrie
                      heat_target: >-
                        {% set glass_free = [[(ray_height - window_sill_height) / window_height * 100, 0] | max, 100] | min %}
                        {% set a = glass_bottom_position | int(0) %}
                        {% set b = glass_top_position | int(100) %}
                        {% if b <= a %}{% set a = 0 %}{% set b = 100 %}{% endif %}
                        {% set p = (a + glass_free * (b - a) / 100) | round(0) | int %}
                        {% set p = [p, shading_min_position | int] | max %}
                        {% set p = [p, 100] | min %}
                        {% if window_state in ['tilted', 'on', 'open'] %}
                          {{ [p, tilted_position | int] | max }}
                        {% else %}
                          {{ p }}
                        {% endif %}
                      # Blendschutz-Ziel: "leichter" als der Hitzeschutz, nie tiefer als
                      # die Blendschutz-Position. Ohne Blendschutz = Hitzeschutz-Ziel
                      glare_target: >-
                        {% if glare_enabled %}
                          {{ [heat_target | int, glare_position | int] | max }}
                        {% else %}
                          {{ heat_target | int }}
                        {% endif %}
                      current_position: "{{ state_attr(cover_entity, 'current_position') | int(-1) }}"
                  - condition: "{{ current_position >= 0 }}"
                  - variables:
                      # Gültiges Ziel: warm = Hitzeschutz, abgekühlt = Blendschutz. Im
                      # Hysterese-Band oder bei kurz fehlendem Temperaturwert behält eine
                      # laufende Episode das Ziel, an dem der Rollladen steht (kein Pendeln).
                      # Ohne Temperaturquelle nie Hitzeschutz. Ohne Blendschutz ist hier
                      # immer warm = Hitzeschutz-Ziel. Frostschutz: Blendschutz läuft auch
                      # bei Frost — dann höchstens bis zur Frost-Position
                      target_position: >-
                        {% set dev_heat = (current_position - heat_target | int) | abs %}
                        {% set dev_glare = (current_position - glare_target | int) | abs %}
                        {% if outdoor_temp >= shading_temp_threshold %}
                          {% set t = heat_target | int %}
                        {% elif is_state(shading_status_helper, 'on') and not temp_cooled
                                and (shading_temp_sensor is string or weather_entity is string)
                                and dev_heat <= dev_glare %}
                          {% set t = heat_target | int %}
                        {% else %}
                          {% set t = glare_target | int %}
                        {% endif %}
                        {{ [t, frost_max_position | int] | min if frost_active else t }}
                      deviation: "{{ (current_position - target_position | int) | abs }}"
                      # Nach Pause, Hindernis oder Regen einmal auf die Sollposition
                      # abgleichen (siehe shading_resync_marker)
                      shading_resync: "{{ expand(shading_resync_marker) | count > 0 }}"
                      # Manueller Eingriff abgelaufen: Dauer gesetzt und der Rollladen
                      # steht seit mindestens so vielen Minuten still. Bewusst
                      # last_updated statt last_changed — viele Cover melden eine
                      # Teilfahrt nur über das Attribut current_position, der State
                      # bleibt 'open' und last_changed damit alt (Wartezeit wäre sofort um)
                      override_expired: >-
                        {{ shading_override_duration | int(0) > 0
                           and (as_timestamp(now()) - as_timestamp(states[cover_entity].last_updated))
                               >= shading_override_duration | int(0) * 60 }}
                      # Motorschonung: Zeit seit der letzten Bewegung über last_updated —
                      # Teilfahrten ändern oft nur current_position, nicht den State.
                      # 60 s Toleranz, weil eigene Fahrten erst Sekunden nach dem Tick
                      # enden (sonst würden aus 15 Minuten effektiv 20)
                      move_interval_ok: >-
                        {% set s = states[cover_entity] %}
                        {{ (min_move_interval | float(0)) <= 0
                           or s is none
                           or (as_timestamp(now()) - as_timestamp(s.last_updated)) >= (min_move_interval | float(0)) * 60 - 60 }}
                      # Zielwechsel (Hitze- <-> Blendschutz) statt Handeingriff: Der Rollladen
                      # steht noch genau auf dem anderen Ziel, und die Temperatur hat den
                      # Schaltpunkt gerade erst überschritten (bis 2 °C über der Schwelle bzw.
                      # bis 1 °C unter Schwelle minus Hysterese). Sonst zählt nur das gültige
                      # Ziel — z.B. "per Hand ganz zu" im Winter (Hitzeschutz-Ziel meist 0)
                      # bleibt ein Eingriff. Ohne Blendschutz (beide Ziele gleich) wirkungslos
                      target_switch: >-
                        {% if target_position | int == heat_target | int %}
                          {{ (current_position - glare_target | int) | abs < shading_min_change
                             and outdoor_temp < shading_temp_threshold + 2 }}
                        {% else %}
                          {{ (current_position - heat_target | int) | abs < shading_min_change
                             and temp_cooled
                             and outdoor_temp > shading_temp_threshold - shading_temp_hysteresis - 1 }}
                        {% endif %}
                  # Blendschutz fährt nur herunter: Steht der Rollladen beim Start unter der
                  # Temperatur-Schwelle schon tiefer als das Ziel (z.B. morgens noch zu oder
                  # per Hand geschlossen), bleibt er dort — es beginnt keine Episode
                  - condition: >-
                      {{ is_state(shading_status_helper, 'on')
                         or outdoor_temp >= shading_temp_threshold
                         or current_position > target_position | int - shading_min_change }}
                  - if:
                      - "{{ is_state(shading_status_helper, 'on') }}"
                    then:
                      # Beschattung läuft bereits: nur kleine Abweichungen nachführen.
                      # Große Abweichungen können nicht vom Sonnenstand kommen (der
                      # wandert pro Tick nur wenige Prozent) — das war ein manueller
                      # Eingriff und wird bis zum Beschattungs-Ende respektiert — mit
                      # gesetzter Dauer nur, bis der Rollladen mindestens so lange stillsteht.
                      # Der Mindestabstand bremst nur dieses Nachführen; Beginn und
                      # Ende der Beschattung laufen immer sofort.
                      - if:
                          - "{{ deviation >= shading_min_change and (deviation <= shading_override_threshold or override_expired or target_switch or shading_resync) }}"
                          - "{{ move_interval_ok }}"
                        then:
                          - action: cover.set_cover_position
                            target:
                              entity_id: !input cover
                            data:
                              position: "{{ target_position }}"
                          - event: s42_rollladen_status
                            event_data:
                              cover: "{{ cover_entity }}"
                              text: "{{ 'Blendschutz' if glare_enabled and target_position | int != heat_target | int else 'Beschattung' }} → {{ target_position | int }} %"
                      # Abgleich erledigt (gefahren oder schon synchron) — bremst der
                      # Mindestabstand, bleibt der Merker für den nächsten Tick
                      - if:
                          - "{{ shading_resync }}"
                          - "{{ deviation < shading_min_change or move_interval_ok }}"
                        then:
                          - action: scene.delete
                            continue_on_error: true
                            target:
                              entity_id: "{{ shading_resync_marker }}"
                    else:
                      # Beschattung beginnt: Anfangsbewegung immer ausführen; ein alter
                      # Abgleich-Merker ist damit hinfällig
                      - if:
                          - "{{ shading_resync }}"
                        then:
                          - action: scene.delete
                            continue_on_error: true
                            target:
                              entity_id: "{{ shading_resync_marker }}"
                      - action: input_boolean.turn_on
                        target:
                          entity_id: "{{ shading_status_helper }}"
                      - if:
                          - "{{ deviation >= shading_min_change }}"
                        then:
                          - action: cover.set_cover_position
                            target:
                              entity_id: !input cover
                            data:
                              position: "{{ target_position }}"
                          - event: s42_rollladen_status
                            event_data:
                              cover: "{{ cover_entity }}"
                              text: "{{ 'Blendschutz' if glare_enabled and target_position | int != heat_target | int else 'Beschattung' }} beginnt → {{ target_position | int }} %"
              # Beschattung beenden. Mit Blendschutz beendet Abkühlen die Episode
              # nicht (sonst Ende/Neustart-Pendeln) — sie wechselt oben ins
              # Blendschutz-Ziel
              - conditions:
                  - "{{ is_state(shading_status_helper, 'on') }}"
                  - >-
                    {{ (((not sun_in_window)
                         or (not glare_enabled and temp_cooled)
                         or (weather_bad if shading_end_delay | int(0) > 0 else weather_bad_stable))
                        and end_debounced)
                       or enable_off
                       or not shading_time_ok }}
                  - "{{ not night_mode_on }}"
                sequence:
                  - action: input_boolean.turn_off
                    target:
                      entity_id: "{{ shading_status_helper }}"
                  - if:
                      - "{{ expand(shading_resync_marker) | count > 0 }}"
                    then:
                      - action: scene.delete
                        continue_on_error: true
                        target:
                          entity_id: "{{ shading_resync_marker }}"
                  # Hindernis-Sperre: Das Ende fährt meist nach oben — liegt die
                  # End-Position tiefer als der Rollladen (oder ist dessen Position
                  # unbekannt), bleibt er während der Sperre stehen
                  - condition: >-
                      {{ not block_active
                         or state_attr(cover_entity, 'current_position') | int(101) <= shading_end_position }}
                  - action: cover.set_cover_position
                    target:
                      entity_id: !input cover
                    data:
                      # Frostschutz: bei Frost höchstens bis zur Frost-Position
                      position: >-
                        {{ [shading_end_position | int, frost_max_position | int] | min if frost_active
                           else shading_end_position | int }}
                  - event: s42_rollladen_status
                    event_data:
                      cover: "{{ cover_entity }}"
                      text: "Beschattungs-Ende → {{ [shading_end_position | int, frost_max_position | int] | min if frost_active else shading_end_position | int }} %"
                  # Wie bei Morgens öffnen: Endet die Beschattung während des Lüftens,
                  # ersetzt die End-Position die gemerkte Ausgangsposition (sonst holt
                  # das Zurückfahren die alte Beschattungs-Position zurück)
                  - if:
                      - "{{ window_state not in ['off', 'closed'] }}"
                      - "{{ expand(reclose_scene) | count > 0 }}"
                    then:
                      - action: scene.delete
                        continue_on_error: true
                        target:
                          entity_id: "{{ reclose_scene }}"

      # --- SONNENHEIZEN (Winter) ---
      - conditions:
          - condition: trigger
            id: solar_heating_tick
        sequence:
          - if:
              - "{{ solar_heating_status_helper is not string }}"
            then:
              - action: persistent_notification.create
                data:
                  notification_id: "rollladen_heizhelfer_fehlt_{{ cover_entity | slugify }}"
                  title: "Rollladensteuerung: Status-Helfer fehlt"
                  message: >-
                    Sonnenheizen für "{{ state_attr(cover_entity, 'friendly_name') or cover_entity }}"
                    ist aktiviert, aber es ist kein eigener Status-Helfer (input_boolean)
                    ausgewählt — das Feature bleibt dadurch wirkungslos.
                    Bitte in der Automation einen Helfer auswählen oder Sonnenheizen
                    deaktivieren.
              - stop: "Sonnenheizen aktiviert, aber kein Status-Helfer konfiguriert"
          # Bei Abwesenheit unten gehalten: nicht öffnen (Sichtschutz geht vor)
          - condition: "{{ not away_hold }}"
          # Regenschutz aktiv: der Rollladen in Regenposition ist nicht "vergessen"
          - condition: "{{ not rain_hold }}"
          - variables:
              sun_elevation: "{{ state_attr('sun.sun', 'elevation') | float(0) }}"
              sun_azimuth: "{{ state_attr('sun.sun', 'azimuth') | float(0) }}"
              az_diff: "{{ ((sun_azimuth - window_azimuth + 180) % 360) - 180 }}"
              sun_in_window: >-
                {{ sun_elevation >= shading_min_elevation
                   and sun_elevation <= shading_max_elevation
                   and az_diff >= (0 - shading_fov_left)
                   and az_diff <= shading_fov_right }}
              # Fallback +99 (statt -99 wie beim Sonnenschutz): fehlt die
              # Temperaturquelle, soll die "<= Schwelle"-Prüfung sicher scheitern,
              # damit Sonnenheizen ohne Datenquelle einfach aus bleibt statt zu spinnen
              outdoor_temp: >-
                {% if shading_temp_sensor is string %}
                  {{ states(shading_temp_sensor) | float(99) }}
                {% elif weather_entity is string %}
                  {{ state_attr(weather_entity, 'temperature') | float(99) }}
                {% else %}
                  99
                {% endif %}
              # Ein unavailable-Blip der Temperaturquelle darf die Einmal-Semantik
              # nicht brechen (sonst: Helfer-Reset -> erneutes Aufdrängen nach Blip)
              temp_available: >-
                {% if shading_temp_sensor is string %}
                  {{ has_value(shading_temp_sensor) }}
                {% elif weather_entity is string %}
                  {{ has_value(weather_entity) and state_attr(weather_entity, 'temperature') is not none }}
                {% else %}
                  false
                {% endif %}
              wind_now: >-
                {% if storm_wind_sensor is string %}
                  {{ states(storm_wind_sensor) | float(0) }}
                {% elif weather_entity is string %}
                  {{ state_attr(weather_entity, 'wind_speed') | float(0) }}
                {% else %}
                  0
                {% endif %}
              storm_ok: "{{ not storm_enabled or (wind_now | float(0)) < wind_speed_threshold }}"
              # Motorschonung wie beim Nachführen der Beschattung (siehe dort)
              move_interval_ok: >-
                {% set s = states[cover_entity] %}
                {{ (min_move_interval | float(0)) <= 0
                   or s is none
                   or (as_timestamp(now()) - as_timestamp(s.last_updated)) >= (min_move_interval | float(0)) * 60 - 60 }}
          - choose:
              # Sonnenheizen starten: heruntergelassenen Rollladen öffnen.
              # Der Sturmschutz hat immer Vorrang: bei Starkwind wird nicht geöffnet
              # (im Panzer-Modus wäre das direkt kontraproduktiv)
              - conditions:
                  - "{{ not is_state(solar_heating_status_helper, 'on') }}"
                  - "{{ sun_in_window and outdoor_temp <= solar_heating_temp_threshold }}"
                  - "{{ not night_mode_on }}"
                  - "{{ storm_ok }}"
                  # Mindestabstand als Bedingung (nicht erst vor der Fahrt): Der Helfer
                  # bleibt aus, der nächste Tick nach Ablauf öffnet regulär
                  - "{{ move_interval_ok }}"
                  - >-
                    {{ state_attr(cover_entity, 'current_position') is not none
                       and state_attr(cover_entity, 'current_position') | int(101) < solar_heating_min_position }}
                sequence:
                  # Helfer zuerst setzen: verhindert, dass ein manuelles Wieder-Runterfahren
                  # im selben Zeitraum sofort erneut aufgedrängt wird (kein Ping-Pong)
                  - action: input_boolean.turn_on
                    target:
                      entity_id: "{{ solar_heating_status_helper }}"
                  - action: cover.set_cover_position
                    target:
                      entity_id: !input cover
                    data:
                      # Frostschutz: bei Frost höchstens bis zur Frost-Position
                      position: >-
                        {{ [solar_heating_position | int, frost_max_position | int] | min if frost_active
                           else solar_heating_position | int }}
                  - event: s42_rollladen_status
                    event_data:
                      cover: "{{ cover_entity }}"
                      text: "Sonnenheizen → {{ [solar_heating_position | int, frost_max_position | int] | min if frost_active else solar_heating_position | int }} %"
                  # Wie bei Morgens öffnen: Öffnet Sonnenheizen während des Lüftens,
                  # ersetzt das die gemerkte Ausgangsposition (sonst fährt das
                  # Zurückfahren wieder zu, und der gesetzte Helfer verhindert ein
                  # erneutes Öffnen)
                  - if:
                      - "{{ window_state not in ['off', 'closed'] }}"
                      - "{{ expand(reclose_scene) | count > 0 }}"
                    then:
                      - action: scene.delete
                        continue_on_error: true
                        target:
                          entity_id: "{{ reclose_scene }}"
              # Sonnenheizen beenden: nur Status zurücksetzen, kein erzwungenes Schließen —
              # der Rollladen bleibt offen, bis Nachtmodus/Fenster-Interaktion ihn regulär bewegen
              - conditions:
                  - "{{ is_state(solar_heating_status_helper, 'on') }}"
                  - >-
                    {{ (not sun_in_window)
                       or (temp_available and outdoor_temp >= (solar_heating_temp_threshold + solar_heating_temp_hysteresis))
                       or night_mode_on }}
                sequence:
                  - action: input_boolean.turn_off
                    target:
                      entity_id: "{{ solar_heating_status_helper }}"

      # --- MOSKITO-MODUS: LICHTER AUS ---
      - conditions:
          - condition: trigger
            id: mosquito_lights
          - condition: state
            entity_id: sun.sun
            state: below_horizon
          - condition: time
            after: !input mosquito_after_time
        sequence:
          - variables:
              mosquito_area: >-
                {{ mosquito_area_input if mosquito_area_input is string and mosquito_area_input
                   else area_id(window_sensor) if window_sensor is string
                   else none }}
              lights_to_turn_off: >-
                {% if mosquito_area %}
                  {{ expand(area_entities(mosquito_area))
                     | selectattr('domain', 'eq', 'light')
                     | selectattr('state', 'eq', 'on')
                     | map(attribute='entity_id')
                     | reject('in', mosquito_exclude)
                     | list }}
                {% else %}
                  {{ [] }}
                {% endif %}
          - condition: "{{ lights_to_turn_off | length > 0 }}"
          - action: light.turn_off
            target:
              entity_id: "{{ lights_to_turn_off }}"
          - event: s42_rollladen_status
            event_data:
              cover: "{{ cover_entity }}"
              text: "Moskito: {{ lights_to_turn_off | length }} {{ 'Licht' if lights_to_turn_off | length == 1 else 'Lichter' }} aus"

      # --- BENACHRICHTIGUNG: FENSTER LANGE OFFEN/GEKIPPT (+ ERINNERUNGEN) ---
      - conditions:
          - condition: trigger
            id:
              - window_open_long
              - window_tilted_long
          - "{{ not (sleep_mode_boolean is string and is_state(sleep_mode_boolean, 'on')) }}"
          # Ohne Fenstersensor feuern diese Trigger nie — reine Absicherung,
          # denn Bereich/Name unten würden auf der leeren Liste abbrechen
          - "{{ window_sensor is string }}"
          # Ungültige Zusatz-Dienste zählen mit, damit die Log-Warnung auch kommt,
          # wenn sie die einzigen Ziele sind (versendet wird dann nichts)
          - >-
            {{ device_name_map | length > 0
               or notification_extra_services | length > 0
               or notification_extra_parsed.invalid | length > 0 }}
        sequence:
          - variables:
              state_word: "{{ 'offen' if trigger.id == 'window_open_long' else 'gekippt' }}"
              timeout_used: "{{ notification_timeout if trigger.id == 'window_open_long' else notification_timeout_tilted }}"
              has_area: "{{ use_area_name and area_name(window_sensor) is not none }}"
              window_label: >-
                {%- if has_area -%}
                  {{ area_name(window_sensor) }}
                {%- else -%}
                  {{ state_attr(window_sensor, 'friendly_name') or window_sensor }}
                {%- endif -%}
              title_text: >-
                {%- if has_area -%}
                  Fenster {{ state_word }} in {{ window_label }}
                {%- else -%}
                  Fenster {{ state_word }}
                {%- endif -%}
              # Die Erinnerungen gehören zu genau dieser Offen-/Gekippt-Phase
              notify_states: "{{ ['on', 'open'] if trigger.id == 'window_open_long' else ['tilted'] }}"
              # Durchläufe = erste Meldung + Erinnerungen (Abstand 0 = nur die erste)
              notify_rounds: >-
                {{ 1 + (notification_repeat_max | int(0) if notification_repeat_interval | int(0) > 0 else 0) }}
          # Ungültige Zusatz-Dienste nicht still verwerfen, sondern im Log melden
          - if:
              - "{{ notification_extra_parsed.invalid | length > 0 }}"
            then:
              - action: system_log.write
                continue_on_error: true
                data:
                  level: warning
                  message: >-
                    Rollladensteuerung "{{ state_attr(cover_entity, 'friendly_name') or cover_entity }}":
                    Zusatz-Benachrichtigungsdienste mit ungültigem Format ignoriert:
                    {{ notification_extra_parsed.invalid | join(', ') }}
                    (erwartet z.B. notify.alexa_media_kueche)
          - repeat:
              count: "{{ notify_rounds }}"
              sequence:
                # Vor jeder Erinnerung den Abstand abwarten. Jeder echte Zustandswechsel
                # (zu, offen <-> gekippt, Sensor-Aussetzer) beendet die Phase sofort —
                # sonst liefen nach einem Prellen zwei Erinnerungs-Schleifen parallel.
                # "to: null" ignoriert Attribut-Änderungen und force_update-Meldungen
                # mit unverändertem Zustand; das Abräumen erledigt der Schließen-Zweig
                - if:
                    - "{{ repeat.index > 1 }}"
                  then:
                    - wait_for_trigger:
                        - trigger: state
                          entity_id: !input window_sensor
                          to: null
                      timeout:
                        minutes: !input notification_repeat_interval
                      continue_on_timeout: true
                    - if:
                        - "{{ wait.trigger is not none }}"
                      then:
                        - stop: "Fenster-Zustand geändert, Erinnerungen beendet"
                # Vor jedem Versand neu bewerten: Während des Wartens können sich
                # Fenster, Schlafmodus, Pause und Geräte geändert haben
                - variables:
                    same_phase: "{{ (states(window_sensor) | lower) in notify_states }}"
                    sleep_now: "{{ sleep_mode_boolean is string and is_state(sleep_mode_boolean, 'on') }}"
                    pause_now: >-
                      {% set helpers = [pause_boolean] if pause_boolean is string else pause_boolean %}
                      {% set pausing = 'on' if pause_mode == 'on_pauses' else 'off' %}
                      {% set found = expand(helpers) | list %}
                      {{ helpers | length > 0
                         and found | length > 0
                         and found | rejectattr('state', 'eq', pausing) | list | length == 0 }}
                    # Empfänger dieser Meldung: mit "Nur anwesend" nur Geräte, deren
                    # Person zuhause ist. Maßgeblich ist der Geräte-Tracker der Companion
                    # App — ist er einer Person zugeordnet, zählt deren Status, sonst der
                    # Tracker selbst. Geräte ohne Tracker bekommen die Meldung immer
                    # (fail-safe). Pro Runde neu bewertet: Wer inzwischen heimgekommen
                    # ist, bekommt die nächste Erinnerung. Das Abräumen beim Schließen
                    # geht bewusst weiter an ALLE Geräte
                    devices_now: >-
                      {% set ns = namespace(names=[]) %}
                      {% for device_id in notification_device %}
                        {% set device_name = device_attr(device_id, 'name') %}
                        {% if device_name %}
                          {% set dev = namespace(send=true) %}
                          {% if notify_only_when_home %}
                            {% set trackers = device_entities(device_id)
                               | select('match', 'device_tracker\\.') | list %}
                            {% if trackers | count > 0 %}
                              {% set tracker = trackers | first %}
                              {% set persons = states.person
                                 | selectattr('attributes.device_trackers', 'defined')
                                 | selectattr('attributes.device_trackers', 'contains', tracker)
                                 | map(attribute='entity_id') | list %}
                              {% set presence = persons | first if persons | count > 0 else tracker %}
                              {% set dev.send = is_state(presence, 'home') %}
                            {% endif %}
                          {% endif %}
                          {% if dev.send %}
                            {% set ns.names = ns.names + ['mobile_app_' ~ (device_name | slugify)] %}
                          {% endif %}
                        {% endif %}
                      {% endfor %}
                      {{ ns.names }}
                    minutes_open: "{{ (timeout_used + (repeat.index - 1) * notification_repeat_interval) | int }}"
                    message_text: >-
                      {%- if has_area -%}
                        Das Fenster im Bereich '{{ window_label }}' ist seit über {{ minutes_open }} Minuten {{ state_word }}.
                      {%- else -%}
                        Fenster '{{ window_label }}' ist seit über {{ minutes_open }} Minuten {{ state_word }}.
                      {%- endif -%}
                # Ist gerade niemand zuhause ("Nur anwesend"), entfällt nur die
                # Handy-Meldung dieser Runde — die Erinnerungen laufen weiter
                - if:
                    - "{{ not same_phase or (device_name_map | length == 0 and notification_extra_services | length == 0) }}"
                  then:
                    - stop: "Fenster nicht mehr offen bzw. gekippt oder keine Empfänger, Erinnerungen beendet"
                # Schlafmodus oder Pause: diese Erinnerung entfällt, zählt aber mit
                - if:
                    - "{{ not sleep_now and not pause_now }}"
                  then:
                    # Zusatz-Dienste je in einem eigenen Lauf (Event an diese Instanz):
                    # continue_on_error fängt "Dienst nicht gefunden" nicht ab — ein
                    # Tippfehler würde sonst den Versand an die übrigen Ziele und alle
                    # weiteren Erinnerungen abbrechen. Vor den Geräten, damit auch ein
                    # fehlerhaftes Gerät die Zusatz-Dienste nicht mitreißt
                    - repeat:
                        for_each: "{{ notification_extra_services }}"
                        sequence:
                          - event: s42_rollladen_zusatz_meldung
                            event_data:
                              cover: "{{ cover_entity }}"
                              window: "{{ window_sensor }}"
                              notify_service: "{{ repeat.item }}"
                              title: "{{ title_text }}"
                              message: "{{ message_text }}"
                    - repeat:
                        for_each: "{{ devices_now }}"
                        sequence:
                          # Ein einzelnes umbenanntes/entferntes Gerät darf den Versand an
                          # die übrigen Geräte nicht abbrechen
                          - action: "notify.{{ repeat.item }}"
                            continue_on_error: true
                            data:
                              title: "{{ title_text }}"
                              message: "{{ message_text }}"
                              data:
                                # Gleicher Tag pro Fenster: "gekippt" ersetzt eine ältere
                                # "offen"-Meldung, eine Erinnerung die vorherige, und das
                                # Schließen räumt sie wieder ab
                                tag: "{{ notification_tag }}"
                                actions:
                                  - action: "{{ action_id }}"
                                    title: Rollladen schließen

      # --- BENACHRICHTIGUNG: VERSAND AN EINEN ZUSATZ-DIENST ---
      - conditions:
          - condition: trigger
            id: notify_extra_target
          # Nur selbst konfigurierte Ziele bedienen — das Event ist kein offener
          # Versandkanal ("| string": ein reiner Ziffern-Name käme sonst als Zahl an)
          - "{{ trigger.event.data.notify_service | default('') | string in notification_extra_services }}"
        sequence:
          # Titel und Text ohne Actions/Tag — fremde Dienste kennen diese Daten nicht
          - if:
              # Benachrichtigungs-Entität (neuere Integrationen) statt klassischem Dienst
              - "{{ expand('notify.' ~ trigger.event.data.notify_service) | count > 0 }}"
            then:
              - action: notify.send_message
                continue_on_error: true
                target:
                  entity_id: "notify.{{ trigger.event.data.notify_service }}"
                data:
                  title: "{{ trigger.event.data.title }}"
                  message: "{{ trigger.event.data.message }}"
            else:
              - action: "notify.{{ trigger.event.data.notify_service }}"
                continue_on_error: true
                data:
                  title: "{{ trigger.event.data.title }}"
                  message: "{{ trigger.event.data.message }}"

      # --- FENSTER WIEDER ZU: NACHTS SCHLIESSEN + BENACHRICHTIGUNG ABRÄUMEN ---
      - conditions:
          - condition: trigger
            id: window_closed
        sequence:
          # Nachtmodus aktiv → schließen. Greift auch, wenn kein Lauf der
          # Fenster-Interaktion mehr wartet (Fenster länger offen als das Zeitfenster
          # oder schon vor dem Nachtmodus offen) — sonst bliebe die Lüftungsposition
          # die ganze Nacht stehen. Innerhalb des Zeitfensters schließt der wartende
          # Lauf auf dieselbe Zustandsänderung mit; das doppelte close ist harmlos.
          # Pause- und Notfall-Gate lassen window_closed fürs Abräumen durch, daher
          # Pause, Notfall, Hindernis-Sperre und Sturm hier selbst prüfen. Nur nach echtem Öffnen/Kippen — ein
          # unavailable-Blip des Sensors soll keinen Rollladen nachts zufahren
          - variables:
              wind_now: >-
                {% if storm_wind_sensor is string %}
                  {{ states(storm_wind_sensor) | float(0) }}
                {% elif weather_entity is string %}
                  {{ state_attr(weather_entity, 'wind_speed') | float(0) }}
                {% else %}
                  0
                {% endif %}
          - if:
              - "{{ trigger.from_state is not none and trigger.from_state.state | lower in ['on', 'open', 'tilted'] }}"
              - "{{ night_mode_on }}"
              - "{{ not pause_active }}"
              - "{{ not emergency_active }}"
              - "{{ not block_active }}"
              - "{{ not storm_enabled or (wind_now | float(0)) < wind_speed_threshold }}"
              - "{{ states(cover_entity) not in ['closed', 'closing'] }}"
            then:
              # Wie im Nachtmodus-Zweig: ganz schließen oder nur abwärts auf die
              # Nachtposition. Ein Fehler beim Fahren darf das Abräumen der Meldung
              # nicht verhindern
              - choose:
                  - conditions:
                      - "{{ night_close_position | int(0) == 0 or state_attr(cover_entity, 'current_position') is none }}"
                    sequence:
                      - action: cover.close_cover
                        continue_on_error: true
                        target:
                          entity_id: !input cover
                      - event: s42_rollladen_status
                        event_data:
                          cover: "{{ cover_entity }}"
                          text: "Fenster zu → zu (Nachtmodus)"
                  - conditions:
                      - "{{ state_attr(cover_entity, 'current_position') | int(-1) > night_close_position | int(0) }}"
                    sequence:
                      - action: cover.set_cover_position
                        continue_on_error: true
                        target:
                          entity_id: !input cover
                        data:
                          position: !input night_close_position
                      - event: s42_rollladen_status
                        event_data:
                          cover: "{{ cover_entity }}"
                          text: "Fenster zu → {{ night_close_position | int }} % (Nachtmodus)"
          - if:
              - "{{ device_name_map | length > 0 }}"
            then:
              - repeat:
                  for_each: "{{ device_name_map }}"
                  sequence:
                    - action: "notify.{{ repeat.item }}"
                      continue_on_error: true
                      data:
                        message: clear_notification
                        data:
                          tag: "{{ notification_tag }}"

      # --- NOTIFICATION-ACTION: ROLLLADEN SCHLIESSEN ---
      - conditions:
          - condition: trigger
            id: close_shutter_action
          - "{{ trigger.event.data.action == action_id }}"
          # Anders als die Pause sperrt das Hindernis auch den bewussten Befehl —
          # vom Handy aus ist die offene Fliegengittertür nicht zu sehen
          - "{{ not block_active }}"
        sequence:
          - action: cover.close_cover
            target:
              entity_id: !input cover
          - event: s42_rollladen_status
            event_data:
              cover: "{{ cover_entity }}"
              text: 'Knopf "Rollladen schließen" → zu'

      # --- FENSTER-INTERAKTION (KIPPEN/ÖFFNEN + ZURÜCKFAHREN) ---
      - conditions:
          - condition: trigger
            id: window_change
        sequence:
          # Ausgangsposition nur beim Übergang aus "geschlossen" sichern — sonst
          # überschreibt Kippen→Öffnen den Snapshot mit der Kipp-Position. Nach
          # unavailable/unknown nur sichern, wenn noch KEIN Snapshot existiert:
          # nach einem HA-Neustart fehlt er (Szene weg), aber bei einem Sensor-Blip
          # am offenen Fenster würde er sonst mit der Offen-Position überschrieben.
          # Ein Zwischenzustand, der kürzer als die Reaktionszeit anlag, zählt wie
          # "geschlossen": Fenstergriff-Sensoren melden beim Drehen von zu nach
          # gekippt kurz "offen" — dieser Zustand hat keinen eigenen Lauf ausgelöst,
          # das Fenster war davor also zu
          - if:
              - >-
                {{ trigger.from_state is not none
                   and (trigger.from_state.state | lower in ['off', 'closed']
                        or (trigger.from_state.state in ['unavailable', 'unknown']
                            and expand(reclose_scene) | count == 0)
                        or (trigger.from_state.state | lower in ['on', 'open', 'tilted']
                            and as_timestamp(trigger.to_state.last_changed)
                                - as_timestamp(trigger.from_state.last_changed)
                                < window_reaction_delay | float(2))) }}
            then:
              - action: scene.create
                data:
                  scene_id: "{{ 'reclose_' ~ (cover_entity | slugify) }}"
                  snapshot_entities:
                    - "{{ cover_entity }}"
          - choose:
              # Regenschutz: Es regnet bereits — statt der Lüftungsposition höchstens
              # die Regenposition (nur abwärts). Sturm hat Vorrang (außer Panzer-Modus)
              - conditions:
                  - "{{ rain_hold }}"
                  - "{{ not rain_storm_active or panzer_mode }}"
                sequence:
                  - if:
                      - "{{ state_attr(cover_entity, 'current_position') | int(-1) > rain_position }}"
                      - "{{ not block_active }}"
                    then:
                      - if:
                          - "{{ rain_restore and expand(rain_scene) | count == 0 }}"
                        then:
                          - action: scene.create
                            data:
                              scene_id: "{{ 'rain_' ~ (cover_entity | slugify) }}"
                              snapshot_entities:
                                - "{{ cover_entity }}"
                      - action: cover.set_cover_position
                        target:
                          entity_id: !input cover
                        data:
                          position: !input rain_position
                      - event: s42_rollladen_status
                        event_data:
                          cover: "{{ cover_entity }}"
                          text: "Fenster {{ 'gekippt' if trigger.to_state.state | lower == 'tilted' else 'offen' }} → {{ rain_position | int }} % (Regen)"
                      # Beschattungs-Status NICHT freigeben (sonst ginge ein Beschattungs-Ende
                      # verloren, das in die Zwischenzeit fällt), sondern zum Abgleich vormerken:
                      # Der nächste Tick fährt auf die Sollposition, ohne die Abweichung als
                      # manuellen Eingriff zu werten — oder beendet die Beschattung regulär
                      - if:
                          - "{{ shading_status_helper is string and is_state(shading_status_helper, 'on') }}"
                        then:
                          - action: scene.create
                            data:
                              scene_id: "{{ 'shading_resync_' ~ (cover_entity | slugify) }}"
                              snapshot_entities:
                                - "{{ cover_entity }}"
              - conditions:
                  - "{{ trigger.to_state.state | lower == 'tilted' or (treat_open_as_tilted and trigger.to_state.state | lower in ['on', 'open']) }}"
                  - "{{ state_attr(cover_entity, 'current_position') | int(101) < tilted_position }}"
                sequence:
                  - action: cover.set_cover_position
                    target:
                      entity_id: !input cover
                    data:
                      position: !input tilted_position
                  - event: s42_rollladen_status
                    event_data:
                      cover: "{{ cover_entity }}"
                      text: "{{ 'Fenster gekippt' if trigger.to_state.state | lower == 'tilted' else 'Fenster offen' }} → {{ tilted_position | int }} %{{ '' if trigger.to_state.state | lower == 'tilted' else ' (wie gekippt)' }}"
              - conditions:
                  - "{{ trigger.to_state.state | lower in ['on', 'open'] }}"
                  - "{{ not treat_open_as_tilted }}"
                  - "{{ not night_mode_on }}"
                  # Bei aktiver erzwungener Beschattung bleibt der Rollladen unten
                  - "{{ not (force_shading and shading_status_helper is string and is_state(shading_status_helper, 'on')) }}"
                sequence:
                  # Ziel beim Öffnen: "Position bei geöffnetem Fenster", bei Frost höchstens
                  # die Frost-Position. Bei 100 % (bisheriges Verhalten) oder ohne
                  # Positions-Attribut ganz öffnen (dann kann auch der Frostschutz nicht
                  # begrenzen), sonst nur aufwärts auf das Ziel fahren
                  - variables:
                      open_target: >-
                        {{ [open_position | int(100), frost_max_position | int(100)] | min if frost_active
                           else open_position | int(100) }}
                      open_full: >-
                        {{ open_target | int(100) >= 100
                           or state_attr(cover_entity, 'current_position') is none }}
                      open_partial: >-
                        {{ not open_full
                           and state_attr(cover_entity, 'current_position') | int(101) < open_target | int(100) }}
                  - choose:
                      - conditions:
                          - "{{ open_full }}"
                        sequence:
                          - action: cover.open_cover
                            target:
                              entity_id: !input cover
                          - event: s42_rollladen_status
                            event_data:
                              cover: "{{ cover_entity }}"
                              text: "Fenster offen → auf"
                      - conditions:
                          - "{{ open_partial }}"
                        sequence:
                          - action: cover.set_cover_position
                            target:
                              entity_id: !input cover
                            data:
                              position: "{{ open_target }}"
                          - event: s42_rollladen_status
                            event_data:
                              cover: "{{ cover_entity }}"
                              text: "Fenster offen → {{ open_target | int }} %{{ ' (Frost-Grenze)' if frost_active and open_target | int < open_position | int else '' }}"
                  # Beschattungs-Status freigeben: Das Öffnen fürs Lüften ist kein
                  # manueller Eingriff — nach dem Schließen (oder Timeout) darf der
                  # nächste Tick wieder beschatten, statt bis Tagesende zu pausieren.
                  # Ohne Fahrt (Rollladen stand schon höher) bleibt der Status, damit
                  # das Beschattungs-Ende den Rollladen weiterhin regulär öffnet
                  - if:
                      - "{{ open_full or open_partial }}"
                      - "{{ shading_status_helper is string and is_state(shading_status_helper, 'on') }}"
                    then:
                      - action: input_boolean.turn_off
                        target:
                          entity_id: "{{ shading_status_helper }}"
              # Nachts nur bis zur Lüftungsposition öffnen statt komplett
              - conditions:
                  - "{{ trigger.to_state.state | lower in ['on', 'open'] }}"
                  - "{{ not treat_open_as_tilted }}"
                  - "{{ night_mode_on }}"
                  - "{{ state_attr(cover_entity, 'current_position') | int(101) < night_ventilation_position }}"
                sequence:
                  - action: cover.set_cover_position
                    target:
                      entity_id: !input cover
                    data:
                      position: !input night_ventilation_position
                  - event: s42_rollladen_status
                    event_data:
                      cover: "{{ cover_entity }}"
                      text: "Fenster offen → {{ night_ventilation_position | int }} % (Nachtmodus)"
          - wait_for_trigger:
              - trigger: state
                entity_id: !input window_sensor
                to:
                  - "off"
                  - "closed"
                  - "Closed"
                for:
                  seconds: !input window_reaction_delay
              # Ein Notfall beendet das Warten sofort (Auswertung unten)
              - trigger: state
                entity_id: !input emergency_sensors
                to: "on"
                id: emergency_during_wait
            timeout:
              minutes: !input reclose_timeout
            continue_on_timeout: true
          # Zustand NACH dem Warten neu bewerten — währenddessen können Nachtmodus
          # oder Sturm aktiv geworden sein, dann darf der Snapshot nicht zurückgeholt werden
          - variables:
              # Gleiche Logik wie morning_open_due, night_mode_on und night_sun oben,
              # aber mit Uhrzeit und Sonnenstand von jetzt
              morning_open_due_now: >-
                {{ morning_enabled and morning_sun_enabled
                   and (state_attr('sun.sun', 'elevation') | float(-90) > morning_sun_elevation
                        or now().strftime('%H:%M:%S') >= today_at(morning_latest).strftime('%H:%M:%S')) }}
              night_mode_on_now: >-
                {% if night_mode_boolean is string %}
                  {{ is_state(night_mode_boolean, 'on') }}
                {% elif night_mode_time is string and has_value(night_mode_time) %}
                  {% set t = now().strftime('%H:%M:%S') %}
                  {% set start = states(night_mode_time)[-8:] %}
                  {% if morning_time is string and has_value(morning_time) %}
                    {% set end = states(morning_time)[-8:] %}
                    {% set sun_up = false %}
                  {% else %}
                    {% set rising = as_datetime(state_attr('sun.sun', 'next_rising'), none) %}
                    {% set end = (rising | as_local).strftime('%H:%M:%S') if rising else start %}
                    {% set sun_up = t < '12:00:00' and (is_state('sun.sun', 'above_horizon') or morning_open_due_now) %}
                  {% endif %}
                  {{ ((start <= t < end) if start <= end else (t >= start or t < end)) and not sun_up }}
                {% elif night_sun_enabled and night_mode_time is not string %}
                  {% set t = now().strftime('%H:%M:%S') %}
                  {% set e = today_at(night_earliest).strftime('%H:%M:%S') %}
                  {% set l = today_at(night_latest).strftime('%H:%M:%S') %}
                  {% if morning_time is string and has_value(morning_time) %}
                    {% set end = states(morning_time)[-8:] %}
                    {% set sun_up = false %}
                  {% else %}
                    {% set rising = as_datetime(state_attr('sun.sun', 'next_rising'), none) %}
                    {% set end = (rising | as_local).strftime('%H:%M:%S') if rising else '12:00:00' %}
                    {% set sun_up = t < '12:00:00' and (is_state('sun.sun', 'above_horizon') or morning_open_due_now) %}
                  {% endif %}
                  {% set elev = state_attr('sun.sun', 'elevation') %}
                  {% set low = elev is number and elev < night_sun_elevation %}
                  {% set after_e = (e <= t < end) if e <= end else (t >= e or t < end) %}
                  {% set after_l = (l <= t < end) if l <= end else (t >= l or t < end) %}
                  {{ after_e and (low or after_l) and not sun_up }}
                {% else %}
                  {{ false }}
                {% endif %}
              pause_now: >-
                {% set helpers = [pause_boolean] if pause_boolean is string else pause_boolean %}
                {% set pausing = 'on' if pause_mode == 'on_pauses' else 'off' %}
                {% set found = expand(helpers) | list %}
                {{ helpers | length > 0
                   and found | length > 0
                   and found | rejectattr('state', 'eq', pausing) | list | length == 0 }}
              # Notfall während des Wartens begonnen oder gerade aktiv
              emergency_now: >-
                {% set sensors = [emergency_sensors] if emergency_sensors is string else emergency_sensors %}
                {{ (wait.trigger is not none and wait.trigger.id == 'emergency_during_wait')
                   or sensors | select('is_state', 'on') | list | length > 0 }}
              # Hindernis-Sperre neu bewerten (gleiche Logik wie block_active)
              block_now: >-
                {% set sensors = [block_sensors] if block_sensors is string else block_sensors %}
                {% set ns = namespace(blocked = false) %}
                {% for s in sensors %}
                  {% if states(s) != 'off'
                        or as_timestamp(now()) - as_timestamp(states[s].last_changed) < (block_release_delay | float(0)) * 60 - 2 %}
                    {% set ns.blocked = true %}
                  {% endif %}
                {% endfor %}
                {{ ns.blocked }}
              wind_now: >-
                {% if storm_wind_sensor is string %}
                  {{ states(storm_wind_sensor) | float(0) }}
                {% elif weather_entity is string %}
                  {{ state_attr(weather_entity, 'wind_speed') | float(0) }}
                {% else %}
                  0
                {% endif %}
              storm_now: "{{ storm_enabled and (wind_now | float(0)) >= wind_speed_threshold }}"
          # Ein Notfall beendet den Lüften-Lauf endgültig: Der Notfall-Zweig hat
          # geöffnet — kein Zurückfahren und kein erzwungenes Schließen, auch
          # nicht nach dem Ende des Alarms
          - condition: "{{ not emergency_now }}"
          - if:
              - "{{ wait.trigger is none }}"
            then:
              - if:
                  - "{{ force_close }}"
                  # Während der Pause wird auch nach Timeout nichts bewegt
                  - "{{ not pause_now }}"
                  - "{{ not block_now }}"
                then:
                  - action: cover.close_cover
                    target:
                      entity_id: !input cover
                  - event: s42_rollladen_status
                    event_data:
                      cover: "{{ cover_entity }}"
                      text: "Schließen erzwingen → zu (nach {{ reclose_timeout | int }} Min.)"
            else:
              - choose:
                  # Fenster zu + Nachtmodus inzwischen aktiv → schließen statt restaurieren
                  # (wie im Nachtmodus-Zweig: ganz oder nur abwärts auf die Nachtposition)
                  - conditions:
                      - "{{ night_mode_on_now }}"
                      - "{{ not pause_now }}"
                      - "{{ not block_now }}"
                    sequence:
                      - choose:
                          - conditions:
                              - "{{ night_close_position | int(0) == 0 or state_attr(cover_entity, 'current_position') is none }}"
                            sequence:
                              - action: cover.close_cover
                                target:
                                  entity_id: !input cover
                              - event: s42_rollladen_status
                                event_data:
                                  cover: "{{ cover_entity }}"
                                  text: "Zurückfahren → zu (Nachtmodus)"
                          - conditions:
                              - "{{ state_attr(cover_entity, 'current_position') | int(-1) > night_close_position | int(0) }}"
                            sequence:
                              - action: cover.set_cover_position
                                target:
                                  entity_id: !input cover
                                data:
                                  position: !input night_close_position
                              - event: s42_rollladen_status
                                event_data:
                                  cover: "{{ cover_entity }}"
                                  text: "Zurückfahren → {{ night_close_position | int }} % (Nachtmodus)"
                  # Normalfall: Ausgangsposition wiederherstellen (nur wenn der
                  # Snapshot existiert, kein Sturm aktiv ist und keine Pause läuft).
                  # Existenz via expand
                  # prüfen — der State einer Szene ist ihr letzter Aktivierungs-
                  # Zeitstempel und steht bei nie aktivierten Szenen dauerhaft auf
                  # 'unknown'; ein State-Check würde den ersten Restore für immer blockieren
                  - conditions:
                      - "{{ not storm_now }}"
                      - "{{ not pause_now }}"
                      # Hindernis-Sperre: Das Ziel des Snapshots ist unbekannt, und
                      # nach dem Lüften geht es praktisch immer nach unten → auslassen
                      - "{{ not block_now }}"
                      - "{{ expand(reclose_scene) | count > 0 }}"
                    sequence:
                      - action: scene.turn_on
                        target:
                          entity_id: "{{ reclose_scene }}"
                      - event: s42_rollladen_status
                        event_data:
                          cover: "{{ cover_entity }}"
                          text: "Zurückfahren → Ausgangsposition"
                      # Restore ist eine Fremdbewegung: Beschattungs-Status freigeben,
                      # damit der nächste Tick bei Bedarf frisch beschattet, statt die
                      # Abweichung als manuellen Eingriff bis Tagesende zu sperren
                      - if:
                          - "{{ shading_status_helper is string and is_state(shading_status_helper, 'on') }}"
                        then:
                          - action: input_boolean.turn_off
                            target:
                              entity_id: "{{ shading_status_helper }}"
                # Nur Diagnose: Zurückfahren bewusst ausgelassen (bewegt nichts)
                default:
                  - event: s42_rollladen_status
                    event_data:
                      cover: "{{ cover_entity }}"
                      text: >-
                        Zurückfahren übersprungen
                        ({{ 'Sturm' if storm_now else 'Pause' if pause_now else 'Hindernis' if block_now
                            else 'Ausgangsposition unbekannt' }})

      # --- REGENSCHUTZ: REGEN BEI GEKIPPTEM FENSTER ---
      - conditions:
          - condition: trigger
            id: rain_start
          - "{{ rain_hold }}"
          # Sturm hat Vorrang (außer im Panzer-Modus, dort ist Herunterfahren
          # ohnehin die Schutzrichtung)
          - "{{ not rain_storm_active or panzer_mode }}"
          # Nur abwärts: Steht der Rollladen schon tiefer, bleibt er dort
          - "{{ state_attr(cover_entity, 'current_position') | int(-1) > rain_position }}"
          # Hindernis-Sperre: nicht herunterfahren (Notfall sortiert das Gate oben aus)
          - "{{ not block_active }}"
        sequence:
          # Position von vor dem Regen sichern — nur, wenn noch kein Regen-Snapshot
          # existiert: Ein neuer Schauer nach kurzer Regenpause (oder ein Fenster-
          # Wechsel im selben Moment) darf ihn nicht mit der Regenposition überschreiben
          - if:
              - "{{ rain_restore and expand(rain_scene) | count == 0 }}"
            then:
              - action: scene.create
                data:
                  scene_id: "{{ 'rain_' ~ (cover_entity | slugify) }}"
                  snapshot_entities:
                    - "{{ cover_entity }}"
          - action: cover.set_cover_position
            target:
              entity_id: !input cover
            data:
              position: !input rain_position
          - event: s42_rollladen_status
            event_data:
              cover: "{{ cover_entity }}"
              text: "Regen → {{ rain_position | int }} % (Fenster {{ 'gekippt' if window_state == 'tilted' else 'offen' }})"
          # Regenfahrt ist eine Fremdbewegung, kein manueller Eingriff.
          # Beschattungs-Status NICHT freigeben (sonst ginge ein Beschattungs-Ende
          # verloren, das in die Zwischenzeit fällt), sondern zum Abgleich vormerken:
          # Der nächste Tick fährt auf die Sollposition, ohne die Abweichung als
          # manuellen Eingriff zu werten — oder beendet die Beschattung regulär
          - if:
              - "{{ shading_status_helper is string and is_state(shading_status_helper, 'on') }}"
            then:
              - action: scene.create
                data:
                  scene_id: "{{ 'shading_resync_' ~ (cover_entity | slugify) }}"
                  snapshot_entities:
                    - "{{ cover_entity }}"

      # --- REGENSCHUTZ: REGEN VORBEI → ZURÜCKFAHREN ---
      # Läuft auch während der Pause (Gate-Ausnahme), damit der Snapshot sicher
      # verworfen wird — zurückgefahren wird dann aber nicht
      - conditions:
          - condition: trigger
            id: rain_end
          - "{{ expand(rain_scene) | count > 0 }}"
        sequence:
          # Zustand jetzt bewerten: Fenster noch im geschützten Zustand, kein
          # Nachtmodus, kein Sturm, keine Pause, kein Notfall — sonst nur den
          # Snapshot verwerfen. Der Beschattungs-Status bleibt an: Den Abgleich hat
          # der Regenbeginn vorgemerkt (shading_resync_marker) — ist die Sonne
          # inzwischen weg, beendet der nächste Tick die Beschattung regulär
          - if:
              - "{{ rain_restore }}"
              - "{{ rain_window_protected }}"
              - "{{ not night_mode_on }}"
              - "{{ not rain_storm_active }}"
              - "{{ not pause_active }}"
              - "{{ not emergency_active }}"
            then:
              - action: scene.turn_on
                target:
                  entity_id: "{{ rain_scene }}"
              - event: s42_rollladen_status
                event_data:
                  cover: "{{ cover_entity }}"
                  text: "Regen vorbei → Position von vorher"
          # Der Regen ist vorbei: Snapshot in jedem Fall verwerfen, sonst würde der
          # nächste Regen ihn nicht neu anlegen (continue_on_error: paralleler Lauf
          # hat ihn evtl. schon gelöscht)
          - action: scene.delete
            target:
              entity_id: "{{ rain_scene }}"
            continue_on_error: true

      # --- REGENSCHUTZ: FENSTER ZU → REGEN-SNAPSHOT VERWERFEN ---
      # Das Zurückfahren übernimmt die normale Fenster-Interaktion
      - conditions:
          - condition: trigger
            id: rain_window_closed
          - "{{ expand(rain_scene) | count > 0 }}"
        sequence:
          - action: scene.delete
            target:
              entity_id: "{{ rain_scene }}"
            continue_on_error: true
